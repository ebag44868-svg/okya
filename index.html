// ── 메시지 탭 (검색 + 최근 대화, 클릭 시 전체화면 채팅) ──
async function rSearch(){
  TAB='search'
  const personRow=(u,sub,unread)=>`<div class="lrow" data-uid="${u.id}" style="cursor:pointer"><div class="chip ti-blue" style="border-radius:50%;overflow:hidden;font-weight:800">${u.photo?`<img src="${u.photo}" style="width:100%;height:100%;object-fit:cover">`:esc((u.name||'?').charAt(0))}</div><div class="body"><div class="ti">${esc(u.name)}${u.role==='admin'?' <span style="font-size:11px;color:var(--primary);font-weight:700">학생회</span>':''}</div><div class="su">${sub}</div></div>${unread?'<span class="dm-unread"></span>':`<span style="color:#c9cdd8;display:flex">${I.chev}</span>`}</div>`
  app().innerHTML=`<div class="screen fade-in p3">
    <div class="topbar"><div class="t">메시지</div><div style="width:34px"></div></div>
    <div style="padding:2px 18px 0"><div style="display:flex;align-items:center;gap:9px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 15px"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="srch-inp" placeholder="이름으로 검색해 새 대화 시작" style="flex:1;background:none;border:none;outline:none;font-size:14px;padding:0" autocomplete="off"></div></div>
    <div id="srch-res"></div>
    <div id="dm-hist"><div class="sec" style="margin:20px 20px 8px">최근 대화</div><div class="pcard"><div id="dm-hist-list"><div class="loader" style="min-height:80px"><div class="spin"></div></div></div></div></div>
  </div>${bnav()}`
  bindNav()

  const inp=document.getElementById('srch-inp')
  const res=document.getElementById('srch-res')
  const hist=document.getElementById('dm-hist')

  const showResults=q=>{
    const trimmed=q.trim()
    hist.style.display=trimmed?'none':'block'
    if(!trimmed){res.innerHTML='';return}
    const found=USERS.filter(u=>u.id!==SESSION.id&&u.name.includes(trimmed))
    res.innerHTML=found.length
      ?`<div class="sec" style="margin:16px 20px 8px">새 대화</div><div class="pcard">${found.map(u=>personRow(u,u.role==='admin'?'학생회':'학생')).join('')}</div>`
      :`<div class="empty">검색 결과가 없어요</div>`
    res.querySelectorAll('[data-uid]').forEach(el=>{el.onclick=()=>push(()=>rDmChat(el.dataset.uid))})
  }
  inp.oninput=()=>showResults(inp.value)

  // 최근 DM 로드
  let dms=[]
  try{
    const{data}=await wt(sb.from('okya_dm').select('*').or(`from_id.eq.${SESSION.id},to_id.eq.${SESSION.id}`).order('at',{ascending:false}),5000)
    const seen=new Set()
    dms=(data||[]).filter(dm=>{const other=dm.from_id===SESSION.id?dm.to_id:dm.from_id;if(seen.has(other))return false;seen.add(other);return true})
  }catch{}
  const histList=document.getElementById('dm-hist-list')
  if(!histList)return
  if(!dms.length){histList.innerHTML=`<div style="padding:22px 2px;text-align:center;color:var(--sub);font-size:13.5px">아직 대화가 없어요.<br>위에서 이름을 검색해 대화를 시작해보세요.</div>`;return}
  histList.innerHTML=dms.map(dm=>{
    const otherId=dm.from_id===SESSION.id?dm.to_id:dm.from_id
    const other=USERS.find(u=>u.id===otherId)||{id:otherId,name:'알 수 없음'}
    const mine=dm.from_id===SESSION.id
    const preview=(mine?'나: ':'')+(dm.text?dm.text.slice(0,22)+(dm.text.length>22?'…':''):'사진')
    return personRow(other,`${esc(preview)} · ${timeago(dm.at)}`)
  }).join('')
  histList.querySelectorAll('[data-uid]').forEach(el=>{el.onclick=()=>push(()=>rDmChat(el.dataset.uid))})
}

function getRecentSearch(){try{return JSON.parse(localStorage.getItem('okya-recent-search')||'[]')}catch{return[]}}
function pushRecentSearch(q){if(!q)return;try{let r=getRecentSearch().filter(x=>x!==q);r.unshift(q);localStorage.setItem('okya-recent-search',JSON.stringify(r.slice(0,8)))}catch{}}
async function rGlobalSearch(){
  app().innerHTML=`<div class="screen no-nav fade-in p3 gs-screen">
    <div class="gs-bar">
      <button class="bk" id="bk">${I.back}</button>
      <div class="gs-inputwrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="gs-inp" placeholder="급식·일정·청원·책·사람 검색" autocomplete="off" autocorrect="off"><button id="gs-clear" class="gs-clear" style="display:none">✕</button></div>
    </div>
    <div id="gs-body" class="gs-body"></div>
  </div>`
  document.getElementById('bk').onclick=pop
  const inp=document.getElementById('gs-inp'),body=document.getElementById('gs-body'),clr=document.getElementById('gs-clear')
  // DB 소스 로드(메모리 소스는 즉시)
  let books=[],petis=[],meetings=[],prints=[]
  const[a,b,c,d]=await Promise.allSettled([wt(sb.from('okya_books').select('*')),wt(sb.from('okya_petitions').select('*')),wt(sb.from('okya_meetings').select('*')),wt(sb.from('okya_prints').select('*'))])
  books=a.status==='fulfilled'?(a.value.data||[]):[];petis=b.status==='fulfilled'?(b.value.data||[]):[];meetings=c.status==='fulfilled'?(c.value.data||[]):[];prints=d.status==='fulfilled'?(d.value.data||[]):[]
  if(!document.getElementById('gs-body'))return
  const navDetail=fn=>{pop();push(fn)},navTab=t=>{STACK.length=0;TAB=t;routeTab()}
  const hit=(t,q)=>(t||'').toLowerCase().includes(q)
  const recentView=()=>{
    const r=getRecentSearch()
    body.innerHTML=r.length
      ?`<div class="gs-recent-head"><span>최근 검색</span><button id="gs-rclear">전체 삭제</button></div><div class="gs-chips">${r.map(q=>`<button class="gs-chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`
      :emptyHTML({icon:'🔎',title:'무엇이든 검색해보세요',desc:'급식 · 학사일정 · 공지 · 회의록 · 청원 · 책 · 제본 · 사람'})
    body.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{inp.value=el.dataset.q;clr.style.display='';runSearch(el.dataset.q)})
    const rc=document.getElementById('gs-rclear');if(rc)rc.onclick=()=>{localStorage.removeItem('okya-recent-search');recentView()}
  }
  const runSearch=raw=>{
    const q=(raw||'').trim().toLowerCase()
    if(!q){recentView();return}
    const groups=[]
    const us=USERS.filter(u=>u.id!==SESSION.id&&hit(u.name,q)).slice(0,6)
    if(us.length)groups.push({t:'사람',items:us.map(u=>({ic:'👤',title:u.name,sub:u.role==='admin'?'학생회':'학생',act:()=>navDetail(()=>rDmChat(u.id))}))})
    const bs=books.filter(x=>hit(x.title,q)||hit(x.want,q)).slice(0,6)
    if(bs.length)groups.push({t:'책 교환',items:bs.map(x=>({ic:'📚',title:x.title,sub:`${x.kind||'교환'} · ${x.owner_name||''}`,act:()=>navDetail(()=>rBookDetail(x.id))}))})
    const ps=petis.filter(p=>p.status==='approved'&&(hit(p.title,q)||hit(p.txt,q)||hit(p.content,q)||hit(p.purpose,q))).slice(0,6)
    if(ps.length)groups.push({t:'청원',items:ps.map(p=>({ic:'📝',title:p.title||p.txt||'청원',sub:p.category||'',act:()=>navDetail(()=>rPetitionDetail(p.id))}))})
    const ms=meetings.filter(m=>hit(m.title,q)).slice(0,6)
    if(ms.length)groups.push({t:'회의록',items:ms.map(m=>({ic:'🎬',title:m.title,sub:fmtDate(m.at),act:()=>navTab('school')}))})
    const ns=NOTICES.filter(n=>hit(n.title,q)||hit(n.cat,q)).slice(0,6)
    if(ns.length)groups.push({t:'공지',items:ns.map(n=>({ic:'📢',title:n.title,sub:n.cat,act:()=>navTab('home')}))})
    const scs=SCHEDULE.filter(s=>hit(s.label,q)).slice(0,6)
    if(scs.length)groups.push({t:'학사일정',items:scs.map(s=>({ic:'📅',title:s.label,sub:fmtDate(s.date),act:()=>navTab('school')}))})
    const meals=[];Object.keys(MEALS).forEach(dk=>{const m=MEALS[dk]||{};['조식','중식','석식'].forEach(sl=>{if((m[sl]||[]).some(x=>hit(x,q)))meals.push({dk,sl,items:(m[sl]||[]).filter(x=>hit(x,q))})})})
    if(meals.length)groups.push({t:'급식',items:meals.slice(0,6).map(x=>({ic:'🍚',title:`${x.dk} ${x.sl}`,sub:x.items.join(' · '),act:()=>navTab('school')}))})
    const prs=prints.filter(p=>hit(p.title,q)).slice(0,6)
    if(prs.length)groups.push({t:'제본소',items:prs.map(p=>({ic:'📄',title:p.title,sub:p.at?fmtDate(p.at):'',act:()=>navDetail(rPrint)}))})
    if(!groups.length){body.innerHTML=emptyHTML({icon:'🫥',title:'검색 결과가 없어요',desc:`'${esc(raw.trim())}'에 대한 결과를 찾지 못했어요`});return}
    body.innerHTML=groups.map((g,gi)=>`<div class="gs-group"><div class="gs-gt">${g.t} <span>${g.items.length}</span></div>${g.items.map((it,ii)=>`<div class="gs-row" data-gi="${gi}" data-ii="${ii}"><span class="gs-ic">${it.ic}</span><div class="gs-info"><div class="gs-rt">${esc(it.title)}</div>${it.sub?`<div class="gs-rs">${esc(it.sub)}</div>`:''}</div><span class="gs-chev">${I.chev}</span></div>`).join('')}</div>`).join('')
    body.querySelectorAll('.gs-row').forEach(el=>el.onclick=()=>{pushRecentSearch(inp.value.trim());const it=groups[+el.dataset.gi].items[+el.dataset.ii];if(it&&it.act)it.act()})
  }
  inp.oninput=()=>{clr.style.display=inp.value?'':'none';runSearch(inp.value)}
  clr.onclick=()=>{inp.value='';clr.style.display='none';inp.focus();recentView()}
  recentView()
  setTimeout(()=>inp.focus(),80)
}

async function rDmChat(userId){
  const user=USERS.find(u=>u.id===userId)
  const name=user?.name||'알 수 없음'
  const myId=SESSION.id
  app().innerHTML=`<div class="screen p3 dm-screen">
    <div class="dm-panel">
    <div class="phdr" style="flex:none">
      <button class="bk" id="bk">${I.back}</button>
      <div class="ttl" style="display:flex;align-items:center;gap:8px;font-size:16px">
        <div style="width:30px;height:30px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--primary);overflow:hidden;flex:none">${user?.photo?`<img src="${user.photo}" style="width:30px;height:30px;border-radius:50%;object-fit:cover">`:esc(name.charAt(0))}</div>
        ${esc(name)}
      </div>
      <div style="width:34px"></div>
    </div>
    <div id="dm-feed" style="flex:1;overflow-y:auto;padding:10px 0 4px;background:#fff">
      <div class="loader" style="min-height:200px"><div class="spin"></div></div>
    </div>
    <div style="flex:none;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(12px + env(safe-area-inset-bottom))">
      <div class="dm-inputbar">
        <textarea id="dm-txt" rows="1" placeholder="메시지를 입력하세요..." style="flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--ink);caret-color:var(--primary);resize:none;max-height:80px;line-height:1.45;font-family:inherit;padding:6px 2px;min-height:20px"></textarea>
        <button id="dm-snd" style="width:36px;height:36px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;border:none;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
    </div>
  </div>${bnav()}`
  bindNav()
  document.getElementById('bk').onclick=pop
  const dmtxt=document.getElementById('dm-txt')
  dmtxt.oninput=function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'}
  // 사용자가 최신 메시지 근처에 있는지 판단(과거 메시지 읽는 중이면 자동 스크롤로 위치를 뺏지 않음)
  const nearBottom=f=>!f||(f.scrollHeight-f.scrollTop-f.clientHeight)<90
  // 키보드가 실제로 뷰포트를 줄일 때만 화면을 '보이는 영역'에 고정 → 헤더는 위, 입력바는 키보드 바로 위, 메시지 목록만 부드럽게 줄어듦.
  // (데스크톱/하드웨어 키보드처럼 뷰포트가 안 줄면 레이아웃을 건드리지 않아 배경이 튀지 않음. .dm-screen의 rail padding-left는 CSS가 그대로 유지)
  const vv=window.visualViewport
  if(vv){
    const scr=document.querySelector('.dm-screen')
    const clear=()=>{if(!scr)return;['position','left','right','width','top','height','zIndex'].forEach(p=>scr.style[p]='')}
    const fit=()=>{
      if(!scr||!document.body.contains(scr)){vv.removeEventListener('resize',fit);vv.removeEventListener('scroll',fit);return}
      if((window.innerHeight-vv.height)>90){
        scr.style.position='fixed';scr.style.left='0';scr.style.right='0';scr.style.width='100%';scr.style.zIndex='60'
        scr.style.top=vv.offsetTop+'px';scr.style.height=vv.height+'px'
        const f=document.getElementById('dm-feed');if(f&&nearBottom(f))f.scrollTop=f.scrollHeight
      }else clear()
    }
    fit();vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)
    dmtxt.addEventListener('focus',()=>setTimeout(fit,300))
    dmtxt.addEventListener('blur',()=>setTimeout(fit,100))
  }
  const send=async()=>{
    const text=dmtxt.value.trim();if(!text)return
    const btn=document.getElementById('dm-snd');btn.disabled=true
    try{
      await wt(sb.from('okya_dm').insert({id:uid('dm'),from_id:myId,to_id:userId,text,at:nowISO()}))
      notify(userId,'dm','새 메시지',`${nameOf(myId)}님: ${text.length>30?text.slice(0,30)+'…':text}`,myId)
      dmtxt.value='';dmtxt.style.height='auto'
      await loadDms(true)
    }catch{toast('전송 실패')}
    finally{btn.disabled=false;dmtxt.focus()}
  }
  document.getElementById('dm-snd').onclick=send
  // Enter=전송, Shift+Enter=줄바꿈 (모바일 IME 조합 중엔 무시)
  dmtxt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}})
  async function loadDms(force){
    // 재렌더 전에 사용자가 최신 근처에 있었는지 기억 → 과거 읽는 중엔 위치 유지
    const stick=force||nearBottom(document.getElementById('dm-feed'))
    let msgs=[]
    try{const{data}=await wt(sb.from('okya_dm').select('*').or(`and(from_id.eq.${myId},to_id.eq.${userId}),and(from_id.eq.${userId},to_id.eq.${myId})`).order('at',{ascending:true}));msgs=data||[]}catch{}
    const feed=document.getElementById('dm-feed');if(!feed)return
    if(!msgs.length){feed.innerHTML=`<div style="padding:60px 20px;text-align:center;color:var(--muted);font-size:14px">${esc(name)}님에게 첫 메시지를 보내보세요</div>`;return}
    feed.innerHTML=msgs.map((m,i,a)=>{
      const isMe=m.from_id===myId
      const showHdr=!isMe&&(i===0||a[i-1].from_id!==m.from_id)
      const isLast=i===a.length-1||a[i+1].from_id!==m.from_id
      const rad=isLast?(isMe?'22px 22px 8px 22px':'8px 22px 22px 22px'):'22px'
      if(isMe){return`<div class="dm-msg me" style="display:flex;justify-content:flex-end;padding:1px 14px;margin-bottom:${isLast?8:2}px"><div style="max-width:74%"><div style="background:var(--primary-tint);color:var(--primary);border-radius:${rad};padding:11px 15px;font-size:14px;line-height:1.55;word-break:break-word">${esc(m.text)}</div>${isLast?`<div style="font-size:10px;color:var(--muted);text-align:right;margin-top:4px">${timeago(m.at)}</div>`:''}</div></div>`}
      return`<div class="dm-msg" style="display:flex;align-items:flex-start;gap:8px;padding:${showHdr?7:1}px 14px 1px;margin-bottom:${isLast?8:2}px"><div style="width:34px;flex:none">${showHdr?avatarHTML(userId,34):''}</div><div style="max-width:74%">${showHdr?`<div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px">${esc(name)}</div>`:''}<div style="background:var(--soft);color:var(--ink);border-radius:${rad};padding:11px 15px;font-size:14px;line-height:1.55;word-break:break-word">${esc(m.text)}</div>${isLast?`<div style="font-size:10px;color:var(--muted);margin-top:4px">${timeago(m.at)}</div>`:''}</div></div>`
    }).join('')
    if(stick)feed.scrollTop=feed.scrollHeight
  }
  await loadDms(true)
}

async function _payChalSubs(e,list){
  let cnt=0
  for(const s of list){
    if(s.paid)continue
    const ids=new Set()
    if(s.by_id)ids.add(s.by_id);(s.names||'').split(/[,\s·]+/).map(x=>x.trim()).filter(Boolean).forEach(nm=>{const u=USERS.find(u=>u.role!=='admin'&&u.name===nm);if(u)ids.add(u.id)})
    for(const id of ids)await addTx({from:'u_council',to:id,amount:e.reward,type:'발행',reason:'['+e.title+'] 챌린지 인증'})
    try{await wt(sb.from('okya_event_subs').update({paid:true}).eq('id',s.id))}catch{}
    s.paid=true;cnt+=ids.size
  }
  return cnt
}

const PET_CATS=['교실','기숙사','급식','체육관','학교 시스템','기타']
const PET_PHASES=['청원진행','회의 회부','심사중']
const PET_GOAL=100  // 기본 목표(청원별 goal 미설정 시)
function petGoal(p){const g=+((p||{}).goal);return g>0?g:PET_GOAL}
function petAgrees(p){return Object.keys(p.reacts||{}).length}
// 청원 상태(데이터에서 파생): 검토중→동의 진행중→마감 임박→목표 달성/마감→답변 완료
function petStatus(p){
  const agrees=petAgrees(p),goal=petGoal(p),left=petDaysLeft(p)
  if(p.status==='pending')return{label:'검토중',tone:'review'}
  if(p.answer)return{label:'답변 완료',tone:'done'}
  if(agrees>=goal)return{label:'목표 달성',tone:'success'}
  if(left<0)return{label:'마감',tone:'closed'}
  if(left<=3)return{label:'마감 임박',tone:'urgent'}
  return{label:'동의 진행중',tone:'active'}
}
// 청원 생애주기 단계 인덱스(제출·검토·공개·동의 진행·종료·결과)
const PET_LIFE=['제출','검토','공개','동의 진행','종료','결과']
function petStage(p){
  const agrees=petAgrees(p),goal=petGoal(p),left=petDaysLeft(p)
  if(p.status==='pending')return 1
  if(p.answer)return 5
  if(agrees>=goal||left<0)return 4
  return 3
}
function petStart(p){return p.approved_at||p.at}
function petDeadline(p){const d=new Date(petStart(p));d.setDate(d.getDate()+30);return d}
function petDaysLeft(p){return Math.ceil((petDeadline(p)-new Date())/86400000)}

      </div>

      document.getElementById('pn-content').oninput=e=>{data.content=e.target.value;if(e.target.value.trim()){document.getElementById('f-content').classList.remove('has-error');document.getElementById('e-content').style.display='none'}}

        <div class="pet-title-row"><span class="pet-doc">${I.petition}</span><div class="pet-d-title">${esc(data.title)}</div></div>
        <div class="pet-row"><div class="k">청원분야</div><div class="v"><span class="pet-cat">${esc(data.cat)}</span></div></div>
        <div class="pet-row"><div class="k">목표 참여</div><div class="v" style="font-weight:800">${fmt(data.goal)}명</div></div>
        <div class="pet-row col"><div class="k">청원의 취지</div><div class="v pet-body">${esc(data.purpose||'-')}</div></div>
        <div class="pet-row col"><div class="k">청원의 내용</div><div class="v pet-body">${esc(data.content||'-')}</div></div>

      document.getElementById('pw-back').onclick=()=>{step=1;render()}
      document.getElementById('pn-sub').onclick=async()=>{
        const btn=document.getElementById('pn-sub');btn.disabled=true;btn.textContent='제출 중...'
        const row={id:uid('p'),title:data.title,category:data.cat,purpose:data.purpose,content:data.content,txt:data.title,status:'pending',phase:'청원진행',goal:data.goal,by_id:SESSION.id,at:nowISO(),reacts:{}}
        let{error}=await wt(sb.from('okya_petitions').insert(row)).catch(e=>({error:e}))
        // 스키마에 없는 컬럼이 있으면 해당 컬럼만 빼고 재시도(최대 5회) — 책 등록과 동일한 방어책
        for(let i=0;error&&i<5;i++){
          const col=(error.message||'').match(/'([^']+)' column/)?.[1]
          if(!col||!(col in row))break
          delete row[col]
          ;({error}=await wt(sb.from('okya_petitions').insert(row)).catch(e=>({error:e})))
        }
        if(error){toast('제출 실패 · '+(error.message||'okya_petitions 컬럼 확인'));btn.disabled=false;btn.textContent='청원 제출';return}
        notifyAdmins('petition','새 청원 검토 요청',`익명 청원 '${data.title}'이 접수됐어요`)
        popMsg('청원이 접수됐어요 · 검토 후 공개','📝');pop()
      }
    }
  }
  render()
}
async function rPetitionDetail(pid){
  const admin=SESSION.role==='admin'
  app().innerHTML=`<div class="screen fade-in p3"><div class="phdr"><button class="bk" id="bk">${I.back}</button><div class="ttl">청원</div>${admin?`<button id="pd-del" style="font-size:12px;font-weight:700;color:var(--danger);background:none">삭제</button>`:'<div style="width:34px"></div>'}</div><div id="cb"><div class="loader" style="min-height:200px"><div class="spin"></div></div></div></div>${bnav()}`
  bindNav()
  document.getElementById('bk').onclick=pop
  let p=null
  try{const r=await wt(sb.from('okya_petitions').select('*').eq('id',pid).single());p=r.data}catch{}
  const cb=document.getElementById('cb');if(!cb)return
  if(!p){cb.innerHTML='<div class="empty">청원을 찾을 수 없어요.</div>';return}
  const agrees=petAgrees(p),mine=(p.reacts||{})[SESSION.id]
  const start=petStart(p),dl=petDeadline(p),left=petDaysLeft(p)
  const phase=p.phase||'청원진행',curIdx=PET_PHASES.indexOf(phase)
  const goal=petGoal(p),pct=Math.min(100,Math.round(agrees/goal*100))
  const st=petStatus(p),stage=petStage(p)
  // 생애주기 스테퍼(데이터 파생): 제출→검토→공개→동의 진행→종료→결과
  const stepper=`<div class="pet-steps">${PET_LIFE.map((s,i)=>`<div class="pet-step${i<=stage?' done':''}${i===stage?' cur':''}"><div class="pet-step-dot">${i<stage?'✓':i+1}</div><div class="pet-step-l">${s}</div></div>`).join('<div class="pet-step-line"></div>')}</div>`
  const adminPanel=admin?`<div class="pcard"><div class="sec">학생회 · 진행단계 변경</div><div class="pet-phasebtns">${PET_PHASES.map(ph=>`<button class="pet-chip${ph===phase?' on':''}" data-phase="${ph}">${ph}</button>`).join('')}</div>
      <div class="sec" style="margin-top:18px">학생회 답변</div>
      <textarea id="pd-answer" rows="3" placeholder="이 청원에 대한 학생회 답변을 남겨주세요" style="resize:none">${esc(p.answer||'')}</textarea>
      <button class="minibtn soft" id="pd-answer-save" style="margin-top:9px">답변 저장</button></div>`:''
  const resultCard=p.answer
    ?`<div class="pcard pet-answer"><div class="pet-ans-head">💬 학생회 답변 · 처리 결과</div><div class="pet-ans-body">${esc(p.answer)}</div></div>`
    :(stage>=4?`<div class="pcard"><div class="sec">처리 결과</div><div class="pet-result-empty">아직 처리 결과가 등록되지 않았어요.</div></div>`:'')
  cb.innerHTML=`<div class="chal-detail">
    <div class="pet-status-row"><span class="pet-badge lg st-${st.tone}">${st.label}</span><span class="pet-status-dday">${left>=0?'D-'+left:'마감됨'}</span></div>
    <div class="pcard pet-sheet">
      <div class="pet-title-row"><span class="pet-doc">${I.petition}</span><div class="pet-d-title">${esc(p.title||p.txt||'제목 없음')}</div></div>
      ${stepper}
      <div class="pet-row"><div class="k">청원분야</div><div class="v"><span class="pet-cat">${esc(p.category||'기타')}</span></div></div>
      <div class="pet-row"><div class="k">진행단계</div><div class="v" style="font-weight:800;color:var(--primary)">${esc(phase)}</div></div>
      <div class="pet-row"><div class="k">동의기간</div><div class="v">${fmtDate(start)} ~ ${fmtDate(dl)}<div class="pet-note">청원 공개 이후 30일 이내 · ${left>=0?left+'일 남음':'마감됨'}</div></div></div>
      <div class="pet-row"><div class="k">동의수</div><div class="v"><div class="pet-agree-line"><span class="pet-agree-big">${fmt(agrees)}명</span><span class="pet-pct">${pct}%</span></div><div class="pet-prog"><i style="width:${pct}%"></i></div><div class="pet-note">목표 ${fmt(goal)}명</div></div></div>
      <div class="pet-row"><div class="k">청원인</div><div class="v" style="display:flex;align-items:center;gap:9px"><span id="pet-author">익명</span>${admin?`<button class="minibtn out" id="pd-reveal" style="padding:4px 10px;font-size:11.5px">🔒 확인</button>`:''}</div></div>
      <div class="pet-row col"><div class="k">청원의 취지</div><div class="v pet-body">${esc(p.purpose||'-')}</div></div>
      <div class="pet-row col"><div class="k">청원의 내용</div><div class="v pet-body">${esc(p.content||p.txt||'-')}</div></div>
    </div>
    ${resultCard}
    ${adminPanel}
    <div class="pet-cta"><button class="pbtn pri pet-agree-btn${mine?' agreed':''}" id="pd-agree">${mine?'✓ 동의 완료':left<0?'동의 기간 마감':'동의하기'}</button>
      <button class="pbtn out" id="pd-share" style="margin-top:10px">청원 공유하기</button></div>
    <div style="height:10px"></div>
  </div>`
  const shareBtn=document.getElementById('pd-share');if(shareBtn)shareBtn.onclick=async()=>{
    const txt=`[옥야 청원] ${p.title||p.txt||'청원'}\n현재 ${fmt(agrees)}명 참여 (목표 ${fmt(goal)}명)\n옥야 앱에서 동의해주세요!`
    try{if(navigator.share){await navigator.share({title:'옥야 청원',text:txt})}else{await navigator.clipboard.writeText(txt);toast('청원 내용을 복사했어요','success')}}catch{}
  }
  document.getElementById('pd-agree').onclick=async()=>{
    if(left<0){toast('동의 기간이 마감되었어요');return}
    let reacts={}
    try{const r=await wt(sb.from('okya_petitions').select('reacts').eq('id',pid).single());reacts={...(r.data?.reacts||{})}}catch{}
    if(reacts[SESSION.id])delete reacts[SESSION.id];else reacts[SESSION.id]=1
    try{await wt(sb.from('okya_petitions').update({reacts}).eq('id',pid))}catch{}
    rPetitionDetail(pid)
  }
  if(admin){
    document.getElementById('pd-del').onclick=async()=>{try{await wt(sb.from('okya_petitions').delete().eq('id',pid))}catch{};toast('청원 삭제');pop()}
    document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=async()=>{try{await wt(sb.from('okya_petitions').update({phase:b.dataset.phase}).eq('id',pid))}catch{};rPetitionDetail(pid)})
    document.getElementById('pd-answer-save').onclick=async()=>{
      const val=document.getElementById('pd-answer').value.trim()
      const{error}=await wt(sb.from('okya_petitions').update({answer:val}).eq('id',pid)).catch(e=>({error:e}))
      if(error){toast('저장 실패 · okya_petitions에 answer 열이 필요해요','error');return}
      if(val)notifyStudents('petition','청원 답변 등록',`'${p.title||p.txt||'청원'}'에 학생회 답변이 달렸어요`)
      popMsg('답변 저장됨','💬');rPetitionDetail(pid)
    }
    let rstep=0
    const rb=document.getElementById('pd-reveal')
    rb.onclick=()=>{
      if(rstep===0){rstep=1;rb.textContent='🔓 한 번 더';rb.classList.remove('out');rb.classList.add('danger');return}
      const u=USERS.find(x=>x.id===p.by_id)
      const au=document.getElementById('pet-author');if(au){au.textContent=(u?u.name:(p.by_id||'알 수 없음'));au.style.fontWeight='800';au.style.color='var(--ink)'}
      rb.style.display='none'
    }
  }
}

async function iChallenge(){
  const admin=SESSION.role==='admin'
  let evs=[],subs=[]
  try{const r=await wt(sb.from('okya_events').select('*').order('at',{ascending:false}));evs=r.data||[]}catch{}
  const expired=evs.filter(isExpired)
  if(expired.length){
    await Promise.allSettled(expired.flatMap(e=>[wt(sb.from('okya_events').delete().eq('id',e.id)).catch(()=>{}),wt(sb.from('okya_event_subs').delete().eq('event_id',e.id)).catch(()=>{})]))
    evs=evs.filter(e=>!isExpired(e))
  }
  try{const r=await wt(sb.from('okya_event_subs').select('id,event_id'));subs=r.data||[]}catch{}
  function ddTag(dl){if(!dl)return'';const d=Math.ceil((new Date(dl)-new Date())/86400000);const red=d<=1;return`<span style="font-size:11px;font-weight:700;color:${red?'var(--danger)':'var(--muted)'};background:${red?'#FEF0F1':'var(--line)'};padding:2px 7px;border-radius:6px">${red?'D-day':'D-'+d}</span>`}
  const cards=evs.length?evs.map(e=>{const cnt=subs.filter(s=>s.event_id===e.id).length;return`<div class="pcard"><div style="display:flex;gap:10px;align-items:flex-start"><div class="chip ti-org">${I.star}</div><div style="flex:1;min-width:0"><div class="ti" style="font-size:15px;white-space:normal">${esc(e.title)}</div>${e.descr?`<div class="su" style="font-size:13px;line-height:1.5;white-space:normal;margin-top:3px">${esc(e.descr)}</div>`:''}${e.deadline?`<div style="margin-top:6px;display:flex;align-items:center;gap:6px"><span class="tag off" style="padding:3px 9px;font-size:11px">~${fmtDate(e.deadline)}</span>${ddTag(e.deadline)}</div>`:''}</div><div class="reward">${fmt(e.reward)}<small>옥</small></div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><button class="minibtn soft" data-gallery="${e.id}">🔥 ${cnt}명 참여</button>${admin?`<button class="minibtn danger" data-cancel="${e.id}">취소</button>`:`<button class="minibtn out" data-verify="${e.id}">인증하기</button>`}</div></div>`}).join(''):emptyHTML({icon:'⭐',title:'진행 중인 챌린지가 없어요',desc:admin?'아래에서 새 챌린지를 만들어보세요.':'곧 새로운 챌린지가 올라와요.'})
  const aform=admin?`<div class="pcard"><div class="sec">새 챌린지 만들기</div><div class="field"><label>제목</label><input id="et" placeholder="예: 등교 스트레칭 챌린지"></div><div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>보상(옥)</label><input id="er" type="number" placeholder="100"></div><div class="field" style="flex:1"><label>마감일</label><input id="edd" type="date"></div></div><div class="field" style="margin-bottom:0"><label>설명</label><input id="edesc" placeholder="간단 설명"></div><button class="pbtn pri" id="eadd" style="margin-top:12px">등록</button></div>`:''
  document.getElementById('cb').innerHTML=`${aform}${cards}<div style="height:8px"></div>`
  const add=document.getElementById('eadd')
  if(add)add.onclick=async()=>{
    const title=document.getElementById('et').value.trim();if(!title){toast('제목을 입력해줘');return}
    try{await wt(sb.from('okya_events').insert({id:uid('e'),title,reward:parseInt(document.getElementById('er').value,10)||0,descr:document.getElementById('edesc').value.trim(),deadline:document.getElementById('edd').value?new Date(document.getElementById('edd').value+'T23:59:59').toISOString():null,at:nowISO()}))}catch{toast('등록 실패');return}
    iChallenge()
  }
  document.querySelectorAll('[data-verify]').forEach(b=>b.onclick=()=>push(()=>rVerify(b.dataset.verify)))
  document.querySelectorAll('[data-gallery]').forEach(b=>b.onclick=()=>push(()=>rGallery(b.dataset.gallery)))
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{
    await Promise.allSettled([wt(sb.from('okya_event_subs').delete().eq('event_id',b.dataset.cancel)).catch(()=>{}),wt(sb.from('okya_events').delete().eq('id',b.dataset.cancel)).catch(()=>{})])
    toast('챌린지 취소');iChallenge()
  })
}

async function rGallery(eid){
  app().innerHTML=`<div class="screen no-nav fade-in p3"><div class="phdr"><button class="bk" id="bk">${I.back}</button><div class="ttl">인증 사진</div><div style="width:34px"></div></div><div class="loader" style="min-height:160px"><div class="spin"></div></div></div>`
  document.getElementById('bk').onclick=pop
  const admin=SESSION.role==='admin'
  let subs=[],ev=null
  try{const[r1,r2]=await Promise.allSettled([wt(sb.from('okya_event_subs').select('*').eq('event_id',eid).order('at',{ascending:false})),wt(sb.from('okya_events').select('title,reward').eq('id',eid).single())]);subs=r1.status==='fulfilled'?(r1.value.data||[]):[];ev=r2.status==='fulfilled'?r2.value.data:null}catch{}
  const title=ev?ev.title:'인증 사진'
  const cards=subs.length?subs.map(s=>{const reacts=s.reactions||{};const hearts=Object.values(reacts).filter(v=>v==='heart').length;const tears=Object.values(reacts).filter(v=>v==='tear').length;const my=reacts[SESSION.id];return`<div class="pcard"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div class="ti">${esc(s.names||s.by_name)}</div><div class="su">${fmtDate(s.at)}</div></div>${admin?`<button class="minibtn soft" data-award="${s.id}">지급</button>`:''}</div>${s.photo?`<img src="${s.photo}" style="width:100%;border-radius:14px;display:block">`:''}<div class="reacts" style="margin-top:10px"><button class="react-btn${my==='heart'?' on-r':''}" data-pr="${s.id}::heart">❤️ ${hearts}</button><button class="react-btn${my==='tear'?' on-b':''}" data-pr="${s.id}::tear">😢 ${tears}</button></div></div>`}).join(''):'<div class="empty">아직 인증 사진이 없어요.</div>'
  app().innerHTML=`<div class="screen no-nav fade-in p3"><div class="phdr"><button class="bk" id="bk">${I.back}</button><div class="ttl">${esc(title)}</div><div style="width:34px"></div></div>${cards}<div style="height:12px"></div></div>`
  document.getElementById('bk').onclick=pop
  document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=async()=>{
    const[id,t]=b.dataset.pr.split('::');let reacts={}
    try{const r=await wt(sb.from('okya_event_subs').select('reactions').eq('id',id).single());reacts={...(r.data?.reactions||{})}}catch{}
    if(reacts[SESSION.id]===t)delete reacts[SESSION.id];else reacts[SESSION.id]=t
    try{await wt(sb.from('okya_event_subs').update({reactions:reacts}).eq('id',id))}catch{}
    rGallery(eid)
  })
  if(admin)document.querySelectorAll('[data-award]').forEach(b=>b.onclick=()=>push(()=>rAward(b.dataset.award)))
}

async function rAward(subId){
  let s=null,ev=null
  try{const[r1,r2]=await Promise.allSettled([wt(sb.from('okya_event_subs').select('*').eq('id',subId).single()),wt(sb.from('okya_events').select('*'))]);s=r1.status==='fulfilled'?r1.value.data:null;if(s&&r2.status==='fulfilled')ev=(r2.value.data||[]).find(e=>e.id===s.event_id)}catch{}

  document.getElementById('bk').onclick=pop
  document.getElementById('pay').onclick=async()=>{

    for(const id of ids)await addTx({from:'u_council',to:id,amount:ev.reward,type:'발행',reason:'['+ev.title+'] 인증'})

    toast(ids.length+'명 지급 완료');pop();pop()
  }
}

async function iPetition(){
  const admin=SESSION.role==='admin'
  let ps=[]
  try{const r=await wt(sb.from('okya_petitions').select('*').order('at',{ascending:false}));ps=r.data||[]}catch{}
  const pub=ps.filter(p=>p.status==='approved'),pend=ps.filter(p=>p.status==='pending')
  const cb=document.getElementById('cb');if(!cb)return
  const ptitle=p=>esc(p.title||p.txt||'제목 없음')
  const pctOf=p=>Math.min(100,Math.round(petAgrees(p)/petGoal(p)*100))
  const ddayTxt=p=>{const d=petDaysLeft(p);return d>0?`D-${d}`:d===0?'오늘 마감':'마감'}
  const top=[...pub].sort((a,b)=>petAgrees(b)-petAgrees(a))[0]
  // 대표 청원: 참여자·목표·진행률·마감을 한눈에 (장식보다 정보 우선)
  const banner=top?`<button class="pet-hero" data-open="${top.id}">
    <div class="pet-hero-tag">🔥 지금 가장 주목받는 청원</div>
    <div class="pet-hero-title">${ptitle(top)}</div>
    <div class="pet-hero-stats"><span class="pet-hero-n"><b>${fmt(petAgrees(top))}</b>명 참여</span><span class="pet-hero-goal">목표 ${fmt(petGoal(top))}명</span></div>
    <div class="pet-bar"><i style="width:${pctOf(top)}%"></i></div>
    <div class="pet-hero-foot"><span class="pet-hero-pct">${pctOf(top)}%</span><span class="pet-hero-dday">${ddayTxt(top)}</span></div>
  </button>`:''
  const pendSec=admin&&pend.length?`<div class="pcard"><div class="sec">검토 대기 (${pend.length})</div>${pend.map(p=>`<div class="post"><div class="pbody" style="font-weight:800">${ptitle(p)}</div><div class="pmeta" style="margin:4px 0 8px">${esc(p.category||'기타')} · 접수 ${timeago(p.at)}</div><div style="display:flex;gap:8px"><button class="minibtn soft" data-ap="${p.id}">공개</button><button class="minibtn danger" data-rj="${p.id}">반려</button></div></div>`).join('')}</div>`:''
  // 일반 사용자: 본인이 올린 검토중 청원을 확인할 수 있게(관리자 승인 게이트는 유지)
  const myPend=!admin?pend.filter(p=>p.by_id===SESSION.id):[]
  const myPendSec=myPend.length?`<div class="pcard"><div class="sec">내 청원 · 검토중 (${myPend.length})</div>${myPend.map(p=>`<div class="post"><div class="pbody" style="font-weight:800">${ptitle(p)}</div><div class="pmeta" style="margin:4px 0 0"><span class="pet-badge st-review">검토중</span> · 접수 ${timeago(p.at)} · 학생회 검토 후 공개돼요</div></div>`).join('')}</div>`:''
  // 필터(상태)·정렬(인기/최신) 상태
  const STF=['전체','진행중','마감임박','목표달성','마감']
  const matchStatus=(p,f)=>{if(f==='전체')return true;const t=petStatus(p).tone;if(f==='진행중')return t==='active'||t==='urgent';if(f==='마감임박')return t==='urgent';if(f==='목표달성')return t==='success'||t==='done';if(f==='마감')return t==='closed';return true}
  let fstat='전체',sort='인기'
  const listHTML=()=>{
    let arr=pub.filter(p=>matchStatus(p,fstat))
    arr=arr.slice().sort(sort==='인기'?(a,b)=>petAgrees(b)-petAgrees(a):(a,b)=>petStart(a)<petStart(b)?1:-1)
    if(!arr.length)return'<div class="empty" style="padding:40px 20px">해당하는 청원이 없어요.</div>'
    return`<div class="pet-list">${arr.map(p=>{const st=petStatus(p);return`<button class="pet-item" data-open="${p.id}">
      <div class="pet-item-top"><span class="pet-badge st-${st.tone}">${st.label}</span><span class="pet-item-dday">${esc(p.category||'기타')} · ${ddayTxt(p)}</span></div>
      <div class="pet-item-title">${ptitle(p)}</div>
      <div class="pet-item-prog"><div class="pet-bar sm"><i style="width:${pctOf(p)}%"></i></div><span class="pet-item-n"><b>${fmt(petAgrees(p))}</b> / ${fmt(petGoal(p))}</span></div>
    </button>`}).join('')}</div>`
  }
  const empty='<div class="empty">아직 공개된 청원이 없습니다.<br><br>우측 상단 <b style="color:var(--primary)">＋ 청원</b>으로 첫 청원을 올려보세요.</div>'
  cb.innerHTML=`${banner}${pendSec}${myPendSec}
    <div class="pet-secrow"><div class="sec2">전체 청원 <span class="pet-cnt">${pub.length}</span></div>${pub.length?`<button class="pet-sort" id="pet-sort">${sort}순 ⇅</button>`:''}</div>
    ${pub.length?`<div class="pet-cats" id="pet-stats">${STF.map(c=>`<button class="pet-chip2${c===fstat?' on':''}" data-fs="${c}">${c}</button>`).join('')}</div>`:''}
    <div id="pet-listwrap">${pub.length?listHTML():empty}</div><div style="height:16px"></div>`
  const bindOpen=()=>cb.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>push(()=>rPetitionDetail(el.dataset.open)))
  const rerender=()=>{const w=document.getElementById('pet-listwrap');if(w){w.innerHTML=listHTML();bindOpen()}}
  bindOpen()
  cb.querySelectorAll('#pet-stats [data-fs]').forEach(b=>b.onclick=()=>{fstat=b.dataset.fs;cb.querySelectorAll('#pet-stats [data-fs]').forEach(x=>x.classList.toggle('on',x===b));rerender()})
  const sb2=document.getElementById('pet-sort');if(sb2)sb2.onclick=()=>{sort=sort==='인기'?'최신':'인기';sb2.textContent=sort+'순 ⇅';rerender()}
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{const pt=pend.find(x=>x.id===b.dataset.ap);try{await wt(sb.from('okya_petitions').update({status:'approved',approved_at:nowISO()}).eq('id',b.dataset.ap))}catch{};if(pt)notifyStudents('petition','새 청원 공개',`'${ptitle(pt)}' 청원에 동의해보세요`);iPetition()})
  document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{try{await wt(sb.from('okya_petitions').delete().eq('id',b.dataset.rj))}catch{};iPetition()})
}

  const issued=txs.filter(t=>t.type==='발행').reduce((s,t)=>s+t.amount,0)
  const attend=txs.filter(t=>t.type==='출석'&&t.to===SESSION.id).length
  let chal=0;try{const r=await wt(sb.from('okya_event_subs').select('id').eq('by_id',SESSION.id));chal=(r.data||[]).length}catch{}
  // 나의 옥야 대시보드: 활동 통계·스트릭·레벨
  let bookCount=0;try{const r=await wt(sb.from('okya_books').select('id').eq('owner',SESSION.id));bookCount=(r.data||[]).length}catch{}
  let petiCount=0;try{const r=await wt(sb.from('okya_petitions').select('by_id,reacts'));petiCount=(r.data||[]).filter(p=>p.by_id===SESSION.id||(p.reacts&&p.reacts[SESSION.id])).length}catch{}
  const attDays=new Set(txs.filter(t=>t.type==='출석'&&t.to===SESSION.id).map(t=>dayKeyOf(t.at)))
  const streak=(()=>{let s=0;const d=new Date();if(!attDays.has(dayKeyOf(d)))d.setDate(d.getDate()-1);while(attDays.has(dayKeyOf(d))){s++;d.setDate(d.getDate()-1)}return s})()
  const pts=attend*10+chal*20+bookCount*15+petiCount*10
  const {lv,cur,need,pct}=(()=>{let lv=1,need=100,acc=0;while(pts>=acc+need){acc+=need;lv++;need=Math.round(need*1.4)}return{lv,cur:pts-acc,need,pct:Math.max(4,Math.round((pts-acc)/need*100))}})()

  const photoSrc=SESSION.photo||null,initials=esc(SESSION.name.charAt(0))
  let curPri='#7B6CFF';try{const st=JSON.parse(localStorage.getItem('okya-theme')||'null');if(st&&st.primary)curPri=st.primary}catch{}

  const grad=p=>{const[a,b]=deriveGrad(p);return`linear-gradient(135deg,${a},${b})`}
  const pfis=PRESETS.map(([n,p])=>{const on=p.toLowerCase()===curPri.toLowerCase();return`<div class="pfi${on?' on':''}" data-pri="${p}" data-name="${n}" style="background:${grad(p)}"><div class="pl">${n}</div></div>`}).join('')

  app().innerHTML=`<div class="screen fade-in p3 my2">
    <div class="topbar"><div class="t">MY</div><button id="my-bell" data-bell>${I.bell}</button></div>
    <section class="my2-prof">
      <div class="av">${photoSrc?`<img src="${photoSrc}">`:initials}<label class="camera" for="my-photo-input"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></label></div>
      <input id="my-photo-input" type="file" accept="image/*" style="display:none">
      <div class="my2-id"><div class="my2-name">${esc(SESSION.name)}</div><div class="my2-cl">창녕옥야고등학교 · ${isAdmin?'학생회':'학생'}</div></div>
      <div class="my2-lv">Lv.${lv}</div>
    </section>
    <section class="my2-block">
      <div class="my-lv-bar"><i style="width:0%"></i></div>
      <div class="my2-lvsub">활동점수 <b>${fmt(pts)}</b>p · 다음 레벨까지 ${fmt(Math.max(0,need-cur))}p · 🔥 ${streak}일 연속</div>
    </section>
    <div class="my2-stats">
      <div class="my2-stat"><div class="v">${fmt(isAdmin?issued:bal)}</div><div class="k">${isAdmin?'발행량':'옥야머니'}</div></div>
      <div class="my2-stat"><div class="v">${attend}</div><div class="k">출석</div></div>
      <div class="my2-stat"><div class="v">${chal}</div><div class="k">챌린지</div></div>
      <div class="my2-stat"><div class="v">${bookCount}</div><div class="k">등록 책</div></div>
      <div class="my2-stat"><div class="v">${petiCount}</div><div class="k">참여 청원</div></div>
    </div>
    <section class="my2-block">
      <div class="my2-menu">
        <button class="my2-row" id="mm-tx"><span class="mic">${I.hist}</span><span class="my2-row-l">거래 내역</span><span class="cev">${I.chev}</span></button>
        <button class="my2-row" id="mm-chal"><span class="mic">${I.star}</span><span class="my2-row-l">챌린지</span><span class="cev">${I.chev}</span></button>
        <button class="my2-row" id="mm-peti"><span class="mic">${I.petition}</span><span class="my2-row-l">청원</span><span class="cev">${I.chev}</span></button>
        <button class="my2-row" id="mm-noti"><span class="mic">${I.bell}</span><span class="my2-row-l">알림</span><span class="cev">${I.chev}</span></button>
        <button class="my2-row" id="mm-out"><span class="mic" style="color:var(--danger)">${I.logout}</span><span class="my2-row-l" style="color:var(--danger)">로그아웃</span></button>
      </div>
    </section>
    <section class="my2-block">
      <h2 class="my2-sec-t">개인 설정</h2>
      <div class="my2-theme-t">색상 테마</div>
      <div style="font-size:12px;color:var(--text-3);margin-bottom:4px">스펙트럼 버튼을 눌러 색을 펼쳐보세요</div>
      <div class="palfan" id="palfan">
        <button class="palfan-btn" id="palfan-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        ${pfis}
        <label class="pfi pick" data-custom="1"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><input type="color" id="my-color" value="${curPri}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"></label>
      </div>
    </section>
    <div class="ver">옥야 v1.0 · 창녕옥야고 학생회</div>
  </div>${bnav()}`
  bindNav()
  requestAnimationFrame(()=>{const bar=document.querySelector('.my-lv-bar i');if(bar)bar.style.width=pct+'%'})
  const av=document.querySelector('.my2-prof .av');if(av)av.addEventListener('click',()=>eggTap('av',5,()=>{av.classList.remove('egg-wobble');void av.offsetWidth;av.classList.add('egg-wobble');confettiBurst();popMsg('숨은 옥야 발견!','🥚')}))

  document.getElementById('my-photo-input').onchange=async(e)=>{
    const f=e.target.files[0];if(!f)return
    toast('사진 업로드 중...')
    const url=await uploadImg(f,'profile',400,0.7)
    if(!url)return
    SESSION.photo=url
    const meU=USERS.find(u=>u.id===SESSION.id);if(meU)meU.photo=url  // 같은 세션 내 다른 화면(메시지/송금 등)에도 즉시 반영
    try{await wt(sb.from('okya_users').update({photo:url}).eq('id',SESSION.id))}catch{}
    rMy()
  }
  // 스펙트럼 팔레트: 원형 배치
  const fan=document.getElementById('palfan')
  const items=[...fan.querySelectorAll('.pfi')]
  const R=96,N=items.length
  items.forEach((el,i)=>{const ang=(-90+i*(360/N))*Math.PI/180;el.style.setProperty('--tx',(Math.cos(ang)*R).toFixed(1)+'px');el.style.setProperty('--ty',(Math.sin(ang)*R).toFixed(1)+'px');el.style.transitionDelay=(i*20)+'ms'})
  document.getElementById('palfan-btn').onclick=()=>fan.classList.toggle('open')
  document.querySelectorAll('[data-pri]').forEach(el=>el.onclick=()=>{applyTheme({name:el.dataset.name,primary:el.dataset.pri,v:2});rMy()})
  document.getElementById('my-color').onchange=e=>{applyTheme({name:'커스텀',primary:e.target.value,v:2});rMy()}
  wireBell()
  document.getElementById('mm-tx').onclick=()=>push(()=>rHistory())
  document.getElementById('mm-chal').onclick=()=>push(rChallengePage)
  document.getElementById('mm-peti').onclick=()=>push(rPetitionPage)
  document.getElementById('mm-noti').onclick=()=>push(()=>rNotifications())
  document.getElementById('mm-out').onclick=async()=>{try{await sb.auth.signOut()}catch{};SESSION=null;USERS=[];rLogin()}
}

  const gg=document.getElementById('gg')
  gg.onclick=async()=>{
    gg.disabled=true
    const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+window.location.pathname,queryParams:{prompt:'select_account'}}})
    if(error){toast('로그인 실패: '+error.message);gg.disabled=false}

async function handleUserUpsert(authUser){
  const name=authUser.user_metadata?.full_name||authUser.user_metadata?.name||(authUser.email||'').split('@')[0]||'학생'
  // 기존 사용자인지 확인 (role은 DB 값을 그대로 신뢰, 클라이언트가 절대 덮어쓰지 않음)
  let role='student',exists=false
  try{const r=await wt(sb.from('okya_users').select('role').eq('id',authUser.id).maybeSingle());if(r.data){exists=true;role=r.data.role||'student'}}catch{}
  try{
    if(exists){
      // 기존 사용자: 이름만 갱신, role은 손대지 않음 → Supabase에서 설정한 admin이 유지됨
      const r=await wt(sb.from('okya_users').update({name}).eq('id',authUser.id).select().single());SESSION=r.data||{id:authUser.id,name,role}
    }else{
      // 신규 사용자만 최초 1회 student로 생성
      const r=await wt(sb.from('okya_users').insert({id:authUser.id,name,role:'student'}).select().single());SESSION=r.data||{id:authUser.id,name,role:'student'}
    }
  }catch{SESSION={id:authUser.id,name,role}}
  try{const r=await wt(sb.from('okya_users').select('id,name,role,photo'));USERS=r.data||[]}catch{}
  STACK=[];routeTab()
}

// ── 테마 ──
const THEMES=[
  {name:'파랑',primary:'#1A5CE6',d:'#1349C0',tint:'#EEF3FF'},
  {name:'보라',primary:'#7C3AED',d:'#6D28D9',tint:'#F3EEFF'},
  {name:'초록',primary:'#059669',d:'#047857',tint:'#EDFAF5'},
  {name:'주황',primary:'#D97706',d:'#B45309',tint:'#FFFAEB'},
  {name:'분홍',primary:'#DB2777',d:'#BE185D',tint:'#FCE7F3'},
  {name:'민트',primary:'#0D9488',d:'#0F766E',tint:'#CCFBF1'},
  {name:'레드',primary:'#DC2626',d:'#B91C1C',tint:'#FEE2E2'},
  {name:'하늘',primary:'#0891B2',d:'#0E7490',tint:'#E0F8FF'},
  {name:'라임',primary:'#65A30D',d:'#4D7C0F',tint:'#ECFCCB'},
  {name:'핫핑크',primary:'#EC4899',d:'#BE185D',tint:'#FDF2F8'},
]
function hexToHsl(hex){
  const n=parseInt(hex.replace('#',''),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,s=0,l=(mx+mn)/2
  if(d){s=l>0.5?d/(2-mx-mn):d/(mx+mn)
    h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return[h,s,l]
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l))
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2
  let r=0,g=0,b=0
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  const to=v=>Math.round((v+m)*255).toString(16).padStart(2,'0')
  return '#'+to(r)+to(g)+to(b)
}
// primary 하나로 강한 2톤 그라데이션 파생: 색상 +32° 이동 + 명도/채도 대비
function deriveGrad(primary){
  const[h,s,l]=hexToHsl(primary)
  const ga=hslToHex(h,Math.min(s+0.06,1),Math.max(l-0.05,0.42))
  const gb=hslToHex(h+32,Math.min(s+0.10,1),Math.min(Math.max(l,0.55)+0.16,0.74))
  return[ga,gb]
}
function applyTheme(t){
  const r=document.documentElement.style
  const[dga,dgb]=deriveGrad(t.primary)
  const ga=t.ga||dga,gb=t.gb||dgb
  const[h,s,l]=hexToHsl(t.primary)
  const dcol=t.d||hslToHex(h,s,Math.max(l-0.12,0.30))
  const tint=t.tint||hslToHex(h,Math.min(s,0.85),0.94)
  r.setProperty('--primary',t.primary);r.setProperty('--primary-d',dcol);r.setProperty('--primary-tint',tint)
  // 2.0 UI가 쓰는 --accent* 도 함께 갱신 → 홈/학교/머니/MY 등 전체 통일(커뮤 tone 밴드는 --tone이라 고정)
  r.setProperty('--accent',t.primary);r.setProperty('--accent-d',dcol);r.setProperty('--accent-soft',tint)
  r.setProperty('--ga',ga)
  r.setProperty('--gb',gb)
  r.setProperty('--sh-blue',`0 16px 34px ${t.primary}52,-4px 5px 16px ${t.primary}22`)
  localStorage.setItem('okya-theme',JSON.stringify({...t,v:2}))
}
const DEFAULT_THEME={name:'바이올렛',primary:'#7B6CFF',v:2}

// ── 초기화 ──
;(async()=>{
  // 저장된 테마 적용 (v 없는 예전 저장값은 무시하고 바이올렛 기본 적용)
  try{const st=localStorage.getItem('okya-theme'),t=st&&JSON.parse(st);applyTheme(t&&t.v?t:DEFAULT_THEME)}catch{applyTheme(DEFAULT_THEME)}
  const _t0=Date.now()
  // 스플래시 최소 1.5초 표시 보장
  const holdSplash=()=>new Promise(r=>setTimeout(r,Math.max(0,1500-(Date.now()-_t0))))
  const fallback=setTimeout(()=>{if(app().querySelector('.splash-screen'))rLogin()},10000)
  try{
    // 급식·학사일정 로드 (실패해도 무시하고 진행)
    await Promise.race([loadSchoolData(),new Promise(r=>setTimeout(r,4000))])
    try{const r=await wt(sb.from('okya_users').select('id,name,role,photo'),6000);USERS=r.data||[]}catch{}
    const{data}=await wt(sb.auth.getSession(),6000)
    clearTimeout(fallback)
    await holdSplash()
    if(data?.session?.user)await handleUserUpsert(data.session.user)
    else rLogin()
    sb.auth.onAuthStateChange(async(event,s)=>{
      if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&s)await handleUserUpsert(s.user)
      else if(event==='SIGNED_OUT'){SESSION=null;USERS=[];rLogin()}
    })
  }catch{
    clearTimeout(fallback)
    await holdSplash()
    rLogin()
  }
})()
</script>
