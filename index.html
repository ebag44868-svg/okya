  .screen.no-nav.p3 .succ{flex:1;min-height:auto;width:100%;max-width:520px;margin:0 auto;padding:48px 32px;}
  .screen.no-nav.p3 .succ .ring2{width:104px;height:104px;}
  .screen.no-nav.p3 .succ h2{font-size:23px;}
  .screen.no-nav.p3 .succ .btns{margin-top:32px;}
  /* 확인 바텀시트 → 중앙 다이얼로그 */
  .p3sheet-ov{align-items:center;}
  .p3sheet{max-width:430px;border-radius:26px;}
  /* 송금 플로우: 데스크톱에서 좌측 레일 노출 + 콘텐츠 정렬(플로팅 박스 대신) */
  .screen.mflow+.bnav{display:flex;}
  .screen.mflow .kpwrap{width:100%;max-width:760px;margin:0 auto;padding:10px 30px 26px;}
  .screen.mflow .kp-amt{font-size:52px;}
  .screen.mflow .keypad{max-width:520px;margin:0 auto;gap:16px 60px;}
  .screen.mflow #tf-list{width:100%;max-width:720px;margin:0 auto;}
  .screen.mflow .phdr+div,.screen.mflow .phdr~div:last-child{width:100%;max-width:720px;margin:0 auto;}
  .screen.mflow .succ{width:100%;max-width:520px;margin:0 auto;padding:48px 32px;}
}

/* ===== 레일 아코디언 (세로에선 숨김) + 커뮤 배너 캐러셀 ===== */
.bnav-exp,.bnav-sub,.rail-burger{display:none;}
.bnav>.bnav-group{flex:1;display:flex;}
.bnav-group>.bnav-row{flex:1;display:flex;}
.bnav-group>.bnav-row>.bnav-item{flex:1;}
.bnav-subitem{font-family:inherit;border:none;cursor:pointer;}
.subarr{width:15px;height:15px;color:var(--muted);flex:none;}

.cbtrack{position:relative;height:640px;perspective:1500px;overflow:hidden;padding:0;touch-action:pan-y;}
.cbcard{position:absolute;top:50%;left:50%;width:min(470px,92%);height:610px;border-radius:24px;background:var(--card);padding:24px;overflow:hidden;display:flex;flex-direction:column;transform:translate(-50%,-50%);transform-style:preserve-3d;transition:transform .62s cubic-bezier(.22,1,.36,1),opacity .5s var(--ease),box-shadow .5s;box-shadow:0 18px 46px rgba(20,26,40,.16);cursor:pointer;}
.cbcard.is-active{box-shadow:0 30px 66px rgba(20,26,40,.28);}
.cbcard.is-active{box-shadow:0 34px 74px rgba(20,26,40,.30);}
/* 바로가기: 작은 직사각형 패널 세로 일렬 */
.qcol{display:flex;flex-direction:column;gap:8px;padding:0 18px;}
.qbtn{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:13px;box-shadow:var(--sh);padding:11px 14px;cursor:pointer;transition:transform .13s var(--ease);}
.qbtn:active{transform:scale(.985);}
.qic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.qic svg{width:17px;height:17px;}
.qt{flex:1;font-size:14px;font-weight:700;color:var(--ink);}
.qchev{color:#c9cdd8;display:flex;}
.qchev svg{width:16px;height:16px;}
.cbtag{align-self:flex-start;font-size:11px;font-weight:800;padding:5px 11px;border-radius:100px;background:var(--primary-tint);color:var(--primary);letter-spacing:.02em;position:relative;z-index:1;}
.cb-peti{align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 130% at 50% -10%,var(--primary-tint),var(--card) 62%);}
.cb-peti .cbtag{position:absolute;top:18px;left:50%;transform:translateX(-50%);}
.cb-petbody{margin:auto 4px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.cb-petitle{font-size:32px;font-weight:900;line-height:1.34;letter-spacing:-.6px;color:var(--ink);word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.cbmeta{font-size:12.5px;color:var(--sub);font-weight:600;margin-top:12px;}

/* 커뮤니티 → 청원 진입 CTA(아코디언 배너는 유지, 청원만 별도 강조) */
.comm-petcta{display:flex;align-items:center;gap:13px;width:calc(100% - var(--page-x)*2);margin:16px var(--page-x) 0;padding:15px 16px;background:var(--accent-soft);border-radius:var(--radius-lg);text-align:left;transition:transform var(--dur-micro) var(--ease-spring);}
.comm-petcta:active{transform:scale(.98);}
.comm-petcta-ic{width:42px;height:42px;border-radius:var(--radius-md);background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;}
.comm-petcta-tx{flex:1;min-width:0;}
.comm-petcta-t{font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--accent-d);}
.comm-petcta-s{font-size:12.5px;font-weight:600;color:var(--accent);opacity:.85;margin-top:2px;}
.comm-petcta-go{color:var(--accent);display:flex;flex:none;}
.comm-petcta-go svg{width:20px;height:20px;}
.cbimg{width:100%;max-width:400px;aspect-ratio:1/1.32;flex:none;margin:14px auto 12px;border-radius:16px;background:var(--soft);border:1.6px dashed #cfd4e0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.cbimg.has-img{border:none;background:none;}
.cbimg img{width:100%;height:100%;object-fit:cover;display:block;}
.cb-bookph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--primary-tint),#fff);}
.cb-bookph svg{width:56px;height:56px;stroke:var(--primary);opacity:.85;}
.cbimg-ph{color:#aeb4c2;font-size:12px;font-weight:700;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cbimg-ph svg{width:30px;height:30px;stroke:#c2c8d4;}
.cbcap-t{font-size:16px;font-weight:800;color:var(--ink);}
.cbcap-s{font-size:12.5px;color:var(--sub);margin-top:3px;}

/* ── 커뮤니티 2.0: 리드 + 메인 배너 압도적 강조 + 이미지/내용 꽉 채움 ── */
.comm2-lead{padding:2px 20px 14px;}
.comm2-lead-t{font-size:25px;font-weight:900;letter-spacing:-.03em;color:var(--text-1);line-height:1.1;}
.comm2-lead-s{font-size:13.5px;font-weight:600;color:var(--text-3);margin-top:5px;}
/* 배너: 정사각형 */
.cbtrack{height:min(430px,94vw);}
.cbcard{width:min(400px,86vw);height:min(400px,86vw);}
/* 이미지/책 카드: 프레임 제거 → 카드 전체에 꽉 채우고 텍스트는 오버레이 */
.cb-img{padding:0;}
.cb-img .cbimg{position:absolute;inset:0;width:100%;max-width:none;aspect-ratio:auto;margin:0;border:none;border-radius:24px;background:linear-gradient(150deg,var(--primary-tint),#EBF0FF);}
.cb-img .cbimg img{width:100%;height:100%;object-fit:cover;}
.cb-img .cbimg-ph{display:none;}
.cb-img .cbtag{position:absolute;top:18px;left:18px;z-index:2;background:rgba(255,255,255,.92);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.12);}
.cb-img .cbcap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:28px 24px 24px;background:linear-gradient(to top,rgba(10,12,24,.76),rgba(10,12,24,.14) 62%,transparent);}
.cb-img .cbcap-t{color:#fff;font-size:23px;font-weight:900;letter-spacing:-.02em;line-height:1.2;}
.cb-img .cbcap-s{color:rgba(255,255,255,.9);font-size:14px;margin-top:5px;}
.cb-bookph{border-radius:24px;}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .cbtrack{height:600px;}
  .cbcard{width:520px;height:520px;}
  .cb-img .cbcap-t{font-size:26px;}
}
.cbdots{display:flex;gap:6px;justify-content:center;margin-top:8px;}
.cbdots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .25s var(--ease),background .25s;}
.cbdots i.on{width:20px;border-radius:4px;background:var(--primary);}

@media (min-width:820px) and (min-aspect-ratio:1/1){
  .bnav>.bnav-group{flex:none;display:block;}
  .bnav-group>.bnav-row{display:flex;align-items:center;gap:2px;}
  .bnav-group>.bnav-row>.bnav-item{flex:1;}
  .bnav-exp{display:flex;align-items:center;justify-content:center;width:36px;height:44px;flex:none;color:var(--muted);border-radius:12px;background:none;}
  .bnav-exp svg{width:18px;height:18px;transition:transform .25s var(--ease);}
  .bnav-group.open>.bnav-row .bnav-exp svg{transform:rotate(90deg);}
  .bnav-sub{display:block;overflow:hidden;max-height:0;opacity:0;transition:max-height .34s var(--ease),opacity .3s var(--ease);}
  .bnav-group.open>.bnav-sub{max-height:380px;opacity:1;}
  .bnav-subitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px 9px 30px;font-size:13.5px;font-weight:600;color:var(--ink2);border-radius:11px;background:none;transform:translateX(-7px);transition:transform .32s var(--ease),background .15s,color .15s;}
  .bnav-group.open .bnav-subitem{transform:none;}
  .bnav-subitem:hover{background:var(--soft);color:var(--ink);}
  .bnav-subitem:hover .subarr{color:var(--primary);}
  /* 배너 커버플로우: 중앙 한 장 크게, 양옆 겹쳐 보임 */
  .cbtrack{height:740px;perspective:1900px;}
  .cbcard{width:min(620px,54%);height:710px;padding:38px;}
  .cbimg{max-width:440px;}
  .cb-petitle{font-size:42px;}
  /* 바로가기 세로 패널: 왼쪽 정렬 */
  .qcol{max-width:520px;}
}

/* ===== 챌린지: 포스터 갤러리 + 공모전형 상세(전체화면) ===== */
.chal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:8px 20px 10px;justify-content:start;}
@media (min-width:820px) and (min-aspect-ratio:1/1){.chal-grid{grid-template-columns:repeat(auto-fill,minmax(200px,232px));}}
.chal-card{cursor:pointer;}
.chal-card:active{transform:scale(.98);}
.chal-poster{aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);transition:transform .18s var(--ease),box-shadow .18s;}
.chal-card:hover .chal-poster{transform:translateY(-3px);box-shadow:0 16px 34px rgba(20,26,40,.18);}
.chal-poster img{width:100%;height:100%;object-fit:cover;display:block;}
.chal-ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:#b6bcc8;font-size:12px;font-weight:700;}
.chal-ph svg{width:30px;height:30px;stroke:#c2c8d4;}
.chal-name{font-size:15px;font-weight:800;margin-top:10px;color:var(--ink);line-height:1.35;}
.chal-intro{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5;}
.chal-hero{width:100%;aspect-ratio:3/4;max-width:460px;margin:2px auto 0;border-radius:20px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);}
.chal-hero img{width:100%;height:100%;object-fit:cover;}
.chal-detail{padding:4px 0 24px;}
.chal-card{cursor:pointer;animation:chalpop .45s var(--ease) both;}
@keyframes chalpop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.chal-card:nth-child(2){animation-delay:.05s}.chal-card:nth-child(3){animation-delay:.1s}.chal-card:nth-child(4){animation-delay:.15s}.chal-card:nth-child(n+5){animation-delay:.2s}
.sub-card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px;margin:0 18px 10px;animation:chalpop .4s var(--ease) both;transition:opacity .3s var(--ease);}
.sub-card.paid{opacity:.72;}
.paid-badge{flex-shrink:0;font-size:11.5px;font-weight:800;color:#16A34A;background:#E7F8EF;padding:5px 11px;border-radius:999px;white-space:nowrap;}
.sub-card .sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px;}
.sub-card .sc-name{font-size:14px;font-weight:800;color:var(--ink);}
.sub-card .sc-meta{font-size:12px;color:var(--sub);margin-top:2px;}
.sub-card img.sc-photo{max-width:200px;width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block;}
.sub-card .sc-note{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:8px;}

/* 청원 (국민청원 스타일) */
.pet-cat{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--primary-tint);color:var(--primary);}
.pet-cat.sm{font-size:10.5px;padding:3px 9px;}
/* 메인 - 대표 청원(다른 카드와 같은 직사각형, 크게) */
.pet-feat{margin:10px 18px 2px;min-height:190px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:28px 26px;cursor:pointer;animation:petrise .5s var(--ease) both;transition:transform .18s var(--ease),box-shadow .18s;}
.pet-feat:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(20,26,40,.15);}
.pet-feat:active{transform:scale(.995);}
.pet-feat-tag{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:13px;}
.pet-feat-title{font-size:25px;font-weight:900;line-height:1.4;letter-spacing:-.6px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pet-feat-sub{font-size:14px;color:var(--sub);line-height:1.6;margin-top:11px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.pet-feat-meta{display:flex;align-items:center;gap:11px;margin-top:auto;padding-top:18px;}
.pet-feat-n{font-size:14.5px;font-weight:700;color:var(--sub);}
.pet-feat-n b{color:var(--primary);font-weight:900;font-size:17px;}
/* 메인 - 그리드(제목 메인, 나머지 아래로) */
.pet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:2px 18px 10px;}
.pet-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px;cursor:pointer;display:flex;flex-direction:column;animation:petrise .45s var(--ease) both;transition:transform .18s var(--ease),box-shadow .18s;}
.pet-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,26,40,.14);}
.pet-card:active{transform:scale(.98);}
.pet-card .pet-cat{align-self:flex-start;margin-bottom:10px;}
.pet-c-title{font-size:16px;font-weight:900;line-height:1.4;letter-spacing:-.3px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.pet-c-foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;font-size:12.5px;color:var(--sub);}
.pet-c-foot b{color:var(--primary);font-weight:900;font-size:14px;}
.pet-card:nth-child(2){animation-delay:.04s}.pet-card:nth-child(3){animation-delay:.08s}.pet-card:nth-child(4){animation-delay:.12s}.pet-card:nth-child(5){animation-delay:.16s}.pet-card:nth-child(6){animation-delay:.2s}.pet-card:nth-child(n+7){animation-delay:.24s}

/* 청원(재설계): 대표 청원 진행률 + 스캔형 리스트 */
.pet-bar{height:8px;border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden;}
.pet-bar.sm{height:6px;}
.pet-bar i{display:block;height:100%;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--accent),var(--accent-d));transition:width .6s var(--ease-out);}
.pet-hero{display:block;width:100%;text-align:left;margin:10px var(--page-x) 2px;width:calc(100% - var(--page-x)*2);background:var(--accent-soft);border-radius:var(--radius-lg);box-shadow:none;border:none;padding:22px;animation:petrise .5s var(--ease) both;}
.pet-hero:active{transform:scale(.99);}
.pet-hero-tag{font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:11px;}
.pet-hero-title{font-size:20px;font-weight:900;line-height:1.35;letter-spacing:-.4px;color:var(--text-1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pet-hero-stats{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 9px;}
.pet-hero-n{font-size:15px;font-weight:700;color:var(--text-2);}
.pet-hero-n b{color:var(--accent);font-weight:900;font-size:22px;letter-spacing:-.5px;margin-right:2px;}
.pet-hero-goal{font-size:13px;font-weight:600;color:var(--text-3);}
.pet-hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;}
.pet-hero-pct{font-size:13px;font-weight:900;color:var(--accent);}
.pet-hero-dday{font-size:13px;font-weight:900;color:var(--text-2);font-variant-numeric:tabular-nums;}

.pet-secrow{display:flex;align-items:center;justify-content:space-between;padding:18px var(--page-x) 0;}
.sec2{font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--text-1);}
.sec2 .pet-cnt{color:var(--accent);}
.pet-sort{font-size:12.5px;font-weight:700;color:var(--text-2);background:var(--surface-2);padding:6px 12px;border-radius:var(--radius-full);}
.pet-sort:active{background:var(--surface-3);}
.pet-cats{display:flex;gap:7px;overflow-x:auto;padding:12px var(--page-x) 4px;scrollbar-width:none;}
.pet-cats::-webkit-scrollbar{display:none;}
.pet-chip2{flex:none;font-size:13px;font-weight:700;padding:7px 14px;border-radius:var(--radius-full);background:var(--surface-2);color:var(--text-2);transition:background var(--dur-standard),color var(--dur-standard);}
.pet-chip2.on{background:var(--accent);color:#fff;}
.pet-list{margin:4px 0 0;background:none;box-shadow:none;overflow:hidden;}
.pet-item{display:block;width:100%;text-align:left;padding:16px var(--page-x);background:transparent;animation:rowSlide .38s var(--ease) both;}
.pet-item+.pet-item{border-top:1px solid var(--divider);}
.pet-item:active{background:var(--surface-2);}
.pet-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.pet-item-dday{font-size:12px;font-weight:900;color:var(--text-2);font-variant-numeric:tabular-nums;}
.pet-item-title{font-size:15.5px;font-weight:800;line-height:1.4;letter-spacing:-.2px;color:var(--text-1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pet-item-prog{display:flex;align-items:center;gap:11px;margin-top:12px;}
.pet-item-prog .pet-bar{flex:1;}
.pet-item-n{font-size:12.5px;font-weight:600;color:var(--text-3);white-space:nowrap;flex:none;}
.pet-item-n b{color:var(--accent);font-weight:900;font-size:14px;}
/* 청원 상태 배지 */
.pet-badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:var(--radius-full);letter-spacing:-.01em;}
.pet-badge.st-review{background:var(--surface-3);color:var(--text-2);}
.pet-badge.st-active{background:var(--accent-soft);color:var(--accent);}
.pet-badge.st-urgent{background:#FDECEC;color:#E0424D;}
.pet-badge.st-success{background:#E7F8EF;color:#16A34A;}
.pet-badge.st-closed{background:var(--surface-3);color:var(--text-3);}
.pet-badge.st-done{background:#E8F0FF;color:#3B6FE0;}
.pet-badge.lg{font-size:12.5px;padding:5px 12px;}
.pet-status-row{display:flex;align-items:center;justify-content:space-between;margin:6px 20px 0;animation:petrise .4s var(--ease) both;}
.pet-status-dday{font-size:13px;font-weight:900;color:var(--text-2);font-variant-numeric:tabular-nums;}
.pet-result-empty{font-size:13.5px;color:var(--text-3);font-weight:500;padding:6px 0 2px;line-height:1.6;}

/* ── 그래픽/이미지 자리 아키텍처: asset 없이 designed space, 이후 background-image만 교체 ── */
.vspace{position:relative;margin:14px var(--page-x) 0;border-radius:var(--radius-xl);overflow:hidden;background-size:cover;background-position:center;}
.vspace-body{position:relative;z-index:1;}
.vspace-t{font-weight:900;letter-spacing:-.4px;line-height:1.25;}
.vspace-s{font-weight:600;margin-top:6px;}
.pet-hv{padding:24px 22px;background:linear-gradient(135deg,var(--accent-soft) 0%,#F1EEFF 48%,#FDEEF6 100%);}
.pet-hv::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 32% 32%,rgba(123,108,255,.16),transparent 70%);}
.pet-hv .vspace-t{font-size:21px;color:var(--accent-d);}
.pet-hv .vspace-s{font-size:13px;color:var(--accent);opacity:.85;}

/* 청원 헤더: 색 밴드(다른 세부탭과 통일) */
.pet2-hero{margin:6px 0 0;padding:42px 20px 38px;background:var(--tone-grad,var(--grad));color:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:18px;}
.pet2-cta{background:#fff;color:var(--tone-d,var(--accent-d));font-size:15px;font-weight:800;padding:12px 22px;border-radius:var(--radius-full);box-shadow:0 6px 16px rgba(0,0,0,.16);transition:transform var(--dur-micro) var(--ease-spring);}
.pet2-cta:active{transform:scale(.97);}
/* 세부탭 색상 토큰(이미지 대신 색으로 구별) */
.tone-chal{--tone:#EA5A2B;--tone-d:#D2481E;--tone-soft:#FFE1D2;--tone-border:#F8C4A8;--tone-grad:linear-gradient(120deg,#FF7A45 0%,#FF5C7A 100%);}
.tone-book{--tone:#0E9E86;--tone-d:#0B8271;--tone-soft:#CDF0E6;--tone-border:#A2E1D2;--tone-grad:linear-gradient(120deg,#16C79A 0%,#12A6B8 100%);}
.tone-print{--tone:#5B6CFF;--tone-d:#4A55E0;--tone-soft:#DDE1FF;--tone-border:#BFC6FF;--tone-grad:linear-gradient(120deg,#6C7BFF 0%,#9B6CFF 100%);}
.tone-peti{--tone:#7B6CFF;--tone-d:#6A4FE0;--tone-soft:#E3DFFF;--tone-border:#CBC2FF;--tone-grad:linear-gradient(120deg,#7B6CFF 0%,#9B6CFF 100%);}
/* 세부탭 헤더: 제목행 전체를 탭 색 밴드로 */
.feat-hero{margin:6px 0 0;padding:42px 20px 38px;background:var(--tone-grad,var(--grad));color:#fff;}
.feat-title{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.14;color:#fff;}
.feat-sub{font-size:14px;font-weight:600;color:rgba(255,255,255,.92);margin-top:8px;}
/* 세부탭 폼: 동계열 옅은 그룹 배경 */
.form2>.pcard{background:var(--tone-soft,var(--surface-2));border:1px solid var(--tone-border,var(--border));box-shadow:none;border-radius:var(--radius-lg);padding:16px 16px 6px;margin:14px 20px 0;}
.form2>.pcard+.pcard{margin-top:12px;padding-top:16px;border-top:1px solid var(--tone-border,var(--border));}
/* 폼 안 인풋은 흰 배경으로 대비 확보(가독성) */
.form2 input,.form2 textarea,.form2 select{background:#fff;}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .feat-hero{padding:56px 30px 50px;}
  .feat-title{font-size:38px;}
}
/* 상세/폼 2.0: 버튼 컴팩트+중앙, 콘텐츠 왼쪽 읽기 컬럼 */
.chal-detail .pbtn{max-width:420px;margin-left:auto;margin-right:auto;}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .chal-detail{max-width:720px;margin-right:auto;}
}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .pet2-hero{padding:56px 30px 50px;}
}
@keyframes petrise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* 작성 폼 분야 선택 */
.pet-catsel{display:flex;flex-wrap:wrap;gap:8px;}
.pet-goalsel{display:flex;flex-wrap:wrap;gap:8px;}
.req{color:var(--danger);}
/* 청원 작성 위저드 단계 표시 */
.pw-steps{display:flex;align-items:flex-start;padding:8px var(--page-x) 16px;}
.pw-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:56px;}
.pw-num{width:28px;height:28px;border-radius:50%;background:var(--surface-3);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;transition:background var(--dur-standard) var(--ease-out),color var(--dur-standard);}
.pw-step.on .pw-num{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft);}
.pw-step.done .pw-num{background:var(--accent-soft);color:var(--accent);}
.pw-l{font-size:11px;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pw-step.on .pw-l{color:var(--text-1);}
.pw-line{flex:1;height:2px;background:var(--divider);border-radius:2px;margin:14px 2px 0;}
.pet-chip{font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-family:inherit;transition:all .15s;}
.pet-chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
/* 상세 - 하나의 시트(표 형식) */
.pet-eyebrow{font-size:13px;font-weight:900;color:var(--ink);margin:6px 20px 0;padding-left:10px;border-left:3px solid var(--primary);line-height:1.3;animation:petrise .4s var(--ease) both;}
.pet-sheet{padding:20px 18px 6px;animation:petrise .5s var(--ease) both;animation-delay:.05s;}
.pet-title-row{display:flex;gap:9px;align-items:flex-start;}
.pet-doc{flex-shrink:0;margin-top:2px;}
.pet-doc svg{width:20px;height:20px;stroke:var(--primary);}
.pet-d-title{font-size:19px;font-weight:900;line-height:1.42;letter-spacing:-.4px;color:var(--ink);}
.pet-steps{display:flex;align-items:flex-start;margin:20px 0 6px;}
.pet-step{display:flex;flex-direction:column;align-items:center;gap:7px;width:56px;flex-shrink:0;}
.pet-step-dot{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid var(--line);transition:all .3s var(--ease);}
.pet-step.done .pet-step-dot{background:var(--primary);border-color:var(--primary);color:#fff;}
.pet-step.cur .pet-step-dot{box-shadow:0 0 0 5px var(--primary-tint);}
.pet-step-l{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
.pet-step.done .pet-step-l{color:var(--primary);}
.pet-step-line{flex:1;height:2px;background:var(--line);margin:16px 4px 0;border-radius:2px;}
.pet-row{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line);}
.pet-row .k{width:76px;flex-shrink:0;font-size:13px;font-weight:800;color:var(--sub);}
.pet-row .v{flex:1;min-width:0;font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.55;}
.pet-row.col{flex-direction:column;gap:8px;}
.pet-note{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px;}
.pet-agree-line{display:flex;align-items:baseline;justify-content:space-between;}
.pet-agree-big{font-size:22px;font-weight:900;color:var(--primary);letter-spacing:-.5px;}
.pet-pct{font-size:14px;font-weight:900;color:var(--primary);}
.pet-prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px;}
.pet-prog i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s var(--ease);}
.pet-body{font-size:14px;line-height:1.85;color:var(--ink2);font-weight:500;white-space:pre-wrap;}
.pet-phasebtns{display:flex;flex-wrap:wrap;gap:8px;}
.pet-cta{padding:18px 18px 6px;text-align:center;}
.pet-agree-btn{width:auto;min-width:180px;font-size:14.5px;padding:12px 40px;}
.pet-agree-btn.agreed{background:var(--primary-tint);color:var(--primary);box-shadow:none;}

/* 제본소 */
.pr-subbtn{margin-top:4px;font-size:17px;font-weight:900;padding:18px 0;letter-spacing:-.3px;box-shadow:var(--sh-blue);animation:prpulse 2.4s ease-in-out infinite;}
@keyframes prpulse{0%,100%{box-shadow:0 8px 22px rgba(123,108,255,.32)}50%{box-shadow:0 10px 30px rgba(123,108,255,.5)}}
.pr-steps{margin:14px 0 4px;}
.pr-steps .pet-step{width:auto;flex:1;}
.pr-pill{flex-shrink:0;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap;}
.pr-pill.s0{background:var(--soft);color:var(--sub);}
.pr-pill.s1{background:rgba(245,166,35,.16);color:#E0930F;}
.pr-pill.s2{background:rgba(47,180,166,.16);color:#2FB4A6;}
.pr-card{cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease);}
.pr-card:active{transform:scale(.985);}
.pr-detail-hero{display:flex;flex-direction:column;}
.book-badge.pr-badge.s0{color:var(--sub);}
.book-badge.pr-badge.s1{color:#E0930F;}
.book-badge.pr-badge.s2{background:rgba(20,26,40,.72);color:#fff;}

/* 책 교환 (굿노트 책장) */
.book-help{margin:10px 18px 2px;padding:13px 15px;background:var(--primary-tint);border-radius:14px;font-size:12.5px;line-height:1.65;color:var(--ink2);}
.book-help b{color:var(--primary);font-weight:800;}
.p3 .upload.book-up.has{padding:16px;border-style:solid;border-color:var(--line);background:var(--soft);}
.p3 .upload.book-up.has img{width:auto;max-width:150px;max-height:206px;aspect-ratio:3/4.1;object-fit:cover;margin:0 auto;border-radius:6px;box-shadow:0 5px 14px rgba(0,0,0,.16);}
.book-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 16px;padding:12px 20px 10px;justify-content:start;}
@media (min-width:820px) and (min-aspect-ratio:1/1){.book-shelf{grid-template-columns:repeat(auto-fill,minmax(124px,148px));}}
.book-item{cursor:pointer;animation:petrise .45s var(--ease) both;}
.book-item:active{transform:scale(.97);}
.book-cover{position:relative;aspect-ratio:3/4.1;border-radius:3px 9px 9px 3px;overflow:hidden;background:var(--soft);box-shadow:0 6px 16px rgba(20,26,40,.18),0 1px 3px rgba(0,0,0,.1);border:1px solid rgba(0,0,0,.05);transition:transform .22s var(--ease),box-shadow .22s;}
.book-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.24),rgba(0,0,0,.02));z-index:2;}
.book-cover::after{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.22);z-index:2;}
.book-item:hover .book-cover{transform:translateY(-6px) rotate(-1.2deg);box-shadow:0 18px 34px rgba(20,26,40,.26);}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.book-cover .bc-title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 14px 16px 20px;font-size:14px;font-weight:800;color:#fff;line-height:1.45;letter-spacing:-.3px;text-shadow:0 1px 5px rgba(0,0,0,.2);overflow:hidden;}
.book-badge{position:absolute;top:8px;right:8px;z-index:3;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);}
.book-badge.give{color:#2FB4A6;}
.book-badge.swap{color:var(--primary);}
.book-badge.done{background:rgba(20,26,40,.72);color:#fff;}
.book-label{padding:9px 2px 0;}
.bl-title{font-size:13.5px;font-weight:800;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bl-meta{font-size:11.5px;color:var(--sub);margin-top:3px;}
.book-add .book-addcover{display:flex;align-items:center;justify-content:center;background:var(--soft);border:2px dashed var(--line);box-shadow:none;}
.book-add .book-addcover span{font-size:42px;font-weight:200;color:var(--muted);line-height:1;}
.book-add .book-addcover::before,.book-add .book-addcover::after{display:none;}
.book-add:hover .book-addcover{transform:translateY(-4px);border-color:var(--primary);}
.book-add:hover .book-addcover span{color:var(--primary);}
.book-hero{max-width:210px;margin:6px auto 0;}
.book-hero .book-cover:hover{transform:none;}
.book-kind{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--primary-tint);color:var(--primary);}
.book-kind.give{background:rgba(47,180,166,.14);color:#2FB4A6;}
.book-kind.grade{background:var(--soft);color:var(--sub);}
.book-want{margin-top:10px;padding:10px 13px;background:var(--soft);border-radius:12px;font-size:13px;color:var(--ink2);}
/* 책 교환: 마켓 카드 리스트 */
.bmk-list{padding:4px 16px 12px;}
.bmk-add{width:100%;margin:4px 0 8px;padding:13px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:800;transition:transform var(--dur-micro) var(--ease-spring);}
.bmk-add:active{transform:scale(.98);}
.bmk-card{display:flex;align-items:center;gap:13px;padding:13px 4px;cursor:pointer;border-bottom:1px solid var(--divider);transition:background var(--dur-micro) ease;animation:petrise .4s var(--ease) both;}
.bmk-card:active{background:var(--surface-2);}
.bmk-card:last-child{border-bottom:none;}
.bmk-thumb{position:relative;width:74px;height:74px;border-radius:14px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(20,26,40,.13);}
.bmk-thumb img{width:100%;height:100%;object-fit:cover;}
.bmk-thumb span{padding:8px;font-size:11.5px;font-weight:800;color:#fff;text-align:center;line-height:1.3;letter-spacing:-.2px;text-shadow:0 1px 3px rgba(0,0,0,.28);}
.bmk-info{flex:1;min-width:0;}
.bmk-title{font-size:15px;font-weight:800;color:var(--text-1);line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bmk-sub{font-size:12px;color:var(--text-3);margin-top:3px;}
.bmk-tags{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
.bmk-want{font-size:11.5px;color:var(--text-2);font-weight:600;}
.bmk-want b{color:var(--accent);font-weight:800;}
.bmk-chev{flex-shrink:0;color:var(--text-3);display:flex;opacity:.6;}
.bmk-chev svg{width:18px;height:18px;}
/* 청원: 학생회 답변 */
.pet-answer{border-left:3px solid var(--accent);animation:petrise .4s var(--ease) both;}
.pet-ans-head{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.pet-ans-body{font-size:14px;line-height:1.62;color:var(--text-1);white-space:pre-wrap;}
.pet-answer textarea{width:100%;font-family:inherit;}
.book-want b{color:var(--ink);}
.bc-item{padding:11px 0;border-bottom:1px solid var(--line);}
.bc-head{display:flex;gap:7px;align-items:center;margin-bottom:4px;}
.bc-by{font-size:13px;font-weight:700;color:var(--ink);}
.bc-at{font-size:11px;color:var(--sub);}
.bc-txt{font-size:13.5px;line-height:1.5;color:var(--ink2);}
.book-item:nth-child(2){animation-delay:.04s}.book-item:nth-child(3){animation-delay:.08s}.book-item:nth-child(4){animation-delay:.12s}.book-item:nth-child(5){animation-delay:.16s}.book-item:nth-child(6){animation-delay:.2s}.book-item:nth-child(n+7){animation-delay:.24s}

@media (min-width:820px) and (min-aspect-ratio:1/1){
  .book-shelf{grid-template-columns:repeat(5,1fr);max-width:1000px;margin:0 auto;}
  .pet-grid{grid-template-columns:repeat(4,1fr);max-width:1000px;margin:0 auto;}
  .pet-feat{max-width:1000px;margin:8px auto 0;}
  .pet-feat-title{font-size:23px;}
  .pet-eyebrow{max-width:860px;margin:6px auto 0;}
  /* 챌린지 화면은 모달 대신 전체화면 */
  .screen.no-nav.p3.fs{flex:1;width:auto;max-width:none;height:auto;min-height:100dvh;max-height:none;margin:0;border-radius:0;box-shadow:none;background:var(--bg);display:block;overflow-y:auto;}
  .screen.no-nav.p3.fs>.phdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 26px 12px;max-width:none;}
  .chal-grid{grid-template-columns:repeat(3,1fr);max-width:1000px;margin:0 auto;}
  .chal-detail{max-width:860px;margin:0 auto;}
}
/* ===== 학교 탭 슬라이드 덱 ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.school-screen{height:100dvh;overflow:hidden;}
.school-tabs{display:flex;gap:6px;padding:4px 20px 12px;flex:none;}
.school-tab{flex:1;padding:11px 0;border:none;border-radius:12px;background:var(--surface-2);color:var(--text-2);font-weight:800;font-size:13.5px;font-family:inherit;cursor:pointer;transition:background .25s var(--ease),color .25s;}
.school-tab.on{background:var(--accent);color:#fff;box-shadow:none;}
.school-deck{display:flex;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.school-deck::-webkit-scrollbar{display:none;}
.school-slide{flex:0 0 100%;width:100%;scroll-snap-align:start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sc-inner{padding:2px 0 26px;max-width:none;margin:0 auto;animation:fadeUp .4s var(--ease) both;}
/* 학사일정 2.0: pcard 박스 대신 플랫 섹션 + 큰 제목 */
.sc2-sec{padding:10px 20px 6px;}
.sc2-t{font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--text-1);margin-bottom:4px;}
.sc2-note{font-size:13px;color:var(--text-3);font-weight:600;margin-top:2px;}
/* 회의록: 유튜브 스타일(썸네일 → 로고+제목+날짜) */
.yt-list{display:grid;grid-template-columns:1fr;gap:24px;padding:10px 20px 4px;}
.yt-item{cursor:pointer;}
.yt-thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;}
.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.yt-thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(145deg,#2a2a35,#3a3a48);}
.yt-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:.92;transition:transform var(--dur-standard) var(--ease-spring);}
.yt-play svg{width:24px;height:24px;margin-left:3px;}
.yt-item:active .yt-play{transform:translate(-50%,-50%) scale(.9);}
.yt-meta{display:flex;gap:11px;margin-top:12px;}
.yt-logo{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:var(--surface-2);}
.yt-logo img{width:100%;height:100%;object-fit:cover;}
.yt-info{flex:1;min-width:0;}
.yt-title{font-size:15px;font-weight:700;color:var(--text-1);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.yt-sub{font-size:12.5px;color:var(--text-3);margin-top:3px;}
.yt-del{flex:none;align-self:flex-start;font-size:12px;font-weight:700;color:var(--danger);background:var(--danger-tint);padding:5px 10px;border-radius:8px;}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .yt-list{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px 20px;}
}
.bk.mini{width:30px;height:30px;background:none;}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;padding:4px 0;color:var(--sub);}
.cal-dow.sun{color:var(--danger);}.cal-dow.sat{color:var(--primary);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;}
.cal-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;background:none;border:none;cursor:pointer;font-family:inherit;}
.cal-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);transition:background .18s,color .18s;}
.cal-num.sun{color:var(--danger);}.cal-num.sat{color:var(--primary);}
.cal-cell.today .cal-num{border:1.6px solid var(--primary);font-weight:800;}
.cal-cell.sel .cal-num{background:var(--grad);color:#fff!important;font-weight:800;box-shadow:var(--sh-blue);}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-legend{display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:11.5px;color:var(--sub);font-weight:600;}
.cal-legend span{display:flex;align-items:center;gap:5px;}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.sc-evdot{width:8px;height:8px;border-radius:50%;flex:none;margin-right:2px;}
.sc-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:76px 30px;text-align:center;font-size:40px;}
.sc-empty-t{font-size:17px;font-weight:800;color:var(--ink);}
.sc-empty-s{font-size:13.5px;color:var(--sub);line-height:1.65;}
/* 급식 세로 리스트 */
.meal-card{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px 15px;animation:fadeUp .38s var(--ease) both;}
.meal-slot{font-size:12.5px;font-weight:800;color:var(--primary);margin-bottom:8px;}
.meal-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
.meal-list li{font-size:13.5px;color:var(--ink2);font-weight:500;line-height:1.4;padding-left:12px;position:relative;}
.meal-list li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--line);}
/* 학사일정 달력(칸에 일정명) */
.acal{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px 12px;}
.acal-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px;}
.acal-mon{font-size:15px;font-weight:800;}
.acal-nav{width:30px;height:30px;border:none;border-radius:9px;background:var(--bg);color:var(--ink2);cursor:pointer;font-size:17px;transition:background .15s,transform .1s;}
.acal-nav:hover{background:var(--soft);}.acal-nav:active{transform:scale(.9);}
.acal-head{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:5px;}
.acal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);}
.acal-dow.sun{color:#F0616B;}.acal-dow.sat{color:var(--primary);}
.acal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.acal-cell{min-height:64px;border-radius:9px;padding:5px 4px;display:flex;flex-direction:column;gap:3px;background:var(--bg);overflow:hidden;animation:cellPop .3s var(--ease) both;}
.acal-cell.empty{background:transparent;min-height:0;animation:none;}
.acal-cell.today{background:var(--primary-tint);outline:1.6px solid var(--primary);}
.acal-num{font-size:12px;font-weight:700;color:var(--ink);line-height:1;}
.acal-num.sun{color:#F0616B;}.acal-num.sat{color:var(--primary);}
.acal-ev{font-size:9px;font-weight:700;line-height:1.3;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.acal-ev.home{background:rgba(240,97,107,.16);color:#E0424D;}
.acal-ev.school{background:rgba(22,163,74,.14);color:#16A34A;}
.acal-ev.exam{background:rgba(224,66,77,.16);color:#E0424D;}
.acal-ev.mock{background:rgba(245,166,35,.18);color:#E0930F;}
.acal-ev.event{background:var(--soft);color:var(--ink2);}
.acal-more{font-size:8.5px;color:var(--muted);font-weight:700;padding-left:4px;}
@keyframes cellPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* 채팅 말풍선 등장 */
.dm-msg{animation:msgIn .32s var(--ease) both;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.dm-msg.me{animation:msgInMe .32s var(--ease) both;}
@keyframes msgInMe{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

const uid=p=>(p||'x')+'_'+Math.random().toString(36).slice(2,9)
const fmt=n=>Number(n).toLocaleString('ko-KR')
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const nowISO=()=>new Date().toISOString()
const timeago=iso=>{if(!iso)return'';const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';const d=new Date(iso);return(d.getMonth()+1)+'월 '+d.getDate()+'일'}
const fmtDate=iso=>{if(!iso)return'상시';const d=new Date(iso);return(d.getMonth()+1)+'월 '+d.getDate()+'일'}
const isExpired=e=>e.deadline&&new Date(e.deadline)<new Date()
function readImg(file,maxW=900,q=0.6){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.src=r.result};r.readAsDataURL(file)})}
// 압축한 이미지를 Blob으로 반환 (Storage 업로드용)
function compressImg(file,maxW=900,q=0.6){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>res(b),'image/jpeg',q)};img.src=r.result};r.readAsDataURL(file)})}
// 사진을 Supabase Storage('photos' 버킷)에 올리고 공개 URL 반환. 실패 시 null.
async function uploadImg(file,folder='misc',maxW=900,q=0.6){
  try{
    const blob=await compressImg(file,maxW,q)
    const path=`${folder}/${uid('img')}.jpg`
    const{error}=await wt(sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:false}),15000)
    if(error){console.warn('사진 업로드 실패:',error.message);toast('사진 업로드 실패');return null}
    return sb.storage.from('photos').getPublicUrl(path).data.publicUrl
  }catch(e){console.warn(e);toast('사진 처리 실패');return null}
}

// 모든 DB 쿼리에 타임아웃 적용
function wt(p,ms=7000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))])}

let SESSION=null,USERS=[],TAB='home',STACK=[],commTab='challenge'
const openBooks=new Set()
const app=()=>document.getElementById('app')
// 타입별 토스트: toast(m) / toast(m,'success'|'error'|'info'|'loading')
function toast(m,type){const t=document.getElementById('toast');if(!t)return;
  const ic={success:'✓',error:'!',info:'i'}[type]||'';
  t.className='toast'+(type?' t-'+type:'');
  t.innerHTML=ic?`<span class="toast-ic">${ic}</span><span>${esc(m)}</span>`:esc(m);
  t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),type==='error'?3200:2500)}
// 무언가 올렸을 때 화면 중앙 하단에 톡 떠오르는 알림
function popMsg(text,emoji){const el=document.createElement('div');el.className='popmsg';el.innerHTML=`${emoji?`<span class="pm-ic">${emoji}</span>`:''}<span>${esc(text)}</span>`;document.body.appendChild(el);setTimeout(()=>el.classList.add('out'),1500);setTimeout(()=>el.remove(),1980)}

// ── Phase 2: 재사용 Bottom Sheet / Modal / Skeleton / Empty ──
let SHEET_OPEN=null,MODAL_OPEN=null
function lockScroll(on){const sc=app().querySelector('.screen');if(sc)sc.style.overflow=on?'hidden':''}
function openSheet({title='',body='',actions='',onMount}={}){
  closeSheet(true)
  const bd=document.createElement('div');bd.className='sheet-backdrop'
  const sh=document.createElement('div');sh.className='sheet'
  sh.innerHTML=`<div class="sheet-handle"></div>${title?`<div class="sheet-head"><div class="sheet-title">${esc(title)}</div></div>`:''}<div class="sheet-body">${body}</div>${actions?`<div class="sheet-actions">${actions}</div>`:''}`
  document.body.appendChild(bd);document.body.appendChild(sh)
  requestAnimationFrame(()=>{bd.classList.add('on');sh.classList.add('on')})
  lockScroll(true)
  const close=()=>closeSheet()
  bd.addEventListener('click',close)
  // 아래로 스와이프하면 닫힘 (본문 맨 위에서만)
  const bodyEl=sh.querySelector('.sheet-body');let sy=null,dy=0
  sh.addEventListener('touchstart',e=>{if(bodyEl.scrollTop>2){sy=null;return}sy=e.touches[0].clientY;dy=0},{passive:true})
  sh.addEventListener('touchmove',e=>{if(sy==null)return;dy=e.touches[0].clientY-sy;if(dy>0){sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`}},{passive:true})
  sh.addEventListener('touchend',()=>{if(sy==null)return;sh.style.transition='';if(dy>110)close();else sh.style.transform='';sy=null})
  SHEET_OPEN={bd,sh}
  if(onMount)onMount(sh)
  return{close,el:sh}
}
function closeSheet(instant){
  if(!SHEET_OPEN)return
  const{bd,sh}=SHEET_OPEN;SHEET_OPEN=null;lockScroll(false)
  if(instant){bd.remove();sh.remove();return}
  bd.classList.remove('on');sh.classList.remove('on');sh.style.transform=''
  setTimeout(()=>{bd.remove();sh.remove()},280)
}
function openModal({title='',body='',actions='',onMount}={}){
  closeModal(true)
  const bd=document.createElement('div');bd.className='sheet-backdrop'
  const md=document.createElement('div');md.className='modal'
  md.innerHTML=`${title?`<div class="modal-title">${esc(title)}</div>`:''}${body?`<div class="modal-body">${body}</div>`:''}${actions?`<div class="modal-actions">${actions}</div>`:''}`
  document.body.appendChild(bd);document.body.appendChild(md)
  requestAnimationFrame(()=>{bd.classList.add('on');md.classList.add('on')})
  const close=()=>closeModal();bd.addEventListener('click',close)
  MODAL_OPEN={bd,md}
  if(onMount)onMount(md)
  return{close,el:md}
}
function closeModal(instant){
  if(!MODAL_OPEN)return
  const{bd,md}=MODAL_OPEN;MODAL_OPEN=null
  if(instant){bd.remove();md.remove();return}
  bd.classList.remove('on');md.classList.remove('on')
  setTimeout(()=>{bd.remove();md.remove()},280)
}
// 확인 다이얼로그: confirmDialog('삭제할까요?','되돌릴 수 없어요',()=>{...},{okText,danger})
function confirmDialog(title,msg,onOk,opt={}){
  const{okText='확인',cancelText='취소',danger=false}=opt
  const{close,el}=openModal({title,body:msg,
    actions:`<button class="pbtn" id="md-cancel" style="background:var(--surface-2);color:var(--text-2)">${esc(cancelText)}</button><button class="pbtn ${danger?'':'pri'}" id="md-ok" ${danger?'style="background:var(--danger);color:#fff"':''}>${esc(okText)}</button>`})
  el.querySelector('#md-cancel').onclick=close
  el.querySelector('#md-ok').onclick=()=>{close();onOk&&onOk()}
}
// Skeleton 헬퍼
const skelLines=(n=3,w=[92,80,66])=>Array.from({length:n},(_,i)=>`<div class="skeleton skel-line" style="width:${w[i%w.length]}%"></div>`).join('')
const skelBlock=()=>`<div style="padding:6px 2px"><div class="skeleton skel-title"></div>${skelLines(3)}</div>`
// Empty state 헬퍼
function emptyHTML({icon='📭',title='',desc='',action=''}={}){return`<div class="empty-state"><div class="empty-ic">${icon}</div><div class="empty-title">${esc(title)}</div>${desc?`<div class="empty-desc">${esc(desc)}</div>`:''}${action?`<div class="empty-action">${action}</div>`:''}</div>`}
const nameOf=id=>(USERS.find(u=>u.id===id)||{name:'학생회'}).name
const photoOf=id=>{const u=id===(SESSION&&SESSION.id)?SESSION:USERS.find(u=>u.id===id);return u&&u.photo||null}

function avatarHTML(id,size=34){const p=photoOf(id),nm=nameOf(id)||'?';const s=size+'px';return p?`<img src="${esc(p)}" style="width:${s};height:${s};border-radius:50%;object-fit:cover;flex:none">`:`<div style="width:${s};height:${s};border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.4)}px;font-weight:700;color:var(--primary);flex:none">${esc(nm.charAt(0))}</div>`}
// 사진 소스 선택: OS 네이티브 팝업 대신 인라인 2버튼(앨범/촬영). 촬영은 카메라 직행
function photoPickHTML(base,label){return`<label>${label}</label>
  <div class="upload-pick">
    <label class="up-opt" for="${base}-gal">${I.image}<span>앨범</span></label>

  <input id="${base}-cam" type="file" accept="image/*" capture="environment" style="display:none">

function wirePhotoPick(base,onFile){
  const prev=document.getElementById(base+'-prev')
  const h=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(prev)prev.innerHTML=`<img src="${URL.createObjectURL(f)}">`;onFile(f)}

  if(g)g.onchange=h;if(c)c.onchange=h

// ── 알림 (okya_notifications). 테이블 없으면 조용히 무시(앱 흐름 방해 X) ──
let NOTIFS=[]
async function notify(userId,type,title,body,link){
  if(!userId||userId===(SESSION&&SESSION.id))return   // 자기 자신에겐 알림 안 만듦
  try{await wt(sb.from('okya_notifications').insert({id:uid('nt'),user_id:userId,type,title,body:body||'',link:link||'',read:false,at:nowISO()}),5000)}catch{}
}
// 여러 명에게 한 번에 알림. opts.includeAdmin=true면 학생회 임원도 포함
async function notifyMany(ids,type,title,body,link){for(const id of new Set(ids))await notify(id,type,title,body,link)}
async function notifyStudents(type,title,body,link){await notifyMany(USERS.filter(u=>u.role!=='admin').map(u=>u.id),type,title,body,link)}
async function notifyAdmins(type,title,body,link){await notifyMany(USERS.filter(u=>u.role==='admin').map(u=>u.id),type,title,body,link)}
async function loadNotifs(){try{const{data}=await wt(sb.from('okya_notifications').select('*').eq('user_id',SESSION.id).order('at',{ascending:false}).limit(50),5000);NOTIFS=data||[]}catch{NOTIFS=[]}updateAppBadge();return NOTIFS}
function unreadCount(){return NOTIFS.filter(n=>!n.read).length}
// 앱 아이콘 배지(패드 홈화면 우측 상단). 미지원 브라우저는 조용히 무시
function updateAppBadge(){try{const c=unreadCount();if('setAppBadge'in navigator){c>0?navigator.setAppBadge(c):navigator.clearAppBadge()}}catch{}}
async function markNotifsRead(){const uns=NOTIFS.filter(n=>!n.read);if(!uns.length){updateAppBadge();return}uns.forEach(n=>n.read=true);updateAppBadge();try{await wt(sb.from('okya_notifications').update({read:true}).eq('user_id',SESSION.id).eq('read',false),5000)}catch{}}
// 벨 버튼([data-bell])에 클릭·배지 반영
function wireBell(){updateAppBadge();document.querySelectorAll('[data-bell]').forEach(b=>{
  b.onclick=()=>{if(OK_OV)closeOverlay();else openNotifOverlay()}
  const old=b.querySelector('.nbadge');if(old)old.remove()
  const c=unreadCount();if(c>0){const s=document.createElement('span');s.className='nbadge';s.textContent=c>9?'9+':c;b.appendChild(s)}
})}
// 알림 종류 → 좌측 레일 위치
const NAV_TYPE={challenge:'challenge',petition:'petition',book:'book',binding:'print'}
// 미읽음 알림을 좌측 레일 버튼/서브버튼에 뱃지로 표시
function applyRailBadges(){
  const cnt={},bump=k=>cnt[k]=(cnt[k]||0)+1
  NOTIFS.filter(n=>!n.read).forEach(n=>{
    if(n.type==='dm')bump('search')
    else if(n.type==='money')bump('money')
    else if(n.type==='challenge'){bump('comm');bump('comm:challenge')}
    else if(n.type==='petition'){bump('comm');bump('comm:petition')}
    else if(n.type==='book'){bump('comm');bump('comm:book')}
    else if(n.type==='print'){bump('comm');bump('comm:binding')}
  })
  document.querySelectorAll('.rail-badge').forEach(b=>b.remove())
  const add=(btn,c)=>{if(!btn||!c)return;const s=document.createElement('span');s.className='nbadge rail-badge';s.textContent=c>9?'9+':c;const host=(RAIL_COLLAPSED?btn:(btn.querySelector('span')||btn));host.appendChild(s)}
  document.querySelectorAll('.bnav [data-tab]').forEach(b=>add(b,cnt[b.dataset.tab]))
  document.querySelectorAll('.bnav [data-nav]').forEach(b=>add(b,cnt[b.dataset.nav]))
}
// 특정 종류 알림 읽음 처리(해당 화면 진입 시)
async function markTypeRead(types){
  const set=new Set(types),uns=NOTIFS.filter(n=>!n.read&&set.has(n.type))
  if(!uns.length)return
  uns.forEach(n=>n.read=true);updateAppBadge();applyRailBadges();wireBell()
  try{for(const t of types)await wt(sb.from('okya_notifications').update({read:true}).eq('user_id',SESSION.id).eq('type',t).eq('read',false),5000)}catch{}
}
// 백그라운드로 알림 갱신(실시간 느낌) — 로그인 후 1회 시작
let NOTIF_TIMER=null
function startNotifPolling(){if(NOTIF_TIMER||!SESSION)return;NOTIF_TIMER=setInterval(async()=>{if(!SESSION)return;await loadNotifs();wireBell();applyRailBadges()},15000)}
// Enter로 확인/전송: 한 줄 input에서 같은 줄 버튼→화면 주요버튼 순으로 클릭 (textarea·조합중 제외)
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return
  const t=e.target;if(!t||t.tagName!=='INPUT')return
  const ty=(t.getAttribute('type')||'text').toLowerCase()
  if(['checkbox','radio','range','file','button','submit'].includes(ty))return
  let btn=t.parentElement&&t.parentElement.querySelector('button.minibtn:not([disabled]),button.pbtn:not([disabled])')
  const scr=app()
  if(!btn&&scr)btn=scr.querySelector('.pbtn.pri:not([disabled])')||scr.querySelector('.pr-subbtn:not([disabled])')
  if(btn){e.preventDefault();btn.click()}
})
// ESC → 열린 시트/모달 닫기
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(MODAL_OPEN){closeModal()}else if(SHEET_OPEN){closeSheet()}})

async function getAllTx(){try{const{data}=await wt(sb.from('okya_tx').select('*').order('at',{ascending:false}));return data||[]}catch{return[]}}
function balOf(id,txs){return txs.filter(t=>t.to===id).reduce((s,t)=>s+t.amount,0)-txs.filter(t=>t.from===id).reduce((s,t)=>s+t.amount,0)}
// 내 거래목록(최신순)에서 각 거래 직후의 잔액을 {거래id: 잔액}으로. curBal=현재 총잔액.
function runningBal(mine,curBal){const map={};let run=curBal;for(const t of mine){map[t.id]=run;run-=(t.to===SESSION.id?t.amount:-t.amount)}return map}
async function addTx(tx){try{const{error}=await wt(sb.from('okya_tx').insert({id:uid('tx'),at:nowISO(),...tx}));if(error){toast('오류: '+error.message);return false}
  // 거래 알림(받는 사람에게)
  if(tx.type==='송금'&&tx.to)notify(tx.to,'money','옥야머니 받음',`${nameOf(tx.from)}님이 ${fmt(tx.amount)}옥을 보냈어요`+(tx.reason?` · ${tx.reason}`:''))
  else if(tx.type==='발행'&&tx.to)notify(tx.to,'money','옥야머니 발행',`학생회가 ${fmt(tx.amount)}옥을 발행했어요`)
  else if(tx.type==='회수'&&tx.from)notify(tx.from,'money','옥야머니 회수',`학생회가 ${fmt(tx.amount)}옥을 회수했어요`)
  return true
}catch{toast('네트워크 오류');return false}}

function animateGauge(bar,pctEl,target,dur=1400,delay=280){
  if(!bar)return
  bar.style.transition='none';bar.style.width='0%'
  const t0=performance.now()+delay
  ;(function tk(now){
    const p=Math.max(0,Math.min(1,(now-t0)/dur)),e=1-Math.pow(1-p,3)
    if(now>=t0){bar.style.width=(target*e).toFixed(1)+'%';if(pctEl)pctEl.textContent=Math.round(target*e)}
    if(p<1)requestAnimationFrame(tk)
  })(performance.now())
}

// ===================== OKSS Motion System (JS) =====================
const OK_REDUCE=()=>matchMedia('(prefers-reduced-motion:reduce)').matches
// 스크롤 등장 리빌: 한 개의 영속 옵저버로 .ok-reveal 요소를 뷰포트 진입 시 노출
let _okRevealIO=null
function okRevealObserve(scope){
  if(OK_REDUCE())return
  if(!_okRevealIO){
    _okRevealIO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');_okRevealIO.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'})
  }
  ;(scope||document).querySelectorAll('.ok-reveal:not(.in),.ok-reveal-img:not(.in)').forEach(el=>_okRevealIO.observe(el))
}
// 홈 바로가기 auto-carousel: 포커스가 한 칸씩 자동 이동, interaction 시 pause·재개, 오프스크린/백그라운드/reduced-motion 대응
let OK_HOME=null
function initShortcutCarousel(){
  if(OK_HOME&&OK_HOME.destroy)OK_HOME.destroy()
  const rail=document.getElementById('h2-grid');if(!rail)return
  const tiles=[...rail.querySelectorAll('.h2-sc')];if(tiles.length<2)return
  rail.classList.add('ok-focusmode')
  let idx=0,timer=null,paused=false,resumeT=null,raf=null,onScreen=true,dead=false
  const reduce=OK_REDUCE()
  const focusUpdate=()=>{
    const c=rail.scrollLeft+rail.clientWidth/2
    let best=0,bd=1e9
    tiles.forEach((t,i)=>{const tc=t.offsetLeft+t.offsetWidth/2,dd=Math.abs(tc-c);if(dd<bd){bd=dd;best=i}})
    tiles.forEach((t,i)=>t.classList.toggle('is-focus',i===best));idx=best
  }
  const go=i=>{idx=(i%tiles.length+tiles.length)%tiles.length;const t=tiles[idx];rail.scrollTo({left:Math.max(0,t.offsetLeft-(rail.clientWidth-t.offsetWidth)/2),behavior:'smooth'})}
  const tick=()=>{if(paused||!onScreen||document.hidden)return;go(idx+1)}
  const start=()=>{if(reduce||dead||timer)return;timer=setInterval(tick,5000)}
  const stop=()=>{clearInterval(timer);timer=null}
  const pause=()=>{paused=true;clearTimeout(resumeT);resumeT=setTimeout(()=>{paused=false},5200)}
  rail.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=null;focusUpdate()})},{passive:true})
  ;['pointerdown','wheel','touchstart'].forEach(ev=>rail.addEventListener(ev,pause,{passive:true}))
  const io=new IntersectionObserver(es=>{es.forEach(e=>{onScreen=e.isIntersecting;onScreen?start():stop()})},{threshold:.35})
  io.observe(rail)
  const onVis=()=>{if(document.hidden)stop();else if(onScreen)start()}
  document.addEventListener('visibilitychange',onVis)
  focusUpdate()
  OK_HOME={destroy(){dead=true;stop();clearTimeout(resumeT);io.disconnect();document.removeEventListener('visibilitychange',onVis)}}
}

// ── 환경 레이어: 날씨·계절(아주 은은하게, "눈치채면 예쁜 정도") ──
let ENV_ON=false
const ENV_LAT=35.5417,ENV_LON=128.4922   // 창녕(옥야고 인근)
function seasonOf(m){return(m<=1||m===11)?'winter':m<=4?'spring':m<=7?'summer':'autumn'}
function weatherKind(code){if(code==null)return'clear';if(code>=95)return'storm';if((code>=71&&code<=77)||code>=85)return'snow';if((code>=51&&code<=67)||(code>=80&&code<=82))return'rain';if(code>=45&&code<=48)return'fog';if(code>=1&&code<=3)return'cloud';return'clear'}
async function fetchWeather(){
  try{const c=JSON.parse(localStorage.getItem('okya-weather')||'null');if(c&&Date.now()-c.ts<15*60000)return c.data}catch{}
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ENV_LAT}&longitude=${ENV_LON}&current=weather_code,is_day,temperature_2m`,{cache:'no-store'})
    const j=await r.json();const data={code:j.current?.weather_code??0,day:j.current?.is_day??1,temp:j.current?.temperature_2m}
    localStorage.setItem('okya-weather',JSON.stringify({ts:Date.now(),data}));return data
  }catch{return null}
}
async function initEnv(){
  let el=document.getElementById('env-layer')
  if(!el){el=document.createElement('div');el.id='env-layer';document.body.appendChild(el)}
  const season=seasonOf(new Date().getMonth())
  const w=await fetchWeather()
  const kind=w?weatherKind(w.code):'clear',day=w?w.day:1
  const fest=(()=>{try{return localStorage.getItem('okya-festival')==='1'}catch{return false}})()
  el.className=`season-${season} wx-${kind} ${day?'is-day':'is-night'}${fest?' festival':''}`
  let inner=''
  if(kind==='rain'||kind==='storm'){for(let i=0;i<16;i++)inner+=`<span class="wx-rain" style="left:${(Math.random()*100).toFixed(1)}%;animation-duration:${(0.5+Math.random()*0.5).toFixed(2)}s;animation-delay:${(Math.random()*2).toFixed(2)}s"></span>`}
  else if(kind==='snow'){for(let i=0;i<18;i++){const s=(2+Math.random()*3).toFixed(1);inner+=`<span class="wx-snow" style="left:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;animation-duration:${(4+Math.random()*4).toFixed(2)}s;animation-delay:${(Math.random()*5).toFixed(2)}s"></span>`}}
  else if(fest){for(let i=0;i<14;i++){const c=['#FF6B9D','#FFC24B','#7B6CFF','#4BC0A9','#5B9BFF'][i%5];inner+=`<span class="wx-confetti" style="left:${(Math.random()*100).toFixed(1)}%;background:${c};animation-duration:${(3+Math.random()*3).toFixed(2)}s;animation-delay:${(Math.random()*4).toFixed(2)}s"></span>`}}
  el.innerHTML=`<div class="env-glow"></div>${inner}`
}
function setFestival(on){try{on?localStorage.setItem('okya-festival','1'):localStorage.removeItem('okya-festival')}catch{};initEnv()}

function todaySummaryHTML(txs,admin){
  const d=new Date(),w=['일','월','화','수','목','금','토'][d.getDay()]
  const dateLine=`${d.getMonth()+1}월 ${d.getDate()}일 · ${w}요일`
  const todayS=todayKey()
  const upcoming=SCHEDULE.filter(s=>s.date>=todayS).sort((a,b)=>a.date<b.date?-1:1)
  const ddOf=s=>Math.max(0,Math.ceil((new Date(s.date)-new Date(todayS))/86400000))
  const examRe=/시험|고사|수능|평가|모의|창심/
  const exam=upcoming.find(s=>examRe.test(s.label)&&ddOf(s)<=14)
  const attNeed=!admin&&!attDoneToday(txs)
  const unread=unreadCount()
  let hl
  if(exam)hl={ic:'📝',t:exam.label,s:`D-${ddOf(exam)} · ${fmtDate(exam.date)}`,tone:'exam'}
  else if(attNeed)hl={ic:'✓',t:'오늘 출석 체크',s:'지금 누르고 +20옥 받기',tone:'att',act:'att'}
  else if(unread)hl={ic:'🔔',t:`새 알림 ${unread}개`,s:'확인해보세요',tone:'notif',act:'bell'}
  else if(upcoming[0])hl={ic:'📅',t:upcoming[0].label,s:`D-${ddOf(upcoming[0])} · ${fmtDate(upcoming[0].date)}`,tone:'notif'}
  else hl={ic:'🌤️',t:cheer(),s:'',tone:'default'}
  const meal=((mealsOf(todayS)||{})[defaultMealSlot()]||[]).filter(Boolean)
  const mealTxt=meal.length?meal.slice(0,2).join(' · '):'정보 없음'
  const next=upcoming[0]
  const strip=[
    `<div class="ts-item"><span class="ts-k">오늘 ${defaultMealSlot()}</span><span class="ts-v">${esc(mealTxt)}</span></div>`,
    next?`<div class="ts-item"><span class="ts-k">다음 일정</span><span class="ts-v">${esc(next.label)}<b class="ts-dd">D-${ddOf(next)}</b></span></div>`:''
  ].filter(Boolean).join('<span class="ts-div"></span>')

let OK_OV=null
function openOverlay({variant,title,bodyHTML}){
  closeOverlay()
  const bd=document.createElement('div');bd.className='ov-backdrop'
  const pn=document.createElement('div');pn.className='ov-panel p3 '+(variant==='center'?'ov-center':'ov-tr')
  pn.innerHTML=`<div class="ov-head"><span class="ov-t">${esc(title)}</span><button class="ov-x" aria-label="닫기">✕</button></div>${bodyHTML||''}`
  document.body.appendChild(bd);document.body.appendChild(pn)
  bd.onclick=closeOverlay
  pn.querySelector('.ov-x').onclick=closeOverlay
  const onKey=e=>{if(e.key==='Escape')closeOverlay()}
  document.addEventListener('keydown',onKey)
  OK_OV={bd,pn,onKey}
  requestAnimationFrame(()=>{bd.classList.add('in');pn.classList.add('in')})
  return pn
}
function closeOverlay(){
  if(!OK_OV)return
  const{bd,pn,onKey}=OK_OV;OK_OV=null
  document.removeEventListener('keydown',onKey)
  bd.classList.remove('in');pn.classList.remove('in')
  setTimeout(()=>{bd.remove();pn.remove()},260)
}

    body.innerHTML=order.filter(k=>groups[k]).map(k=>`<div class="hist2-datehd">${k}</div><div class="hist2-group">${groups[k].map(rowHTML).join('')}</div>`).join('')
    body.querySelectorAll('[data-nid]').forEach(el=>el.onclick=()=>{const n=NOTIFS.find(x=>x.id===el.dataset.nid);if(n)openNotif(n)})
  }
  markNotifsRead()
}

// 알림 센터
const NT_META={money:{ic:'money',tint:'green'},dm:{ic:'send',tint:'blue'},petition:{ic:'notice',tint:'org'},notice:{ic:'notice',tint:'blue'},book:{ic:'book',tint:'blue'},print:{ic:'print',tint:'org'},challenge:{ic:'star',tint:'green'}}
// 알림 → 날짜 버킷(오늘/어제/이번 주/이전)
function notifBucket(at){const d=new Date(at).getTime(),now=new Date(),s=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),D=86400000;return d>=s?'오늘':d>=s-D?'어제':d>=s-7*D?'이번 주':'이전'}
// 알림 클릭 → 해당 기능/상세로 딥링크. link 필드에 id가 있으면 상세로, 없으면 목록으로
function openNotif(n){
  const lk=(n.link||'').trim()
  const leave=()=>{if(OK_OV)closeOverlay();else pop()}
  const go=fn=>{leave();push(fn)}
  switch(n.type){
    case'dm':if(lk){go(()=>rDmChat(lk))}else{leave();TAB='search';routeTab()}break
    case'petition':go(lk?()=>rPetitionDetail(lk):rPetitionPage);break
    case'book':go(lk?()=>rBookDetail(lk):rBookPage);break
    case'challenge':go(rChallengePage);break
    case'binding':case'print':go(rPrint);break
    case'money':leave();openHistoryOverlay();break
    default:break
  }
}

// 급식 슬라이드(재설계): "오늘 급식"을 1초 안에 확인 → 날짜 이동 → 달력은 보조 도구
// 구조 = 날짜 네비 + 끼니 세그 + 큰 메뉴(히어로) + 나머지 끼니 미리보기 + 평가 + 달력 버튼
function schoolFoodSlide(el){
  if(!el)return
  const pad=n=>String(n).padStart(2,'0')
  const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
  const DOWL=['일요일','월요일','화요일','수요일','목요일','금요일','토요일']
  const SLOTS=['조식','중식','석식'],TIME={조식:'오전 8:00',중식:'오후 12:30',석식:'오후 6:00'}
  const t0=new Date();t0.setHours(0,0,0,0)
  // 급식이 실제로 존재하는 날짜(정렬) — 방학 등 빈 날 점프에 사용
  const avail=Object.keys(MEALS).filter(k=>{const m=MEALS[k];return m&&SLOTS.some(s=>(m[s]||[]).length)}).sort()
  let cur=new Date(t0),slot=defaultMealSlot()
  const draw=()=>{
    const dk=keyOf(cur),m=mealsOf(dk)
    const diff=Math.round((cur-t0)/86400000)
    const rel=diff===0?'오늘':diff===1?'내일':diff===-1?'어제':diff>1?`D-${diff}`:diff<-1?`${-diff}일 전`:''
    const have=SLOTS.filter(s=>m&&(m[s]||[]).length)
    if(have.length&&!have.includes(slot))slot=have.includes(defaultMealSlot())?defaultMealSlot():have[0]
    const items=(m&&(m[slot]||[]).filter(Boolean))||[]
    const seg=SLOTS.map(s=>`<button class="mseg-b${s===slot?' on':''}${have.includes(s)?'':' dim'}" data-slot="${s}">${s}</button>`).join('')
    let hero
    if(items.length){
      hero=`<div class="mmenu-wrap"><div class="mmenu-head"><span class="mmenu-slot">${slot}</span><span class="mmenu-time">${TIME[slot]}</span></div><ul class="mmenu">${items.map((x,i)=>`<li style="animation-delay:${i*40}ms">${esc(x)}</li>`).join('')}</ul></div>`
    }else{
      const next=avail.find(k=>k>=dk)||avail.filter(k=>k<dk).pop()
      let jump=''
      if(next&&next!==dk){const nd=new Date(next+'T00:00:00');jump=`<button class="mjump" data-jump="${next}">${nd.getMonth()+1}월 ${nd.getDate()}일 급식 보기 →</button>`}
      hero=`<div class="mmenu-wrap mempty"><div class="mempty-emoji">${diff>0?'📅':'🍽️'}</div><div class="mempty-t">${diff===0?'오늘은 급식이 없어요':'급식 정보가 없어요'}</div><div class="mempty-s">방학이거나 급식이 없는 날이에요</div>${jump}</div>`
    }
    const others=have.filter(s=>s!==slot)

// 급식 평점: 조·중·석 각각 별 5점 평가 → 평균 ★. 슬롯별 1회, 테이블 없으면 조용히 숨김
// date 컬럼에 "2026-08-11#중식" 형태 복합키로 저장(스키마 변경 없이 슬롯 분리)
async function renderMealRate(dateKey){
  const box=document.getElementById('meal-rate');if(!box)return
  const m=mealsOf(dateKey)
  if(!m){box.innerHTML='';return}  // 메뉴가 있는 날이면 언제든 평가 가능(방학·개학 대비 미래 제한 제거)
  const slots=['조식','중식','석식'].filter(k=>(m[k]||[]).some(Boolean))
  if(!slots.length){box.innerHTML='';return}
  let rows=null
  try{const r=await wt(sb.from('okya_meal_ratings').select('*').like('date',dateKey+'#%'),5000);rows=r.data}catch{box.innerHTML='';return}
  if(rows===null){box.innerHTML='';return}
  const cur=document.getElementById('meal-rate');if(!cur)return
  // score는 반개 단위 정수(1~10). 별 개수 = score/2. 슬롯별 사용자당 1행(고정 id)이라 밀 때마다 덮어씀(재평가)
  const starsHTML=val=>[1,2,3,4,5].map(i=>{
    const f=val>=i?1:(val>=i-0.5?0.5:0)
    return`<span class="star-slot"><span class="star-bg">☆</span><span class="star-clip" style="width:${f*100}%"><span class="star-fg">★</span></span></span>`
  }).join('')
  cur.innerHTML=`<div class="mrate"><div class="mrate-q">오늘 급식 어땠어?<span class="mrate-hint">별을 눌러 평가 · 밀어도 돼요</span></div><div class="mrate-rows">${slots.map(k=>{
    const key=dateKey+'#'+k
    const rs=rows.filter(x=>x.date===key)
    const mine=rs.find(x=>x.uid===SESSION.id)
    const avgHalf=rs.length?rs.reduce((s,x)=>s+(x.score||0),0)/rs.length:0
    const myVal=mine?mine.score/2:0
    return`<div class="mrate-row"><span class="mrate-slot">${k}</span><span class="mrate-stars" data-key="${key}">${starsHTML(myVal)}</span><span class="mrate-avg${rs.length?'':' none'}" data-avg="${key}">${rs.length?`★ ${(avgHalf/2).toFixed(1)}·${rs.length}`:'첫 평가'}</span></div>`
  }).join('')}</div></div>`
  // 별 위 드래그(포인터) → 반개 단위 실시간 채움, 손 떼면 저장
  const paint=(el,val)=>el.querySelectorAll('.star-slot').forEach((s,idx)=>{const i=idx+1,f=val>=i?1:(val>=i-0.5?0.5:0);const c=s.querySelector('.star-clip');if(c)c.style.width=(f*100)+'%'})
  cur.querySelectorAll('.mrate-stars').forEach(el=>{
    const key=el.dataset.key
    let rect=null
    const valFromX=cx=>{const r=rect||el.getBoundingClientRect();return Math.max(0.5,Math.min(5,Math.ceil((cx-r.left)/r.width*10)/2))}
    let dragging=false,pending=0
    const move=e=>{pending=valFromX(e.clientX);paint(el,pending)}
    el.addEventListener('pointerdown',e=>{e.preventDefault();rect=el.getBoundingClientRect();dragging=true;el.classList.add('dragging');try{el.setPointerCapture(e.pointerId)}catch{}move(e)})
    el.addEventListener('pointermove',e=>{if(dragging)move(e)})
    const end=async e=>{
      if(!dragging)return
      dragging=false;el.classList.remove('dragging');try{el.releasePointerCapture(e.pointerId)}catch{}
      const score=Math.round(pending*2)
      // 내 기존 평가(랜덤 id 포함) 제거 후 재삽입 → 슬롯당 1행 보장, 재평가 가능
      await wt(sb.from('okya_meal_ratings').delete().eq('date',key).eq('uid',SESSION.id)).catch(()=>{})
      const{error}=await wt(sb.from('okya_meal_ratings').insert({id:'mr_'+key+'_'+SESSION.id,date:key,uid:SESSION.id,score,at:nowISO()})).catch(er=>({error:er}))
      if(error){toast('평가 저장 실패 · 다시 시도해줘','error');return}
      popMsg('평가 완료','⭐');renderMealRate(dateKey)
    }
    el.addEventListener('pointerup',end)
    el.addEventListener('pointercancel',end)
  })
}

// 학사일정(귀가/등교 + 고정일정) 데이터
function schoolEvents(){
  const ev=[{date:'2026-08-29',label:'귀가 (집)',type:'home'}]
  const pad=n=>String(n).padStart(2,'0')
  const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
  // 첫 정규 금요일 귀가는 3주 예외(9/18), 이후 2주 간격 금요일 귀가·일요일 등교
  let g=new Date(2026,8,18)
  const end=new Date(2026,11,31)
  while(g<=end){
    const b=new Date(g);b.setDate(b.getDate()+2)
    ev.push({date:key(g),label:'귀가 (집)',type:'home'})
    ev.push({date:key(b),label:'등교',type:'school'})
    g.setDate(g.getDate()+14)
  }
  SCHOOL_FIXED.forEach(s=>ev.push({...s}))
  ;(SCHEDULE||[]).forEach(s=>{if(s.date>='2026-09-01')ev.push({date:s.date,label:s.label,type:s.type||'event'})})
  return ev
}
// 학사일정 전용 달력(칸에 일정명 기재, 점 크게)
function acalGrid(vy,vm,evMap,todayStr){
  const first=new Date(vy,vm,1).getDay(),days=new Date(vy,vm+1,0).getDate(),wd=['일','월','화','수','목','금','토']
  const pad=n=>String(n).padStart(2,'0')
  let head=wd.map((w,i)=>`<div class="acal-dow${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('')
  let cells=''
  for(let i=0;i<first;i++)cells+=`<div class="acal-cell empty"></div>`
  for(let d=1;d<=days;d++){
    const dow=(first+d-1)%7
    const ds=`${vy}-${pad(vm+1)}-${pad(d)}`
    const isT=ds===todayStr
    const evs=evMap[d]||[]
    const chips=evs.slice(0,2).map(s=>`<span class="acal-ev ${s.type}">${esc(s.label)}</span>`).join('')+(evs.length>2?`<span class="acal-more">+${evs.length-2}</span>`:'')
    cells+=`<div class="acal-cell${isT?' today':''}"><span class="acal-num${dow===0?' sun':dow===6?' sat':''}">${d}</span>${chips}</div>`
  }
  return`<div class="acal"><div class="acal-top"><div class="acal-mon">${vy}년 ${vm+1}월</div><div style="display:flex;gap:4px"><button data-mcnav="-1" class="acal-nav">‹</button><button data-mcnav="1" class="acal-nav">›</button></div></div><div class="acal-head">${head}</div><div class="acal-grid">${cells}</div></div>`
}

      ${monthEvs.length?`<div class="sc2-sec"><h2 class="sc2-t">${vm+1}월 일정</h2>${monthEvs.map((s,i)=>{const dd=Math.ceil((new Date(s.date)-new Date(todayStr))/86400000);const tag=dd===0?'오늘':dd>0?`D-${dd}`:s.date.slice(5).replace('-','/');const dw=['일','월','화','수','목','금','토'][new Date(s.date).getDay()];return`<div class="srow" style="animation:fadeUp .35s var(--ease) both;animation-delay:${i*35}ms"><span class="sc-evdot" style="background:${dotColor(s.type)}"></span><div class="l"><div class="t">${esc(s.label)}</div><div class="d">${s.date.slice(5).replace('-','/')} (${dw})</div></div><span class="dday">${tag}</span></div>`}).join('')}</div>`:'<div class="empty">이번 달 일정이 없어요</div>'}
    </div>`
    el.querySelectorAll('[data-mcnav]').forEach(b=>b.onclick=()=>{vm+=(+b.dataset.mcnav);if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}draw()})

// 교실예약 (자습실 시간대) — 월~금: 야자1·2 / 토·일: 오전1·2 오후1·2·3 야자1·2 (중복 선택)
async function rRoom(){
  const dow2slots=dow=>(dow===0||dow===6)?['오전1','오전2','오후1','오후2','오후3','야자1','야자2']:['야자1','야자2']
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
  const WD=['일','월','화','수','목','금','토']
  let off=0
  const render=async()=>{
    app().innerHTML=`<div class="screen no-nav fade-in p3"><div class="phdr"><button class="bk" id="bk0">${I.back}</button><div class="ttl">교실예약</div><div style="width:34px"></div></div><div class="loader" style="min-height:200px"><div class="spin"></div></div></div>`
    document.getElementById('bk0').onclick=pop
    const d=new Date();d.setDate(d.getDate()+off);const ds=iso(d),dow=d.getDay()
    const slots=dow2slots(dow)
    let rows=[];try{const r=await wt(sb.from('okya_reservations').select('*').eq('date',ds));rows=r.data||[]}catch{}
    const sel=new Set(rows.filter(x=>x.user_id===SESSION.id).map(x=>x.slot))
    const byMe=new Set(sel)
    const drawSlots=()=>document.getElementById('rm-slots').innerHTML=slots.map(s=>{
      const who=rows.filter(x=>x.slot===s).map(x=>x.user_name)
      const on=sel.has(s)
      const sr=who.length?`예약 ${who.length}명 · ${who.slice(0,3).join(', ')}${who.length>3?' 외':''}`:'예약 없음'
      return`<div class="slot${on?' on':''}" data-slot="${s}"><div class="sbody"><div class="sn">${s}</div><div class="sr">${esc(sr)}</div></div><div class="chk">${ICO_CHECK_SM}</div></div>`
    }).join('')
    app().innerHTML=`<div class="screen no-nav fade-in p3">
      <div class="phdr"><button class="bk" id="bk">${I.back}</button><div class="ttl">교실예약</div><div style="width:34px"></div></div>
      <div class="daynav">
        <button class="dn" id="rm-prev">${I.back}</button>
        <div class="dl">${d.getMonth()+1}월 ${d.getDate()}일<small>${WD[dow]}요일${off===0?' · 오늘':''}</small></div>
        <button class="dn" id="rm-next">${I.chev}</button>
      </div>
      <div class="pcard"><div class="sec">시간대 선택 <span style="font-size:12px;font-weight:600;color:var(--sub)">(중복 가능)</span></div><div id="rm-slots"></div></div>
      <div style="padding:10px 18px calc(16px + env(safe-area-inset-bottom))"><button class="pbtn pri" id="rm-save">예약 저장</button></div>
    </div>`
    document.getElementById('bk').onclick=pop
    document.getElementById('rm-prev').onclick=()=>{off--;render()}
    document.getElementById('rm-next').onclick=()=>{off++;render()}
    drawSlots()
    document.getElementById('rm-slots').onclick=e=>{
      const el=e.target.closest('[data-slot]');if(!el)return
      const s=el.dataset.slot;sel.has(s)?sel.delete(s):sel.add(s)
      el.classList.toggle('on')
    }
    document.getElementById('rm-save').onclick=async()=>{
      const btn=document.getElementById('rm-save');btn.disabled=true;btn.textContent='저장 중...'
      const add=[...sel].filter(s=>!byMe.has(s)),del=[...byMe].filter(s=>!sel.has(s))
      try{
        if(add.length)await wt(sb.from('okya_reservations').insert(add.map(s=>({id:uid('rv'),date:ds,slot:s,user_id:SESSION.id,user_name:SESSION.name,at:nowISO()}))))
        for(const s of del)await wt(sb.from('okya_reservations').delete().eq('date',ds).eq('slot',s).eq('user_id',SESSION.id))
        toast('예약을 저장했어요')
      }catch{toast('저장 실패 — 잠시 후 다시')}
      render()
    }
  }
  render()
}

const BIND_OPTS=[['spring','스프링 제본 (일반)',500],['cover','표지 제본',1000]]
const PR_STATUS=['접수','제작중','완료']
function bindLabel(k){const f=BIND_OPTS.find(x=>x[0]===k);return f?f[1]:'스프링 제본 (일반)'}
function bindFee(k){const f=BIND_OPTS.find(x=>x[0]===k);return f?f[2]:500}
function printCost(copies,bind){return bindFee(bind)*(copies||1)}
function prSteps(si){return`<div class="pet-steps pr-steps">${PR_STATUS.map((s,i)=>`<div class="pet-step${i<=si?' done':''}${i===si?' cur':''}"><div class="pet-step-dot">${i<si?'✓':i+1}</div><div class="pet-step-l">${s}</div></div>`).join('<div class="pet-step-line"></div>')}</div>`}

async function commBannerItems(){

  try{

    const bks=bk.filter(b=>b.status!=='matched'&&(b.applicants||[]).length===0).sort((a,b)=>(a.at<b.at?1:-1))
    if(pes[0])items.push({type:'petition',kind:'petition',id:pes[0].id,tag:'주목 청원',title:pes[0].title||pes[0].txt||'제목 없음',sub:pes[0].purpose||'',meta:`익명 · 동의 ${fmt(petAgrees(pes[0]))} · ${timeago(petStart(pes[0]))}`})

    bks.slice(0,2).forEach(b=>items.push({type:'book',kind:'book',id:b.id,tag:b.kind==='나눔'?'책 나눔':'책 교환',title:b.title,sub:b.kind==='교환'&&b.want?`↔ ${b.want}`:`${b.grade||''} · ${b.owner_name||''}`,img:b.photo}))

// 배너 커버플로우: 3D로 겹쳐 뒤→앞으로 넘어오는 느낌 + 점 동기화 + 느린 자동(수동 시 타이머 리셋)
function initCarousel(){
  const stage=document.getElementById('cbtrack');if(!stage)return
  const dots=[...document.querySelectorAll('#cbdots i')]
  const cards=[...stage.querySelectorAll('.cbcard')];const n=cards.length;if(!n)return
  let active=0,timer=null,downX=null,moved=false
  const layout=()=>{
    const w=cards[0].offsetWidth||360
    cards.forEach((el,i)=>{
      let o=i-active
      if(o>n/2)o-=n; else if(o<-n/2)o+=n            // 최단 경로(돌아가는 느낌)
      const ao=Math.abs(o)
      el.style.transition=ao>=2?'none':''            // 멀리서 감싸는 카드는 순간 이동(중앙 가로지르기 방지)
      if(ao>2){el.style.opacity='0';el.style.pointerEvents='none';el.style.zIndex='0';el.style.transform='translate(-50%,-50%) scale(.5)';el.classList.remove('is-active');return}
      el.style.opacity=ao===0?'1':(ao===1?'.82':'.4')
      el.style.pointerEvents='auto'
      el.style.zIndex=String(30-ao)
      const x=o*w*0.46                               // 더 안쪽으로 겹침
      const z=-ao*170                                // 구 형태 깊이감(뒤로 밀기)
      const sc=ao===0?1:(ao===1?.66:.46)             // 중앙-양옆 크기차 크게(메인 강조)
      const rot=o*-33                                // 바깥을 보도록 더 꺾기
      el.style.transform=`translate(-50%,-50%) translate3d(${x}px,0,${z}px) rotateY(${rot}deg) scale(${sc})`
      el.classList.toggle('is-active',ao===0)
    })
    dots.forEach((d,j)=>d.classList.toggle('on',j===active))
  }
  const stopAuto=()=>{clearTimeout(timer)}
  const startAuto=()=>{stopAuto();timer=setTimeout(()=>{if(document.body.contains(stage))go(active+1)},9000)}
  const go=i=>{active=((i%n)+n)%n;layout();startAuto()}          // 이동할 때마다 타이머 리셋 → 동시 넘김 방지
  dots.forEach((d,i)=>d.onclick=()=>go(i))
  cards.forEach((el,i)=>el.onclick=()=>{if(moved){moved=false;return}if(i!==active){go(i);return}const gp=el.dataset.go;if(gp){const[k,id]=gp.split(':');if(k==='challenge')push(()=>rChallengeDetail(id));else if(k==='petition')push(()=>rPetitionDetail(id));else if(k==='book')push(()=>rBookDetail(id))}})
  // 스와이프(포인터 드래그) — 포인터 캡처로 화면 밖까지 인식, 리스너는 stage에만(누수 방지)
  stage.addEventListener('pointerdown',e=>{downX=e.clientX;moved=false;stopAuto();try{stage.setPointerCapture(e.pointerId)}catch(_){}})
  stage.addEventListener('pointermove',e=>{if(downX==null)return;if(Math.abs(e.clientX-downX)>8)moved=true})
  stage.addEventListener('pointerup',e=>{if(downX==null)return;const dx=e.clientX-downX;downX=null;if(dx<=-40)go(active+1);else if(dx>=40)go(active-1);else startAuto()})
  stage.addEventListener('pointercancel',()=>{downX=null;startAuto()})
  layout();startAuto()
}
