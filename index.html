<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ── 디자인 토큰 (Phase 1 재정립) ──
   원칙: 새 semantic 토큰을 source of truth로 두고, 기존 토큰명은 별칭으로 보존해 회귀 방지 */
:root{
  /* Surfaces */
  --surface:#FFFFFF;          /* 카드/시트 기본 면 */
  --surface-2:#F1F3F7;        /* 인풋·subtle fill */
  --surface-3:#E9ECF2;        /* 더 눌린 fill */
  --surface-elevated:#FFFFFF; /* 시트/모달 (강한 그림자와 함께) */
  --bg:#F7F8FA;               /* 앱 배경 (quiet neutral) */

  /* Text hierarchy */
  --text-1:#15181F;           /* 제목 */
  --text-2:#5B6473;           /* 본문 보조 */
  --text-3:#98A0B0;           /* caption/tertiary */

  /* Accent — 브랜드 컬러(전체 도배 금지, 강조에만) */
  --accent:#7B6CFF;
  --accent-d:#6A4FE0;
  --accent-soft:#F0EEFF;

  /* Lines */
  --divider:#EEF1F5;          /* row 사이 hairline */
  --border:#E3E7EE;           /* 인풋/카드 border */

  /* Radius scale */
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --radius-xl:28px;
  --radius-full:999px;

  /* Spacing scale (Phase 1) — 페이지별 임의값 대신 이 스케일만 사용 */
  --sp-1:4px;  --sp-2:8px;   --sp-3:12px;  --sp-4:16px;  --sp-5:20px;
  --sp-6:24px; --sp-8:32px;  --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --page-x:20px;             /* 페이지 좌우 기본 여백(홈과 통일) */

  /* Shadow scale (restrained, native) */
  /* Shadow scale — Apple식 아주 옅고 넓게 확산(박스 경계 최소화) */
  --shadow-sm:0 1px 2px rgba(20,26,40,.035);
  --shadow-md:0 6px 22px rgba(20,26,40,.05),0 1px 3px rgba(20,26,40,.028);
  --shadow-lg:0 22px 52px rgba(20,26,40,.085),0 4px 12px rgba(20,26,40,.04);

  /* Motion durations */
  --dur-micro:120ms;          /* 버튼/아이콘/토글 */
  --dur-standard:240ms;       /* 페이지/카드/시트 */
  --dur-emphasis:480ms;       /* 성공/출석/레벨업 */
  /* Motion easings */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.42,.5,1);
  --ease-inout:cubic-bezier(.4,0,.2,1);

  /* ── 기존 토큰 별칭 (기존 CSS 회귀 방지) ── */
  --card:var(--surface);
  --ink:var(--text-1);
  --ink2:var(--text-2);
  --muted:var(--text-3);
  --sub:#8A90A0;
  --soft:#F6F7FB;
  --line:var(--divider);
  --primary:var(--accent);
  --primary-d:var(--accent-d);
  --primary-tint:var(--accent-soft);
  --ga:#6453FF;
  --gb:#CE7AFF;
  --grad:linear-gradient(135deg,var(--ga) 0%,var(--gb) 100%);
  --danger:#EF4444;
  --danger-tint:#FEECEC;
  --r:var(--radius-lg);
  --sh:var(--shadow-md);
  --sh-blue:0 14px 32px rgba(123,108,255,.34),-3px 4px 14px rgba(123,108,255,.12);
  --ease:var(--ease-out);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform var(--dur-micro) var(--ease-spring),opacity var(--dur-micro) ease,background var(--dur-micro) ease,box-shadow var(--dur-micro) ease;}
button:active{transform:scale(.965);opacity:.92;}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:13px 15px;border:1.5px solid transparent;border-radius:var(--radius-md);background:var(--surface-2);color:var(--text-1);outline:none;transition:background var(--dur-standard) var(--ease-out),border-color var(--dur-standard) var(--ease-out),box-shadow var(--dur-standard) var(--ease-out);}
input::placeholder,textarea::placeholder{color:var(--text-3);}
input:focus,select:focus,textarea:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,108,255,.16);}
.field.has-error input,.field.has-error textarea,.field.has-error select,input.err,textarea.err{border-color:var(--danger);background:var(--danger-tint);box-shadow:0 0 0 3px rgba(239,68,68,.12);}
.field-help{font-size:12px;color:var(--text-3);margin:6px 2px 0;}
.field-help.err{color:var(--danger);}
label{display:block;font-size:13px;color:var(--text-2);font-weight:600;margin-bottom:6px;}
.field{margin-bottom:14px;}

/* ── Typography scale (Phase 1) ── */
.t-title{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--text-1);line-height:1.25;}
.t-section{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--text-3);text-transform:none;}
.t-body{font-size:15px;font-weight:500;color:var(--text-1);line-height:1.5;}
.t-secondary{font-size:14px;font-weight:500;color:var(--text-2);line-height:1.45;}
.t-caption{font-size:12px;font-weight:500;color:var(--text-3);}
/* 숫자 전용: 큰 값은 tabular, display 느낌 */
.t-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em;font-weight:800;color:var(--text-1);}
.t-num .unit{font-size:.56em;font-weight:600;color:var(--text-2);margin-left:.14em;letter-spacing:0;}
.t-dday{font-variant-numeric:tabular-nums;font-weight:900;letter-spacing:-.03em;color:var(--accent);}

/* ── Interaction utility (Phase 1): 재사용 pressed 상태 ── */
.pressable{transition:transform var(--dur-micro) var(--ease-spring),background var(--dur-micro) ease,box-shadow var(--dur-micro) ease;}
.pressable:active{transform:scale(.97);background:var(--surface-2);}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;}
  button:active,.pressable:active{transform:none;}
  /* 장식적 등장 애니메이션 억제(피드백 모션은 JS에서 별도 가드) */
  .mhero,.mhero .mmenu li,.pet-item,.pet-hero,.mother,.srow{animation:none!important;}
}

/* ── Layout ── */
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
.screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(92px + env(safe-area-inset-bottom));background:var(--bg);}
.screen.no-nav{padding-bottom:0;background:var(--card);}
.dm-screen{height:100dvh;overflow:hidden;background:var(--bg);}
.dm-panel{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 6px 26px rgba(20,26,40,.10);margin:10px;}
.dm-inputbar{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:6px 6px 6px 16px;display:flex;align-items:flex-end;gap:8px;transition:border-color .18s var(--ease);}
.dm-inputbar:focus-within{border-color:var(--primary);}
.dm-inputbar textarea,.dm-inputbar input,.dm-inputbar textarea:focus,.dm-inputbar input:focus{border:none!important;box-shadow:none!important;background:none!important;}

/* ── Bottom nav (floating) ── */
.bnav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:rgba(255,255,255,.93);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);border:1px solid rgba(255,255,255,.65);display:flex;padding:8px 6px;z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10px;font-weight:600;color:var(--text-3);transition:color var(--dur-standard) var(--ease-out);}
.bnav-item.active{color:var(--accent);font-weight:700;}
.bnav-item svg{width:22px;height:22px;transition:transform var(--dur-standard) var(--ease-spring);}
.bnav-item.active svg{transform:translateY(-1px) scale(1.1);}
.bnav-item:active svg{transform:scale(.9);}

/* ── 헤더 ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);}
.hdr h2{font-size:18px;font-weight:800;}
.sub-hdr{display:flex;align-items:center;gap:10px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.sub-hdr h2{font-size:18px;font-weight:800;}
.back-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);flex:none;}
.back-btn svg{width:20px;height:20px;}

/* ── 카드 (통일된 단일 스타일) ── */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:12px;}
.card-list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;}

/* ── 잔액 카드 ── */
.bal-card{background:radial-gradient(130% 120% at 12% 0%,rgba(255,255,255,.24),rgba(255,255,255,0) 46%),var(--grad);color:#fff;border-radius:var(--r);padding:22px 22px 20px;box-shadow:var(--sh-blue);margin:16px 20px;position:relative;overflow:hidden;}
.bal-card::before{content:'';position:absolute;top:-28px;right:-20px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;}
.bal-card::after{content:'';position:absolute;bottom:-36px;right:36px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none;}
.bal-card .lbl{font-size:11px;opacity:.7;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.bal-card .amt{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px;line-height:1;color:#fff;}
.bal-card .amt small{font-size:17px;font-weight:700;opacity:.85;margin-left:3px;}
.bal-acts{display:flex;gap:8px;margin-top:18px;}
.bal-act{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:12px;padding:9px 16px;font-size:13.5px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.15);}
.bal-act:active{opacity:.7;}
.bal-act svg{width:15px;height:15px;}

/* ── 정보 위젯 ── */
.ic-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:4px;margin-bottom:10px;}
.ic-lbl svg{width:13px;height:13px;}
.ic-item{font-size:13px;color:var(--ink2);line-height:1.9;}
.ic-more{font-size:11.5px;color:var(--muted);margin-top:4px;}

/* ── 섹션 타이틀 ── */
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;letter-spacing:.02em;}

/* ── 리스트 아이템 ── */
.row-item{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;}
.row-item:last-child{border-bottom:none;}
.row-item:active{background:var(--bg);}
.row-ic{width:40px;height:40px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary-tint);color:var(--primary);}
.row-ic svg{width:20px;height:20px;}
.row-body{flex:1;min-width:0;}
.row-title{font-size:15px;font-weight:600;}
.row-desc{font-size:13px;color:var(--muted);margin-top:2px;}
.row-right{color:var(--muted);display:flex;align-items:center;}
.row-right svg{width:18px;height:18px;}

/* ── 거래 내역 아이템 ── */
.ldg-item{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--line);}
.ldg-item:last-child{border-bottom:none;}
.ldg-ic{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
.ldg-ic.up{background:var(--primary-tint);color:var(--primary);}
.ldg-ic.dn{background:#F1F3F5;color:var(--ink2);}
.ldg-body{flex:1;min-width:0;}
.ldg-body b{font-size:14px;font-weight:600;display:block;}
.ldg-body span{font-size:12px;color:var(--muted);margin-top:2px;display:block;}
.ldg-val{font-size:14px;font-weight:800;white-space:nowrap;}
.ldg-val.p{color:var(--primary);}
.ldg-val.m{color:var(--ink2);}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:15px 16px;border-radius:16px;font-size:16px;font-weight:700;background:var(--grad);color:#fff;letter-spacing:-.01em;box-shadow:var(--sh-blue);transition:opacity .15s;}
.btn:active{opacity:.8;}
.btn.out{background:var(--primary-tint);color:var(--primary);box-shadow:none;}
.btn.gray{background:#F1F3F5;color:var(--ink2);box-shadow:none;}
.btn.danger{background:var(--danger-tint);color:var(--danger);box-shadow:none;}
.btn.green{background:#EDFAF5;color:#059669;box-shadow:none;}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;border-radius:12px;}

/* ── 필 ── */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;}
.pill.blue{background:var(--primary-tint);color:var(--primary);}
.pill.gray{background:#F1F3F5;color:var(--ink2);}
.pill.green{background:#EDFAF5;color:#059669;}
.pill.gold{background:#FFFAEB;color:#D97706;}

/* ── 탭 ── */
.tabs{display:flex;gap:4px;padding:10px 20px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 15px;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none;transition:background .2s,color .2s;}
.tab.active{background:var(--primary);color:#fff;}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:rgba(25,31,40,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:400;white-space:nowrap;backdrop-filter:blur(12px);display:inline-flex;align-items:center;gap:9px;max-width:calc(100% - 40px);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 로더 ── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:14px;}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px;line-height:1.8;}

/* ── 반응 버튼 ── */
.react-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);}
.react-btn.on-r{background:var(--danger-tint);border-color:var(--danger);color:var(--danger);}
.react-btn.on-b{background:var(--primary-tint);border-color:var(--primary);color:var(--primary);}
.react-btn.on-g{background:#F1F3F5;border-color:#555;color:#222;}
.reacts{display:flex;gap:7px;flex-wrap:wrap;}

/* ── 기타 ── */
.check-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:15px;font-weight:500;}
.check-item input{width:auto;}
.note{font-size:13px;color:var(--muted);line-height:1.7;}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--primary);flex:none;}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:16px;margin-top:8px;}

/* ── 커뮤니티 그리드 ── */
.comm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.comm-card{background:var(--card);border-radius:var(--r);padding:22px 16px 18px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;text-align:center;}
.comm-card:active{transform:scale(.97);}
.comm-ic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:12px;}
.comm-ic svg{width:28px;height:28px;}
.comm-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.comm-desc{font-size:12px;color:var(--muted);line-height:1.4;}

/* ── 학교 그리드 ── */
.school-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:4px;}
.school-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:4px 0;}
.school-item:active{opacity:.7;}
.school-ic{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;}
.school-ic svg{width:26px;height:26px;}
.school-title{font-size:12px;font-weight:700;color:var(--ink);text-align:center;}
.school-desc{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;}

/* ── 애니메이션 ── */
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideBack{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.fade-in{animation:slideUp .25s cubic-bezier(.22,1,.36,1) both;}
.slide-back{animation:slideBack .22s cubic-bezier(.22,1,.36,1) both;}
/* 상세(push) 화면: 오른쪽에서 밀려 들어옴 — 탭 전환(rise)과 구분 */
@keyframes pushIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.screen.pushin{animation:pushIn var(--dur-standard) var(--ease-out) both;}

/* ── Phase 2: Bottom Sheet ── */
.sheet-backdrop{position:fixed;inset:0;background:rgba(15,18,28,.44);opacity:0;transition:opacity var(--dur-standard) var(--ease-out);z-index:300;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
.sheet-backdrop.on{opacity:1;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--surface-elevated);border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);z-index:301;transform:translateY(101%);transition:transform var(--dur-standard) var(--ease-spring);max-height:88dvh;display:flex;flex-direction:column;padding-bottom:calc(14px + env(safe-area-inset-bottom));will-change:transform;}
.sheet.on{transform:translateY(0);}
.sheet-handle{width:38px;height:4px;border-radius:99px;background:var(--surface-3);margin:10px auto 2px;flex:none;}
.sheet-head{padding:8px 22px 2px;}
.sheet-title{font-size:19px;font-weight:800;color:var(--text-1);letter-spacing:-.02em;}
.sheet-body{padding:12px 22px 6px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet-actions{padding:12px 22px 2px;display:flex;gap:10px;}
.sheet-actions>*{flex:1;}

/* ── Phase 2: Modal (confirm) ── */
.modal{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.94);opacity:0;z-index:301;width:min(340px,86%);background:var(--surface-elevated);border-radius:22px;box-shadow:var(--shadow-lg);padding:22px 22px 16px;transition:transform var(--dur-standard) var(--ease-spring),opacity var(--dur-standard) var(--ease-out);}
.modal.on{transform:translate(-50%,-50%) scale(1);opacity:1;}
.modal-title{font-size:17px;font-weight:800;color:var(--text-1);text-align:center;}
.modal-body{font-size:14px;color:var(--text-2);line-height:1.6;text-align:center;margin-top:8px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions>*{flex:1;}

/* ── Phase 2: Skeleton ── */
.skeleton{position:relative;overflow:hidden;background:var(--surface-2);border-radius:10px;}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:skelShimmer 1.3s var(--ease-inout) infinite;}
@keyframes skelShimmer{100%{transform:translateX(100%)}}
.skel-line{height:12px;border-radius:7px;margin:9px 0;}
.skel-title{height:18px;width:56%;border-radius:8px;margin:4px 0 12px;}
.skel-circle{border-radius:50%;}
.skel-card{height:96px;border-radius:var(--radius-lg);margin:10px 0;}

/* ── Phase 2: Empty state (개선) ── */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 28px;gap:5px;animation:slideUp .3s var(--ease-out) both;}
.empty-ic{width:56px;height:56px;border-radius:18px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:8px;}
.empty-title{font-size:16px;font-weight:700;color:var(--text-1);}
.empty-desc{font-size:13.5px;color:var(--text-3);line-height:1.6;max-width:250px;}
.empty-action{margin-top:16px;width:100%;max-width:220px;}

/* ── Phase 2: Toast 타입 ── */
.toast-ic{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex:none;background:rgba(255,255,255,.18);color:#fff;}
.toast.t-success .toast-ic{background:#2FBF71;}
.toast.t-error .toast-ic{background:var(--danger);}
.toast.t-info .toast-ic{background:var(--accent);}
@media (prefers-reduced-motion:reduce){.skeleton::after{animation:none;}.sheet,.modal{transition-duration:.001ms;}}

/* ── 스플래시 화면 ── */
.splash-screen{
  min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--bg);position:relative;
  padding:env(safe-area-inset-top) 32px env(safe-area-inset-bottom);
}
.splash-inner{
  display:flex;flex-direction:column;align-items:center;
  animation:splashIn .55s cubic-bezier(.22,1,.36,1) both;
}
@keyframes splashIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.splash-logo-wrap{
  width:92px;height:92px;border-radius:28px;overflow:hidden;
  box-shadow:0 18px 44px rgba(26,92,230,.22),0 4px 14px rgba(26,92,230,.12);
  margin-bottom:22px;
}
.splash-logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.splash-app-name{font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:6px;}
.splash-school{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.01em;}
.splash-footer{
  position:absolute;bottom:calc(48px + env(safe-area-inset-bottom));
  left:0;right:0;display:flex;align-items:center;justify-content:center;gap:7px;
}
.splash-footer span{
  width:6px;height:6px;border-radius:50%;background:var(--line);
  animation:dotPulse 1.4s ease-in-out infinite;
}
.splash-footer span:nth-child(2){animation-delay:.2s;}
.splash-footer span:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{
  0%,70%,100%{background:var(--line);}
  35%{background:var(--primary);}
}

/* ===================================================================
   preview-okya3 디자인 시스템 (.p3 스코프 — 변환된 화면만 사용)
   =================================================================== */
.screen.p3{background:var(--card);padding-bottom:calc(92px + env(safe-area-inset-bottom));}
.p3 .icn{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
.p3 .icn.sm{width:18px;height:18px;}

/* topbar / greet (투명, 회색 배경 위) */

.p3 .greet{padding:2px 18px 14px;}
.p3 .greet small{color:var(--sub);font-size:13px;font-weight:500;}

.h2-sec-s{display:block;font-size:13.5px;font-weight:600;color:var(--text-3);margin-top:4px;}
/* School gallery */
.h2-gallery{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0 4px;}

.gal-1{background:linear-gradient(135deg,#FFE0C2,#FFC9D6);}
.gal-2{background:linear-gradient(135deg,#C2F0E0,#C9E0FF);}
.gal-3{background:linear-gradient(135deg,#FFF0C2,#FFD3B0);}
.gal-4{background:linear-gradient(135deg,#D9C9FF,#FFC9E8);}

.h2-slide-cap{position:relative;z-index:1;padding:20px 22px;color:#fff;}
.h2-slide-n{font-size:12px;font-weight:800;opacity:.92;letter-spacing:.04em;}

.h2-dots{display:flex;gap:7px;justify-content:center;margin-top:14px;}

/* 바로가기 타일: 각진 정사각형, 여백 없이 붙여서 가로 슬라이드(이미지 꽉 채움 슬롯) */
.h2-sec-flush{padding-left:0;padding-right:0;}
.h2-grid{display:flex;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.h2-grid::-webkit-scrollbar{display:none;}
.h2-sc{flex:0 0 auto;width:min(76vw,300px);aspect-ratio:1;position:relative;overflow:hidden;background-size:cover;background-position:center;display:block;scroll-snap-align:start;}
.h2-sc::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 58%);}
.h2-sc-emoji{position:absolute;top:18px;right:20px;font-size:50px;z-index:1;filter:drop-shadow(0 3px 12px rgba(0,0,0,.28));}
.h2-sc-l{position:absolute;left:20px;bottom:18px;z-index:1;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.02em;text-shadow:0 1px 6px rgba(0,0,0,.34);}
.h2-sc:active{filter:brightness(.93);}
.sc-0{background:linear-gradient(145deg,#6C5CE7,#A29BFE);}
.sc-1{background:linear-gradient(145deg,#E84393,#FD79A8);}
.sc-2{background:linear-gradient(145deg,#E17055,#FDA085);}
.sc-3{background:linear-gradient(145deg,#00B894,#55EFC4);}
.sc-4{background:linear-gradient(145deg,#0984E3,#74B9FF);}
.sc-5{background:linear-gradient(145deg,#6D5DFC,#9B8CFF);}
.sc-6{background:linear-gradient(145deg,#00CEC9,#81ECEC);}

/* Feature rail(구) */
.h2-rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;}
.h2-rail::-webkit-scrollbar{display:none;}
.h2-feat{flex:0 0 auto;width:106px;height:114px;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;transition:transform var(--dur-micro) var(--ease-spring);}
.h2-feat:active{transform:scale(.95);}
.h2-feat-ic{font-size:31px;line-height:1;}

/* Today */
.h2-today{display:flex;flex-direction:column;gap:14px;}
.h2-att.pcard{margin:0!important;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}

.h2-updates{cursor:pointer;}
.h2-up-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;}
.h2-up-row+.h2-up-row{border-top:1px solid var(--divider);}
.h2-up-t{font-size:14.5px;font-weight:700;color:var(--text-1);}

/* entrance (절제된 fade+rise, section stagger) */
.home2 .h2-hero,.home2 .h2-sec{animation:p3rise2 .7s var(--ease-out) both;}
.home2 .h2-sec:nth-of-type(2){animation-delay:.06s;}
.home2 .h2-sec:nth-of-type(3){animation-delay:.12s;}
.home2 .h2-sec:nth-of-type(4){animation-delay:.18s;}

/* ===================== OKSS Motion System ===================== */
/* Ambient: hero visual이 아주 느리게 숨쉬듯 살아있음 (Level 6, transform-only) */
@keyframes okFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.035)}}
@keyframes okGlow{0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(1)}50%{opacity:.58;transform:translate(-50%,-50%) scale(1.18)}}
.h2-hero-visual{position:relative;overflow:hidden;}
.h2-hero-visual::after{content:"";position:absolute;left:50%;top:50%;width:70%;height:70%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,0) 66%);transform:translate(-50%,-50%);animation:okGlow 11s var(--ease-inout) infinite;pointer-events:none;z-index:0;}
.h2-visual-emoji{position:relative;z-index:1;animation:okFloat 7s var(--ease-inout) infinite;will-change:transform;}

/* 바로가기 auto-carousel: 포커스 타일 강조 / 나머지 은은하게 (Level 6 소개형) */
.h2-grid{scroll-behavior:smooth;}
.h2-grid.ok-focusmode{padding-top:5px;padding-bottom:5px;}
.h2-grid.ok-focusmode .h2-sc{opacity:.68;transform:scale(.95);transition:opacity var(--dur-standard) var(--ease-out),transform var(--dur-standard) var(--ease-out);transform-origin:center;}
.h2-grid.ok-focusmode .h2-sc.is-focus{opacity:1;transform:scale(1.055);}

/* Scroll reveal: 스크롤로 등장하는 콘텐츠 (Level 4, IntersectionObserver 구동) */
.ok-reveal{opacity:0;transform:translateY(13px);transition:opacity .55s var(--ease-out),transform .55s var(--ease-out);will-change:opacity,transform;}
.ok-reveal.in{opacity:1;transform:none;}
.ok-reveal-img{opacity:0;transform:scale(1.02);transition:opacity .6s var(--ease-out),transform .6s var(--ease-out);}
.ok-reveal-img.in{opacity:1;transform:none;}

/* Local content transition: 콘텐츠 영역만 부드럽게 교체 (Level 2) */
.ok-swap{animation:okSwapIn var(--dur-standard) var(--ease-out) both;}
@keyframes okSwapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Reduced motion: autoplay/parallax/ambient 최소화, fade 중심 (Phase 22) */
@media (prefers-reduced-motion:reduce){
  .h2-visual-emoji,.h2-hero-visual::after{animation:none!important;}
  .ok-reveal,.ok-reveal-img{transition:none!important;opacity:1!important;transform:none!important;}
  .h2-grid.ok-focusmode .h2-sc{opacity:1!important;transform:none!important;transition:none!important;}
  .h2-grid.ok-focusmode{padding-top:0;padding-bottom:0;}
  .home2 .h2-hero,.home2 .h2-sec,.money2 .m2-hero,.money2 .m2-sec{animation:none!important;}
}
/* landscape tablet: hero split · today 가로 */

  .h2-hero{flex-direction:row;align-items:stretch;gap:34px;padding:16px 30px 8px;}

.p3 .dot.on{background:var(--grad);color:#fff;}
.p3 .dot svg{width:12px;height:12px;stroke-width:2.6;}
.p3 .att .get{background:var(--grad);color:#fff;border:none;border-radius:11px;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.p3 .att .get:disabled{background:var(--soft);color:var(--sub);cursor:default;}

/* pills + meal */
.p3 .chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.p3 .pills{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;}
.p3 .ppill{padding:6px 14px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;border:none;background:transparent;font-family:inherit;}
.p3 .ppill.on{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.06);}
.p3 .chd>button{width:30px;height:30px;border-radius:9px;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;}
.p3 .chd>button svg{width:20px;height:20px;}
.p3 .meal{list-style:none;}
.p3 .meal li{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px;font-weight:500;color:var(--ink);}
.p3 .meal li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary);flex-shrink:0;}

/* section title */
.p3 .sec{font-size:15px;font-weight:800;letter-spacing:-.3px;margin:0 0 10px;color:var(--ink);}

/* schedule row */
.p3 .srow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;}
.p3 .srow+.srow{border-top:1px solid var(--line);}
.p3 .srow .l .t{font-size:14px;font-weight:700;color:var(--ink);}
.p3 .srow .l .d{font-size:12px;color:var(--sub);margin-top:2px;}
.p3 .dday{color:var(--accent);font-size:15px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;padding:2px 4px;}

/* ── Phase 3: 오늘의 옥야 (contextual dashboard) ── */
.today-okya{margin:2px 18px 16px;background:var(--surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);padding:15px 17px 13px;animation:cardRise .5s var(--ease-out) both;}
.today-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;}
.today-eyebrow{font-size:13.5px;font-weight:800;color:var(--text-1);letter-spacing:-.01em;}
.today-date{font-size:12px;font-weight:600;color:var(--text-3);}
.today-hl{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:16px;background:var(--surface-2);transition:transform var(--dur-micro) var(--ease-spring);}
.today-okya[data-act]{cursor:pointer;}
.today-okya[data-act]:active .today-hl{transform:scale(.985);}
.today-hl-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--surface);box-shadow:var(--shadow-sm);flex:none;}
.today-hl-tx{flex:1;min-width:0;}
.today-hl-t{font-size:15.5px;font-weight:800;color:var(--text-1);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.today-hl-s{font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:1px;}
.today-hl-go{color:var(--text-3);display:flex;flex:none;}.today-hl-go svg{width:18px;height:18px;}
.today-hl.tone-att{background:linear-gradient(135deg,rgba(47,191,113,.13),rgba(47,191,113,.05));}
.today-hl.tone-att .today-hl-ic{color:#2FBF71;}
.today-hl.tone-exam{background:var(--accent-soft);}
.today-hl.tone-exam .today-hl-ic,.today-hl.tone-notif .today-hl-ic{color:var(--accent);}
.today-strip{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:11px;border-top:1px solid var(--divider);}
.ts-item{display:flex;flex-direction:column;gap:2px;min-width:0;}
.ts-k{font-size:11px;font-weight:700;color:var(--text-3);}
.ts-v{font-size:13px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ts-dd{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;margin-left:2px;}
.ts-div{width:1px;height:26px;background:var(--divider);flex:none;}

/* ── Phase 4: 거래 상세 시트 ── */
.lrow-tap{cursor:pointer;border-radius:12px;transition:background var(--dur-micro) ease;margin:0 -8px;padding-left:8px;padding-right:8px;}
.lrow-tap:active{background:var(--surface-2);}
.txd-amt{text-align:center;font-size:36px;padding:8px 0 18px;}
.txd-amt.pos{color:#2FBF71;}
.txd-amt.neg{color:var(--text-1);}
.txd-rows{border-top:1px solid var(--divider);}
.txd-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--divider);}
.txd-k{font-size:13px;color:var(--text-3);font-weight:600;flex:none;}
.txd-v{font-size:14px;color:var(--text-1);font-weight:600;text-align:right;word-break:break-all;}

/* ── Phase 5: 급식 평점 ── */
.mrate{margin:16px var(--page-x) 2px;background:none;box-shadow:none;border-radius:0;padding:16px 0 4px;border-top:1px solid var(--divider);animation:slideUp .3s var(--ease-out) both;}
.mrate-q{font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:13px;}
.mrate-rows{display:flex;flex-direction:column;gap:11px;}
.mrate-row{display:flex;align-items:center;gap:10px;}
.mrate-slot{width:32px;font-size:13px;font-weight:800;color:var(--text-2);flex-shrink:0;}
.mrate-q .mrate-hint{font-size:11px;font-weight:600;color:var(--text-3);margin-left:6px;}
.mrate-stars{display:inline-flex;gap:3px;flex:1;align-items:center;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;}
.star-slot{position:relative;width:26px;height:28px;flex-shrink:0;pointer-events:none;}
.star-bg,.star-clip,.star-fg{position:absolute;top:0;left:0;height:100%;font-size:25px;line-height:28px;pointer-events:none;}
.star-bg{width:26px;text-align:center;color:#C9CDD6;}
.star-clip{overflow:hidden;transition:width var(--dur-micro) var(--ease-out);}
.mrate-stars.dragging .star-clip{transition:none;}
.star-fg{width:26px;text-align:center;color:#F0A81E;}
.mrate-avg{font-size:12px;font-weight:800;color:#E0930F;flex-shrink:0;min-width:56px;text-align:right;letter-spacing:-.01em;}
.mrate-avg.none{color:var(--text-3);font-weight:600;}

/* ── 급식 피드(재설계): 오늘 급식 우선 ── */
.mfeed{padding-top:var(--sp-1);}
.mday{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--page-x) var(--sp-3);}
.mday-arrow{width:40px;height:40px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--text-2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;}
.mday-arrow:active{background:var(--surface-3);}
.mday-center{flex:1;text-align:center;min-width:0;}
.mday-big{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--text-1);line-height:1.15;}
.mday-dow{font-size:14px;font-weight:600;color:var(--text-3);margin-left:5px;}
.mday-rel{margin-top:5px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;}
.mrel-badge{font-size:12px;font-weight:800;color:var(--text-3);}
.mrel-badge.today{color:#fff;background:var(--accent);padding:2px 11px;border-radius:var(--radius-full);}
.mday-home{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 11px;border-radius:var(--radius-full);}

.mseg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:14px;margin:0 var(--page-x);}
.mseg-b{flex:1;padding:9px 0;border-radius:11px;font-size:14px;font-weight:700;color:var(--text-2);background:transparent;transition:background var(--dur-standard) var(--ease-out),color var(--dur-standard) var(--ease-out),box-shadow var(--dur-standard) var(--ease-out);}
.mseg-b.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm);}
.mseg-b.dim{color:var(--text-3);opacity:.5;}

@keyframes mheroIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.mhero{margin:var(--sp-4) var(--page-x) 0;animation:mheroIn .3s var(--ease-out) both;}
.mmenu-wrap{background:none;box-shadow:none;border-radius:0;padding:4px 2px 8px;}
.mmenu-head{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.mmenu-slot{font-size:16px;font-weight:800;color:var(--accent);letter-spacing:-.01em;}
.mmenu-time{font-size:12px;font-weight:600;color:var(--text-3);}
.mmenu{list-style:none;display:flex;flex-direction:column;gap:11px;}
.mmenu li{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--text-1);line-height:1.18;animation:mheroIn .36s var(--ease-out) both;}
@media (min-width:820px) and (min-aspect-ratio:1/1){.mmenu li{font-size:31px;} .mmenu-slot{font-size:18px;}}
.mmenu-wrap.mempty{text-align:center;padding:36px 20px;}
.mempty-emoji{font-size:38px;line-height:1;}
.mempty-t{font-size:17px;font-weight:800;color:var(--text-1);margin-top:12px;}
.mempty-s{font-size:13px;color:var(--text-3);margin-top:5px;}
.mjump{margin-top:18px;display:inline-block;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:var(--radius-full);box-shadow:var(--shadow-sm);}

.mother{margin:var(--sp-4) var(--page-x) 0;background:none;box-shadow:none;border-radius:0;overflow:hidden;border-top:1px solid var(--divider);}
.mother-row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 2px;text-align:left;background:transparent;}
.mother-row+.mother-row{border-top:1px solid var(--divider);}
.mother-row:active{background:var(--surface-2);}
.mother-slot{font-size:13px;font-weight:800;color:var(--text-2);flex:none;width:30px;}
.mother-menu{flex:1;font-size:13.5px;font-weight:500;color:var(--text-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;}
.mother-chev{color:var(--text-3);font-size:18px;flex:none;}

.mcal-open{display:flex;align-items:center;justify-content:center;gap:8px;margin:var(--sp-5) var(--page-x) var(--sp-1);width:calc(100% - var(--page-x)*2);padding:13px 0;border-radius:var(--radius-md);background:var(--surface-2);color:var(--text-2);font-size:14px;font-weight:700;}
.mcal-open svg{width:17px;height:17px;stroke:var(--text-2);}
.mcal-open:active{background:var(--surface-3);}

/* list row */
.p3 .lrow{display:flex;align-items:center;gap:12px;padding:11px 0;}
.p3 .lrow+.lrow{border-top:1px solid var(--line);}
.p3 .chip{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.p3 .chip svg{width:18px;height:18px;}
.p3 .lrow .body{flex:1;min-width:0;}
.p3 .lrow .ti{font-size:14px;font-weight:700;letter-spacing:-.2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.p3 .lrow .su{font-size:12px;color:var(--sub);margin-top:2px;}
.p3 .ti-blue{background:var(--primary-tint);color:var(--primary);}
.p3 .ti-green{background:#E7F8EF;color:#16A34A;}
.p3 .ti-gray{background:#F1F3F8;color:#8A90A0;}
.p3 .ti-org{background:#FFF3E4;color:#F59E0B;}
.p3 .ti-pink{background:#FDECF5;color:#EC4899;}
.p3 .lrow .tramt{flex:none;text-align:right;}
.p3 .lrow .trbal{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;}
.p3 .lrow .tr{font-size:14.5px;font-weight:800;white-space:nowrap;text-align:right;}
.p3 .lrow .tr.pos{color:#16A34A;}
.p3 .lrow .tr.neg{color:var(--ink);}
.p3 .lrow.on{background:#F5F3FF;border-radius:14px;}
.p3 .lrow.on+.lrow{border-top-color:transparent;}

/* pushed-screen header (뒤로가기) */
.screen.no-nav.p3{padding-bottom:0;}
/* 송금 플로우: 모바일=풀스크린(내비 숨김), 데스크톱=좌측 레일 붙은 일반 화면으로 통일 */
.screen.mflow{padding-bottom:0;}
.screen.mflow+.bnav{display:none;}
.p3 .phdr{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;}
.p3 .phdr .bk{width:34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:#3a3f4b;}
.p3 .phdr .bk svg{width:20px;height:20px;}
.p3 .phdr .ttl{flex:1;font-size:17px;font-weight:800;color:var(--ink);}

/* buttons (preview) */
.p3 .pbtn{border:none;border-radius:15px;padding:14px 0;font-size:14.5px;font-weight:800;width:100%;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.2;}
.p3 .pbtn.pri{background:var(--grad);color:#fff;box-shadow:var(--sh-blue);}
.p3 .pbtn.out{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.p3 .pbtn:disabled{cursor:default;}

/* 내역 필터 태그 */
.p3 .tag{display:inline-block;font-size:12px;font-weight:700;padding:7px 14px;border-radius:100px;cursor:pointer;white-space:nowrap;flex:none;}
.p3 .tag.b{background:var(--primary-tint);color:var(--primary);}
.p3 .tag.off{background:#F1F3F8;color:#8A90A0;}
.p3 .datehd{padding:14px 18px 4px;font-size:12px;font-weight:800;color:var(--sub);}

/* 송금 키패드 (preview 4) */
.p3 .kpwrap{padding:0 22px;display:flex;flex-direction:column;flex:1;min-height:0;}
.p3 .kpto{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:10px 14px;margin-top:2px;}
.p3 .kpto .av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;}
.p3 .kpto .n{font-size:14px;font-weight:700;color:var(--ink);}
.p3 .kpto .b{font-size:11.5px;color:var(--sub);margin-top:1px;}
.p3 .kp-amt{text-align:center;margin:auto 0;font-size:52px;font-weight:900;letter-spacing:-2.5px;color:var(--ink);font-variant-numeric:tabular-nums;}
.p3 .kp-amt small{font-size:24px;font-weight:800;color:var(--sub);margin-left:6px;letter-spacing:0;}
.p3 .kp-amt .cur{color:#cfd4e0;}
.p3 .kpquick{display:flex;gap:7px;justify-content:center;margin-bottom:10px;}
.p3 .kpquick span{background:var(--soft);border:1px solid var(--line);color:#4b5563;border-radius:100px;padding:7px 14px;font-size:11.5px;font-weight:700;cursor:pointer;}
.p3 .kpmsgic{width:16px;height:16px;color:var(--sub);display:flex;flex:none;}
.p3 .kpmsgic svg{width:16px;height:16px;}
.p3 .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:6px;}
.p3 .key{text-align:center;font-size:24px;font-weight:600;padding:13px 0;color:var(--ink);border-radius:14px;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;}
.p3 .key:active{background:var(--soft);}
.p3 .key svg{width:22px;height:22px;stroke-width:2;color:var(--sub);}
.p3 .kpnext{background:var(--grad);color:#fff;border:none;border-radius:16px;padding:15px 0;font-size:15px;font-weight:800;margin-bottom:16px;cursor:pointer;box-shadow:var(--sh-blue);display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
.p3 .kpnext:disabled{opacity:.4;box-shadow:none;cursor:default;}

/* 송금 완료 (preview 5) */
.p3 .succ{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:0 26px;text-align:center;min-height:100dvh;}
.p3 .succ .ring{width:88px;height:88px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:var(--sh-blue);}
.p3 .succ .ring svg{width:42px;height:42px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.p3 .succ h2{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.45;color:var(--ink);}
.p3 .succ p{color:var(--sub);font-size:13px;margin-top:10px;}
.p3 .succ .btns{display:flex;gap:10px;width:100%;max-width:340px;margin-top:30px;}
.p3 .ti-sky{background:#E7F1FF;color:#3B82F6;}

/* 학교 · 일자 네비 */
.p3 .daynav{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 2px;}
.p3 .daynav .dn{width:34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink2);}
.p3 .daynav .dn svg{width:18px;height:18px;}
.p3 .daynav .dl{font-size:15px;font-weight:800;color:var(--ink);}
.p3 .daynav .dl small{font-size:12px;color:var(--sub);font-weight:600;margin-left:5px;}

/* 회의록 썸네일 */
.p3 .vthumb{width:62px;height:46px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;}
.p3 .vthumb svg{width:20px;height:20px;color:#fff;}

/* 시간표 */
.p3 .tt{width:100%;border-collapse:separate;border-spacing:3px;}
.p3 .tt th{padding:8px 0;background:var(--soft);color:var(--sub);font-weight:700;font-size:12px;border-radius:8px;}
.p3 .tt th.on{background:var(--grad);color:#fff;}
.p3 .tt td{padding:10px 2px;text-align:center;font-size:12.5px;color:var(--ink);background:var(--soft);border-radius:8px;font-weight:600;}
.p3 .tt td.on{background:var(--primary-tint);color:var(--primary);font-weight:800;}
.p3 .tt td.pn,.p3 .tt th.pn{background:transparent;color:var(--sub);font-weight:700;font-size:11px;}

/* 예약 슬롯 */
.p3 .slot{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;}
.p3 .slot.on{border-color:transparent;background:var(--grad);color:#fff;}
.p3 .slot .sbody{flex:1;min-width:0;}
.p3 .slot .sn{font-size:14px;font-weight:800;}
.p3 .slot .sr{font-size:11.5px;color:var(--sub);margin-top:2px;}
.p3 .slot.on .sr{color:rgba(255,255,255,.9);}
.p3 .slot .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;}
.p3 .slot.on .chk{border-color:#fff;background:rgba(255,255,255,.2);}
.p3 .slot .chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3;display:none;}
.p3 .slot.on .chk svg{display:block;}

/* 소통 그리드 */
.p3 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.p3 .gcard{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;cursor:pointer;}
.p3 .gcard .gic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.p3 .gcard .gic svg{width:22px;height:22px;}
.p3 .gcard .gt{font-size:14px;font-weight:800;color:var(--ink);}
.p3 .gcard .gs{font-size:11.5px;color:var(--sub);margin-top:3px;}
/* 챌린지/청원 보조 */
.p3 .reward{background:var(--grad);color:#fff;border-radius:11px;padding:7px 11px;font-size:14px;font-weight:800;text-align:center;flex:none;line-height:1.1;}
.p3 .reward small{display:block;font-size:9px;opacity:.85;font-weight:700;}
.p3 .minibtn{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;}
.p3 .minibtn.soft{background:var(--primary-tint);color:var(--primary);}
.p3 .minibtn.out{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.p3 .minibtn.danger{background:var(--danger-tint);color:var(--danger);}
/* 사진 업로드 박스 */
.p3 .upload{display:block;border:1.6px dashed #cfd4e0;border-radius:14px;padding:20px;text-align:center;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;}
.p3 .upload svg{width:26px;height:26px;margin:0 auto 6px;color:#b6bcc8;display:block;}
.p3 .upload span{display:block;}
/* 사진 소스 선택: 팝업 없이 인라인 2버튼(앨범/촬영) */
.p3 .upload-pick{display:flex;gap:10px;margin-top:2px;}
.p3 .upload-pick .up-opt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 0;border:1.6px dashed #cfd4e0;border-radius:14px;background:var(--soft);color:var(--sub);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .12s var(--ease),border-color .15s,background .15s,color .15s;}
.p3 .upload-pick .up-opt:active{transform:scale(.96);}
.p3 .upload-pick .up-opt svg{width:24px;height:24px;color:#b6bcc8;}
.p3 .upload-preview:not(:empty){margin-top:12px;text-align:center;}
.p3 .upload-preview img{max-width:150px;max-height:206px;aspect-ratio:3/4.1;object-fit:cover;margin:0 auto;border-radius:6px;box-shadow:0 5px 14px rgba(0,0,0,.16);display:block;}
.p3 .upload.has{padding:0;border-style:solid;border-color:var(--line);overflow:hidden;}
.p3 .upload.has img{width:100%;display:block;max-height:220px;object-fit:cover;}
/* 책 썸네일 */
.p3 .bthumb{width:46px;height:60px;border-radius:8px;flex-shrink:0;object-fit:cover;background:var(--grad);}
/* 게시판 */
.p3 .post{padding:14px 2px;}
.p3 .post+.post{border-top:1px solid var(--line);}
.p3 .post .pmeta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);margin-bottom:5px;}
.p3 .post .pnick{font-weight:800;color:var(--primary);}
.p3 .post .pbody{font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
.p3 .post .pfoot{display:flex;gap:8px;margin-top:9px;}
.p3 .upbtn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-family:inherit;}
.p3 .upbtn.on{background:var(--primary-tint);border-color:var(--primary);color:var(--primary);}

/* MY */
.p3 .prof{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px;}
.p3 .prof .av{width:80px;height:80px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:800;box-shadow:var(--sh-blue);overflow:hidden;position:relative;}
.p3 .prof .av img{width:100%;height:100%;object-fit:cover;}
.p3 .prof .camera{position:absolute;bottom:0;right:0;width:26px;height:26px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;}
.p3 .prof .camera svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;}
.p3 .prof .nm{font-size:19px;font-weight:800;margin-top:12px;color:var(--ink);}
.p3 .prof .cl{font-size:13px;color:var(--sub);margin-top:3px;}
.p3 .stats{display:flex;gap:9px;margin:14px 18px 0;}
.p3 .stat{flex:1;background:var(--card);border-radius:15px;box-shadow:var(--sh);padding:14px 8px;text-align:center;}
.p3 .stat .v{font-size:16px;font-weight:800;color:var(--primary);}
.p3 .stat .k{font-size:11px;color:var(--sub);margin-top:3px;}
/* 나의 옥야 대시보드 */
.my-dash{padding:16px 18px;}
.my-dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.my-lv-badge{font-size:15px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-d));padding:5px 14px;border-radius:999px;letter-spacing:-.01em;box-shadow:0 3px 10px rgba(123,108,255,.28);}
.my-streak{font-size:13px;font-weight:700;color:var(--text-2);}
.my-streak b{color:#F0863C;font-size:16px;}
.my-lv-bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.my-lv-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-d));transition:width .7s var(--ease-out);}

/* ===================== 옥야 2.0 MY (프로필 컴팩트, 큰 통계, 플랫 메뉴) ===================== */
.my2{background:var(--bg);}
.my2-prof{display:flex;align-items:center;gap:14px;padding:8px 20px 6px;}
.my2-prof .av{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;box-shadow:var(--sh-blue);overflow:hidden;position:relative;flex:none;}
.my2-prof .av img{width:100%;height:100%;object-fit:cover;}
.my2-prof .camera{position:absolute;bottom:0;right:0;width:24px;height:24px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--bg);}
.my2-prof .camera svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;}
.my2-id{flex:1;min-width:0;}
.my2-name{font-size:22px;font-weight:900;letter-spacing:-.02em;color:var(--text-1);}
.my2-cl{font-size:13px;color:var(--text-3);margin-top:2px;}
.my2-lv{flex:none;font-size:14px;font-weight:900;color:var(--accent);background:var(--accent-soft);padding:6px 13px;border-radius:var(--radius-full);}
.my2-block{padding:16px 20px 2px;}
.my2-sec-t{font-size:15px;font-weight:800;color:var(--text-1);margin-bottom:10px;}
.my2-lvsub{font-size:12.5px;color:var(--text-3);margin-top:9px;}
.my2-lvsub b{color:var(--accent);font-weight:800;}
.my2-stats{display:flex;gap:9px;padding:16px 20px 2px;overflow-x:auto;scrollbar-width:none;}
.my2-stats::-webkit-scrollbar{display:none;}
.my2-stat{flex:1;min-width:74px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:15px 8px;text-align:center;}
.my2-stat .v{font-size:20px;font-weight:900;color:var(--text-1);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.my2-stat .k{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:4px;white-space:nowrap;}
.my2-row{display:flex;align-items:center;gap:13px;width:100%;padding:15px 2px;background:transparent;text-align:left;transition:opacity var(--dur-micro);}
.my2-row+.my2-row{border-top:1px solid var(--divider);}
.my2-row:active{opacity:.55;}
.my2-row .mic{width:22px;height:22px;color:var(--text-2);display:flex;flex:none;}
.my2-row .mic svg{width:22px;height:22px;}
.my2-row-l{flex:1;font-size:15px;font-weight:600;color:var(--text-1);}
.my2-row .cev{color:var(--text-3);display:flex;flex:none;}
.my2-row .cev svg{width:18px;height:18px;}
.my2-theme-t{font-size:14px;font-weight:800;color:var(--text-1);margin-bottom:2px;}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .my2-stat{padding:18px 10px;}
  .my2-stat .v{font-size:24px;}
}
.my-lv-sub{font-size:11.5px;color:var(--text-3);margin-top:7px;font-weight:600;}
.my-act{display:flex;gap:10px;margin-top:15px;}
.my-act-c{flex:1;background:var(--surface-2);border-radius:var(--radius-md);padding:12px 8px;text-align:center;}
.my-act-c .v{font-size:19px;font-weight:900;color:var(--text-1);}
.my-act-c .k{font-size:11.5px;color:var(--text-3);margin-top:2px;font-weight:600;}
/* 글로벌 검색 */
.gs-screen{background:var(--bg);min-height:100dvh;}
.gs-bar{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;position:sticky;top:0;background:var(--bg);z-index:5;}
.gs-inputwrap{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:11px 14px;transition:border-color var(--dur-micro) ease,box-shadow var(--dur-micro) ease;}
.gs-inputwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,108,255,.14);}
.gs-inputwrap svg{width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;flex:none;}
.gs-inputwrap input{flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--text-1);padding:0;}
.gs-clear{width:20px;height:20px;border-radius:50%;background:var(--text-3);color:#fff;font-size:11px;flex:none;display:flex;align-items:center;justify-content:center;}
.gs-body{padding:6px 16px 40px;}
.gs-recent-head{display:flex;align-items:center;justify-content:space-between;margin:12px 4px;}
.gs-recent-head span{font-size:13px;font-weight:800;color:var(--text-1);}
.gs-recent-head button{font-size:12px;color:var(--text-3);background:none;font-weight:600;}
.gs-chips{display:flex;flex-wrap:wrap;gap:8px;}
.gs-chip{padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;color:var(--text-2);transition:transform var(--dur-micro) var(--ease-spring);}
.gs-chip:active{transform:scale(.95);}
.gs-group{margin-top:18px;animation:fadeUp .3s var(--ease) both;}
.gs-gt{font-size:12px;font-weight:800;color:var(--text-3);margin:0 4px 6px;letter-spacing:.02em;}
.gs-gt span{color:var(--accent);}
.gs-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--divider);cursor:pointer;transition:background var(--dur-micro) ease;}
.gs-row:active{background:var(--surface-2);}
.gs-row:last-child{border-bottom:none;}
.gs-ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.gs-info{flex:1;min-width:0;}
.gs-rt{font-size:14.5px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gs-rs{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gs-chev{flex:none;color:var(--text-3);display:flex;opacity:.5;}
.gs-chev svg{width:16px;height:16px;}
/* ── 환경 레이어(날씨·계절): 아주 은은하게, 콘텐츠 위 pointer-events 없음 ── */
#env-layer{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden;}
#env-layer .env-glow{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease,background 1.6s ease;}
.wx-clear.is-day .env-glow{opacity:1;background:radial-gradient(120% 85% at 88% -12%,rgba(255,213,138,.15),transparent 55%);}
.wx-clear.is-night .env-glow{opacity:1;background:radial-gradient(120% 85% at 84% -12%,rgba(122,150,255,.11),transparent 55%);}
.wx-cloud .env-glow,.wx-fog .env-glow{opacity:1;background:radial-gradient(135% 100% at 50% -22%,rgba(150,160,175,.11),transparent 60%);}
.wx-rain .env-glow,.wx-storm .env-glow{opacity:1;background:radial-gradient(135% 100% at 50% -22%,rgba(88,108,140,.15),transparent 60%);}
.wx-snow .env-glow{opacity:1;background:radial-gradient(135% 100% at 50% -22%,rgba(200,215,235,.13),transparent 60%);}
.festival .env-glow{opacity:1;background:radial-gradient(120% 85% at 50% -10%,rgba(255,150,200,.13),transparent 55%);}
.season-autumn .env-glow{filter:saturate(1.05) hue-rotate(-4deg);}
.season-winter.wx-clear.is-day .env-glow{background:radial-gradient(120% 85% at 88% -12%,rgba(190,215,255,.13),transparent 55%);}
#env-layer .wx-rain{position:absolute;top:-12%;width:1.4px;height:42px;background:linear-gradient(transparent,rgba(150,175,210,.5));border-radius:2px;opacity:.34;animation:wxRain linear infinite;}
@keyframes wxRain{to{transform:translateY(122vh)}}
#env-layer .wx-snow{position:absolute;top:-6%;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 3px rgba(255,255,255,.55);opacity:.6;animation:wxSnow linear infinite;}
@keyframes wxSnow{to{transform:translateY(114vh) translateX(16px)}}
#env-layer .wx-confetti{position:absolute;top:-6%;width:7px;height:9px;border-radius:2px;opacity:.5;animation:wxConfetti linear infinite;}
@keyframes wxConfetti{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(112vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#env-layer .wx-rain,#env-layer .wx-snow,#env-layer .wx-confetti{display:none;}}
.p3 .palgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px 6px;}
.p3 .palitem{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.p3 .palitem .c{width:38px;height:38px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.12);}
.p3 .palitem .l{font-size:10px;font-weight:600;color:var(--sub);}
.p3 .palitem.on .l{color:var(--ink);font-weight:800;}
.p3 .palitem.on .c{outline:2.5px solid var(--ink);outline-offset:2px;}
.p3 .palitem .c.pick{background:conic-gradient(from 0deg,#f87171,#fbbf24,#34d399,#38bdf8,#a78bfa,#f472b6,#f87171);display:flex;align-items:center;justify-content:center;}
.p3 .palitem .c.pick svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
.p3 .menu{margin:12px 18px 0;background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden;}
.p3 .mrow{display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
.p3 .mrow+.mrow{border-top:1px solid var(--line);}
.p3 .mrow .mic{width:20px;height:20px;color:var(--sub);display:flex;flex:none;}
.p3 .mrow .mic svg{width:20px;height:20px;}
.p3 .mrow .cev{margin-left:auto;color:#c9cdd8;display:flex;}
.p3 .mrow .cev svg{width:18px;height:18px;}
.p3 .ver{text-align:center;color:#b6bcc8;font-size:12px;padding:20px 0 24px;}

/* ===== 애니메이션 (부드러운) ===== */
/* 화면 진입: p3 화면은 컨테이너 통짜 애니 끄고, 자식들이 순차 rise */
.fade-in.p3{animation:none;}
@keyframes p3rise{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:none;}}
.screen.p3>*{animation:p3rise .5s var(--ease) both;}
.screen.p3>*:nth-child(1){animation-delay:.02s;}
.screen.p3>*:nth-child(2){animation-delay:.07s;}
.screen.p3>*:nth-child(3){animation-delay:.12s;}
.screen.p3>*:nth-child(4){animation-delay:.17s;}
.screen.p3>*:nth-child(5){animation-delay:.22s;}
.screen.p3>*:nth-child(6){animation-delay:.27s;}
.screen.p3>*:nth-child(7){animation-delay:.31s;}
.screen.p3>*:nth-child(n+8){animation-delay:.35s;}
/* 눌림 피드백 */
.p3 .pbtn,.p3 .minibtn,.p3 .bbtn,.p3 .gcard,.p3 .lrow,.p3 .slot,.p3 .ppill,.p3 .bk,.p3 .upbtn,.p3 .key,.p3 .kpnext,.p3 .kpquick span,.p3 .palitem,.bnav-item,.p3 .stat,.p3 .mrow,.p3 .tag,.react-btn{transition:transform .13s var(--ease),background .15s,color .15s,border-color .15s,box-shadow .15s;}
.p3 .pbtn:active,.p3 .kpnext:active,.p3 .bbtn:active,.p3 .gcard:active,.p3 .slot:active,.p3 .bk:active,.p3 .minibtn:active,.p3 .kpquick span:active,.bnav-item:active{transform:scale(.94);}
.p3 .lrow:active,.p3 .mrow:active,.p3 .stat:active,.react-btn:active{transform:scale(.98);}
.p3 .key:active{transform:scale(.86);}
.bnav-item svg{transition:transform .2s var(--ease);}
.bnav-item.active svg{transform:translateY(-1px);}
/* 잔액 카드 무늬(원형) + 진입 */
.p3 .balance{position:relative;overflow:hidden;}
.p3 .balance::before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.10);top:-78px;right:-48px;pointer-events:none;}
.p3 .balance::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);bottom:-48px;right:56px;pointer-events:none;}
.p3 .balance>*{position:relative;}
/* 키패드 금액 펄스 */
.p3 .kp-amt.pulse{animation:kppulse .16s ease;}
@keyframes kppulse{50%{transform:scale(1.05);}}
/* 성공 링 드로우 */
.p3 .ring2{width:92px;height:92px;margin-bottom:22px;}
.p3 .ring2 .bgc{stroke:var(--line);}
.p3 .ring2 .arc{stroke:var(--primary);stroke-dasharray:264;stroke-dashoffset:264;animation:drawArc .9s var(--ease) .12s forwards;}
.p3 .ring2 .chk{stroke:var(--primary);stroke-dasharray:44;stroke-dashoffset:44;animation:drawArc .5s ease .72s forwards;}
@keyframes drawArc{to{stroke-dashoffset:0;}}
.p3 .succ h2{animation:riseIn .6s .35s both;}
.p3 .succ p{animation:riseIn .6s .5s both;}
.p3 .succ .btns{animation:riseIn .6s .62s both;}
@keyframes riseIn{from{opacity:0;transform:translateY(13px);}to{opacity:1;transform:none;}}
/* 바텀 시트 슬라이드 */
.p3sheet-ov{position:fixed;inset:0;background:rgba(20,26,40,.45);z-index:200;display:flex;align-items:flex-end;opacity:0;transition:opacity .3s;}
.p3sheet-ov.show{opacity:1;}
.p3sheet{width:100%;max-width:430px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 24px calc(28px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .42s var(--ease);}
.p3sheet-ov.show .p3sheet{transform:none;}
.p3sheet .grab{width:38px;height:4px;border-radius:99px;background:#DDE2EC;margin:0 auto 18px;}

/* ===== MY 스펙트럼 팔레트 (원형 펼침) ===== */
.palfan{position:relative;height:70px;transition:height .45s var(--ease);margin:8px 0 2px;}
.palfan.open{height:256px;}
.palfan-btn{position:absolute;left:50%;top:35px;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:conic-gradient(from 0deg,#f87171,#fbbf24,#34d399,#38bdf8,#a78bfa,#f472b6,#f87171);cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:2;transition:top .45s var(--ease),transform .4s var(--ease);}
.palfan.open .palfan-btn{top:128px;transform:translate(-50%,-50%) rotate(135deg);}
.palfan-btn svg{width:22px;height:22px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.pfi{position:absolute;left:50%;top:35px;width:40px;height:40px;margin:-20px;border-radius:13px;box-shadow:0 5px 12px rgba(0,0,0,.16);cursor:pointer;opacity:0;transform:translate(0,0) scale(.2);transition:transform .5s var(--ease),opacity .3s,top .45s var(--ease);display:flex;align-items:center;justify-content:center;}
.palfan.open .pfi{top:128px;opacity:1;transform:translate(var(--tx),var(--ty)) scale(1);}
.pfi.on{outline:3px solid var(--ink);outline-offset:2px;}
.pfi .pl{position:absolute;bottom:-16px;font-size:9px;font-weight:700;color:var(--sub);white-space:nowrap;opacity:0;transition:opacity .3s .2s;}
.palfan.open .pfi.on .pl{opacity:1;color:var(--ink);}
.pfi.pick{background:conic-gradient(from 0deg,#f87171,#fbbf24,#34d399,#38bdf8,#a78bfa,#f472b6,#f87171);}
.pfi.pick svg{width:15px;height:15px;stroke:#fff;stroke-width:3.4;fill:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}

/* ===== 로그인 (p3) ===== */
.login-p3{min-height:100dvh;justify-content:space-between;align-items:center;text-align:center;overflow:hidden;padding:0 26px;padding-bottom:calc(34px + env(safe-area-inset-bottom));}
.login-p3 .lg-top{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;padding:48px 0 12px;}
.login-p3 .lg-logo{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;}
.login-p3 .lg-logo::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--grad);filter:blur(30px);opacity:.34;z-index:0;animation:loHalo 4.5s var(--ease) infinite;}
@keyframes loHalo{0%,100%{transform:scale(.92);opacity:.28;}50%{transform:scale(1.08);opacity:.42;}}
.login-p3 .lg-logo img{position:relative;z-index:1;width:80px;height:80px;border-radius:26px;object-fit:cover;box-shadow:var(--sh-blue);animation:loFloat 5s ease-in-out infinite;}
@keyframes loFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.login-p3 .lg-mark{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;}
.login-p3 .lg-ko{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
.login-p3 .lg-sch{font-size:13.5px;color:var(--muted);margin-top:5px;}
.login-p3 .lg-card{width:100%;background:var(--card);border-radius:26px;padding:24px 22px;box-shadow:0 10px 30px rgba(20,26,40,.07);border:1px solid var(--line);}
.login-p3 .lg-card h3{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;color:var(--ink);}
.login-p3 .lg-card .lg-desc{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:20px;}
.login-p3 .lg-gg{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:15px 18px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:background .18s,transform .12s,box-shadow .18s;}
.login-p3 .lg-gg:hover{background:var(--bg);box-shadow:0 4px 14px rgba(20,26,40,.06);}
.login-p3 .lg-gg:active{transform:scale(.975);}
.login-p3 .lg-gg:disabled{opacity:.55;}
.login-p3 .lg-note{font-size:11.5px;color:var(--muted);margin-top:15px;line-height:1.6;}

/* ===== 홈 일정 달력 상세 ===== */
.cal-detail{margin-top:10px;padding-top:4px;border-top:1px solid var(--line);}
.cal-detail.anim{animation:calDetIn .34s var(--ease) both;}
@keyframes calDetIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.cal-detail .cal-dot{width:8px;height:8px;border-radius:50%;background:var(--grad);flex:none;box-shadow:0 2px 6px var(--ga);}
.cal-detail .cal-empty{padding:12px 2px;text-align:center;font-size:12.5px;color:var(--muted);}
.p3 .prog i,.p3 [data-day]{will-change:transform;}
.p3 [data-day]{transition:transform .13s var(--ease),background .2s,color .2s;}
.p3 [data-day]:active{transform:scale(.88);}

/* ===== 오버레이 시스템 (알림=우측상단 / 내역=중앙 카드, 뒤 화면 유지) ===== */
.ov-backdrop{position:fixed;inset:0;background:rgba(20,22,30,.14);opacity:0;transition:opacity .22s var(--ease-out);z-index:200;}
.ov-backdrop.in{opacity:1;}
.ov-panel{position:fixed;background:var(--card);border-radius:20px;box-shadow:0 18px 60px rgba(0,0,0,.22),0 4px 14px rgba(0,0,0,.10);border:1px solid var(--line);opacity:0;transition:opacity .24s var(--ease-out),transform .28s var(--ease-out);z-index:201;display:flex;flex-direction:column;overflow:hidden;}
.ov-panel.in{opacity:1;}
.ov-tr{top:60px;right:16px;width:min(360px,calc(100vw - 24px));max-height:min(560px,calc(100dvh - 90px));transform-origin:top right;transform:translateY(-10px) scale(.97);}
.ov-tr.in{transform:none;}
.ov-center{top:50%;left:50%;width:min(460px,calc(100vw - 28px));max-height:min(640px,calc(100dvh - 80px));transform-origin:center;transform:translate(-50%,-50%) scale(.96);}
.ov-center.in{transform:translate(-50%,-50%);}
.ov-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 12px 18px;border-bottom:1px solid var(--line);}
.ov-head .ov-t{font-size:16px;font-weight:800;color:var(--ink);}
.ov-head .ov-x{width:30px;height:30px;border-radius:9px;background:var(--soft);border:none;cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;transition:background .15s,transform .12s var(--ease);}
.ov-head .ov-x:active{transform:scale(.9);}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 10px;min-height:0;}
.ov-cats{flex:none;display:flex;flex-wrap:wrap;gap:7px;padding:11px 16px;border-bottom:1px solid var(--line);}
.ov-cat{border:1.5px solid var(--line);background:var(--card);color:var(--ink2);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:20px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,transform .12s var(--ease);}
.ov-cat:active{transform:scale(.94);}
.ov-cat.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.ov-datebar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--soft);}
.ov-datebar input[type=date]{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:7px 11px;background:var(--card);}
.ov-datebar .ov-dclear{font-size:12px;font-weight:700;color:var(--primary);background:none;border:none;cursor:pointer;white-space:nowrap;}
@media (prefers-reduced-motion:reduce){.ov-backdrop,.ov-panel{transition:none!important;}.ov-tr{transform:none!important;}.ov-center{transform:translate(-50%,-50%)!important;}}
@media (min-width:820px) and (min-aspect-ratio:1/1){.ov-tr{top:20px;right:26px;}}

/* ===== 알림 벨 배지 & 알림센터 ===== */
[data-bell]{position:relative;}
.nbadge{position:absolute;top:-6px;right:-9px;min-width:13px;height:13px;padding:0 3px;border-radius:99px;background:#FF4D4F;color:#fff;font-size:8.5px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px var(--card);animation:badgePop .4s var(--ease) both;z-index:5;}
.bnav-item,.bnav-subitem{position:relative;}
.bnav-item span,.bnav-subitem span{position:relative;}
.rail-badge{top:-6px;right:-11px;}
.bnav.collapsed .bnav-item>.rail-badge{top:4px;right:8px;}
@keyframes badgePop{0%{transform:scale(0);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
.p3 .ntrow{position:relative;}
.p3 .ntrow.unread{background:linear-gradient(90deg,var(--primary-tint),transparent 70%);border-radius:12px;margin:0 -6px;padding-left:6px;padding-right:6px;}
.p3 .ntrow.unread+.lrow{border-top-color:transparent;}
.p3 .ntrow .ntdot{width:8px;height:8px;border-radius:50%;background:#FF4D4F;flex:none;align-self:center;box-shadow:0 0 0 3px rgba(255,77,79,.14);}
.p3 .ntrow{cursor:pointer;transition:background var(--dur-micro) ease;}
.p3 .ntrow:active{background:var(--surface-2);}
.p3 .ntrow .ntchev{flex:none;align-self:center;color:var(--text-3);display:flex;opacity:.5;}
.p3 .ntrow .ntchev svg{width:16px;height:16px;}

/* ===================================================================
   홈 2열 래퍼 (세로에선 투명, 가로에서 그리드) + 진입 애니메이션 강화
   =================================================================== */
.home-top,.home-cols,.home-col,.money-top,.money-stack{display:contents;}
/* 홈 카드 진입: 크게 떠오르며 살짝 오버슈트 (세로/가로 공통) */
.screen.p3.home-scope>*{animation:none;}
@keyframes p3rise2{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
.screen.p3.home-scope .home-top>*,
.screen.p3.home-scope .money-top>*,
.screen.p3.home-scope .money-stack>*,
.screen.p3.home-scope .home-col>*{animation:p3rise2 .72s var(--ease-out) both;}
.screen.p3.home-scope .home-top>*:nth-child(1),
.screen.p3.home-scope .money-top>*:nth-child(1){animation-delay:.02s;}
.screen.p3.home-scope .home-top>*:nth-child(2){animation-delay:.07s;}
.screen.p3.home-scope .home-col>*:nth-child(1),
.screen.p3.home-scope .money-stack>*:nth-child(1){animation-delay:.13s;}
.screen.p3.home-scope .home-col>*:nth-child(2),
.screen.p3.home-scope .money-stack>*:nth-child(2){animation-delay:.20s;}
.screen.p3.home-scope .home-col>*:nth-child(3){animation-delay:.27s;}
.screen.p3.home-scope .home-col>*:nth-child(4){animation-delay:.34s;}

/* 급식 슬롯 전환 애니메이션 */
@keyframes mealSwap{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:none;}}
.p3 .meal.swap{animation:mealSwap .32s var(--ease) both;}
@keyframes ddPop{0%{transform:scale(.2);opacity:0;}55%{transform:scale(1.18);opacity:1;}100%{transform:scale(1);}}
.p3 .dot.pop{animation:ddPop .5s var(--ease) both;}

/* ===================================================================
   출석 보상 축하 연출
   =================================================================== */
.egg-wobble{animation:eggWobble .6s var(--ease-spring);}
@keyframes eggWobble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.12)}50%{transform:rotate(8deg) scale(1.12)}75%{transform:rotate(-5deg) scale(1.06)}100%{transform:rotate(0) scale(1)}}
.celebrate{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;}
.celebrate .glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(123,108,255,.42),rgba(123,108,255,0) 70%);animation:celGlow .9s var(--ease) both;}
@keyframes celGlow{0%{transform:scale(.3);opacity:0;}30%{opacity:1;}100%{transform:scale(1.25);opacity:0;}}
.celebrate .badge{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;animation:celBadge 1.5s var(--ease) both;}
@keyframes celBadge{0%{transform:scale(.3) translateY(20px);opacity:0;}18%{transform:scale(1.12) translateY(0);opacity:1;}30%{transform:scale(1);}78%{transform:scale(1);opacity:1;}100%{transform:scale(.92) translateY(-14px);opacity:0;}}
.celebrate .coin{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,#FFD873,#F5A623);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;box-shadow:0 14px 40px rgba(245,166,35,.5),inset 0 3px 8px rgba(255,255,255,.6);animation:coinSpin 1s var(--ease) both;}
@keyframes coinSpin{0%{transform:rotateY(0);}100%{transform:rotateY(720deg);}}
.celebrate .amt2{font-size:40px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,var(--ga),var(--gb));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 4px 20px rgba(123,108,255,.25);}
.celebrate .msg2{font-size:15px;font-weight:700;color:var(--ink);background:#fff;padding:8px 18px;border-radius:100px;box-shadow:var(--sh);}
.celebrate .p{position:absolute;top:50%;left:50%;width:13px;height:13px;border-radius:3px;opacity:0;animation:confetti 1.25s var(--ease) forwards;}
@keyframes confetti{0%{transform:translate(-50%,-50%) rotate(0);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}}

/* ===================================================================
   가로모드 (아이패드 기본) — 왼쪽 세로 레일 + 홈 2열
   =================================================================== */
@media (min-width:820px) and (min-aspect-ratio:1/1){
  #app{max-width:none;}
  /* 하단 탭 → 좌측 세로 레일 */
  .bnav{position:fixed;left:0;top:0;bottom:0;width:214px;height:100dvh;max-width:none;transform:none;flex-direction:column;align-items:stretch;border-radius:0;padding:20px 13px 16px;gap:3px;background:var(--card);border:none;border-right:1px solid var(--line);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;transition:width .28s var(--ease),padding .28s var(--ease);}
  .bnav::before{content:"okya";display:flex;align-items:center;font-size:20px;font-weight:800;color:var(--primary);letter-spacing:-.5px;padding:6px 12px 20px;}
  .bnav-item{flex:none;flex-direction:row;justify-content:flex-start;gap:13px;padding:12px 13px;border-radius:14px;font-size:15px;font-weight:700;}
  .bnav-item span{font-size:15px;}
  .bnav-item svg{width:23px;height:23px;}
  .bnav-item.active{background:var(--primary-tint);}
  .bnav-item[data-tab="my"]{margin-top:auto;}
  /* 레일 접기 버튼(우측 상단) */
  .bnav .rail-burger{display:flex;align-items:center;justify-content:center;position:absolute;top:14px;right:12px;width:34px;height:34px;border-radius:10px;background:none;border:none;cursor:pointer;color:var(--sub);transition:background .15s,color .15s;z-index:2;}
  .rail-burger:hover{background:var(--soft);color:var(--ink);}
  .bnav::before{padding-right:44px;}
  /* 접힌 레일: 아이콘만 */
  .bnav.collapsed{width:66px;padding-left:9px;padding-right:9px;align-items:center;}
  .bnav.collapsed::before{content:"O";justify-content:center;padding:6px 0 18px;}
  .bnav.collapsed .rail-burger{position:static;margin:0 auto 6px;}
  .bnav.collapsed .bnav-item{justify-content:center;gap:0;padding:12px 0;width:100%;}
  .bnav.collapsed .bnav-item span{display:none;}
  .bnav.collapsed .bnav-exp{display:none;}
  .bnav.collapsed .bnav-sub{display:none!important;}
  /* 스테이지 */
  .screen:not(.no-nav){padding-left:214px;padding-bottom:32px;background:var(--bg);transition:padding-left .28s var(--ease);}
  body.rail-collapsed .screen:not(.no-nav){padding-left:66px;}
  /* 메시지 채팅: 레일 유지 + 화면 꽉 채움 */
  .dm-screen .phdr+div,.dm-screen .phdr~div:last-child{max-width:900px;margin-left:auto;margin-right:auto;width:100%;}
  .screen.p3{background:var(--bg);}
  .screen.no-nav{max-width:600px;margin:0 auto;}
  /* 홈 헤더/그리드 폭 정렬 (flex 컬럼에서 쪼그라들지 않게 width:100%) */
  .p3 .home-top{display:block;width:100%;max-width:1080px;margin:0 auto;}
  .p3 .home-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;width:100%;max-width:1080px;margin:10px auto 0;}
  .p3 .home-col{display:flex;flex-direction:column;gap:16px;}
  .p3 .home-col>*{margin:0!important;}
  .p3 .home-top .topbar{padding-left:4px;padding-right:4px;}
  .p3 .home-top .greet{padding-left:4px;padding-right:4px;}
  /* 머니 — 잔액 카드 위 / 거래내역 아래로 길게 (단일 컬럼) */
  .p3 .money-top{display:block;width:100%;max-width:860px;margin:0 auto;}
  .p3 .money-top .topbar{padding-left:4px;padding-right:4px;}
  .p3 .money-stack{display:flex;flex-direction:column;gap:16px;width:100%;max-width:860px;margin:6px auto 0;}
  .p3 .money-stack>*{margin:0!important;}
  /* 푸시 상세 페이지: 넓은 화면에서 콘텐츠 폭 제한(가독성) + 중앙 정렬 */
  .screen.p3>.phdr,.screen.p3>#cb,.screen.p3>.chal-detail,.screen.p3>.pw-steps,.screen.p3>.vspace,.screen.p3>.pet2-hero{max-width:none;margin-left:auto;margin-right:auto;width:100%;}
}

/* 가로 — 송금/내역 등 푸시 화면을 중앙 모달 카드로 */
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .screen.no-nav.p3{flex:none;width:min(900px,95vw);height:min(94vh,960px);max-height:94vh;margin:auto;align-self:center;background:var(--card);border-radius:28px;box-shadow:0 34px 90px rgba(20,26,40,.36);overflow-y:auto;padding-bottom:0;display:flex;flex-direction:column;}
  .screen.no-nav.p3>.phdr{position:sticky;top:0;background:var(--card);z-index:5;padding:20px 26px 14px;}
  .screen.no-nav.p3>.phdr .ttl{font-size:19px;}
  /* 내부 콘텐츠도 함께 확대 (빈 공간만 커지지 않게) */
  .screen.no-nav.p3 .kpwrap{flex:1;min-height:0;width:100%;max-width:760px;margin:0 auto;padding:10px 30px 26px;}
  .screen.no-nav.p3 .kp-amt{font-size:58px;}
  .screen.no-nav.p3 .keypad{max-width:720px;margin:0 auto;gap:20px 96px;}
  .screen.no-nav.p3 .key{font-size:30px;padding:18px 0;}
  .screen.no-nav.p3 .kpto{padding:14px 18px;}
  .screen.no-nav.p3 #tf-list{flex:1;width:100%;max-width:720px;margin:0 auto;}
  .screen.no-nav.p3 .phdr+div{width:100%;max-width:720px;margin:0 auto;}
  .screen.no-nav.p3 .phdr~div:last-child{width:100%;max-width:720px;margin:0 auto;}
