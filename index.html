<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>옥야 · 창녕옥야고</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="옥야">
<meta name="theme-color" content="#5B67CA">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ── 디자인 토큰 ── */
:root{
  --bg:#F7F8FA;
  --card:#fff;
  --ink:#191F28;
  --ink2:#4E5968;
  --muted:#8B95A1;
  --line:#EEF1F5;
  --primary:#1A5CE6;
  --primary-d:#1349C0;
  --primary-tint:#EEF3FF;
  --danger:#E53E3E;
  --danger-tint:#FFF0F0;
  --r:24px;
  --sh:0 4px 20px rgba(0,0,0,.06),-2px 2px 10px rgba(0,0,0,.04);
  --sh-blue:0 10px 28px rgba(26,92,230,.22),-3px 3px 12px rgba(26,92,230,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:opacity .15s ease;}
button:active{opacity:.7;}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:13px 15px;border:none;border-radius:14px;background:#F1F3F5;color:var(--ink);outline:none;transition:background .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:0 0 0 2px var(--primary);}
label{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:6px;}
.field{margin-bottom:14px;}

/* ── Layout ── */
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
.screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(92px + env(safe-area-inset-bottom));background:var(--card);}
.screen.no-nav{padding-bottom:0;background:var(--card);}

/* ── Bottom nav (floating) ── */
.bnav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:rgba(255,255,255,.93);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);border:1px solid rgba(255,255,255,.65);display:flex;padding:8px 6px;z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10px;font-weight:600;color:var(--muted);transition:color .2s;}
.bnav-item.active{color:var(--primary);}
.bnav-item svg{width:22px;height:22px;}

/* ── 헤더 ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);}
.hdr h2{font-size:18px;font-weight:800;}
.sub-hdr{display:flex;align-items:center;gap:10px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.sub-hdr h2{font-size:18px;font-weight:800;}
.back-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);flex:none;}
.back-btn svg{width:20px;height:20px;}

/* ── 카드 (통일된 단일 스타일) ── */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:12px;}
.card-list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;}

/* ── 잔액 카드 ── */
.bal-card{background:var(--primary-tint);color:var(--primary);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh);margin:16px 20px;}
.bal-card .lbl{font-size:12px;opacity:.75;font-weight:600;letter-spacing:.03em;}
.bal-card .amt{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;line-height:1;color:var(--primary);}
.bal-card .amt small{font-size:16px;font-weight:700;opacity:.9;margin-left:2px;}
.bal-acts{display:flex;gap:8px;margin-top:16px;}
.bal-act{display:flex;align-items:center;gap:6px;background:var(--primary);border-radius:12px;padding:9px 16px;font-size:13.5px;font-weight:700;color:#fff;}
.bal-act:active{opacity:.7;}
.bal-act svg{width:15px;height:15px;}

/* ── 정보 위젯 ── */
.ic-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:4px;margin-bottom:10px;}
.ic-lbl svg{width:13px;height:13px;}
.ic-item{font-size:13px;color:var(--ink2);line-height:1.9;}
.ic-more{font-size:11.5px;color:var(--muted);margin-top:4px;}

/* ── 섹션 타이틀 ── */
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;letter-spacing:.02em;}

/* ── 리스트 아이템 ── */
.row-item{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;}
.row-item:last-child{border-bottom:none;}
.row-item:active{background:var(--bg);}
.row-ic{width:40px;height:40px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary-tint);color:var(--primary);}
.row-ic svg{width:20px;height:20px;}
.row-body{flex:1;min-width:0;}
.row-title{font-size:15px;font-weight:600;}
.row-desc{font-size:12.5px;color:var(--muted);margin-top:2px;}
.row-right{color:var(--muted);display:flex;align-items:center;}
.row-right svg{width:18px;height:18px;}

/* ── 거래 내역 아이템 ── */
.ldg-item{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--line);}
.ldg-item:last-child{border-bottom:none;}
.ldg-ic{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
.ldg-ic.up{background:var(--primary-tint);color:var(--primary);}
.ldg-ic.dn{background:#F1F3F5;color:var(--ink2);}
.ldg-body{flex:1;min-width:0;}
.ldg-body b{font-size:14px;font-weight:600;display:block;}
.ldg-body span{font-size:12px;color:var(--muted);margin-top:2px;display:block;}
.ldg-val{font-size:14px;font-weight:800;white-space:nowrap;}
.ldg-val.p{color:var(--primary);}
.ldg-val.m{color:var(--ink2);}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:15px 16px;border-radius:16px;font-size:16px;font-weight:700;background:var(--primary);color:#fff;letter-spacing:-.01em;transition:opacity .15s;}
.btn:active{opacity:.8;}
.btn.out{background:var(--primary-tint);color:var(--primary);}
.btn.gray{background:#F1F3F5;color:var(--ink2);}
.btn.danger{background:var(--danger-tint);color:var(--danger);}
.btn.green{background:#EDFAF5;color:#059669;}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;border-radius:12px;}

/* ── 필 ── */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;}
.pill.blue{background:var(--primary-tint);color:var(--primary);}
.pill.gray{background:#F1F3F5;color:var(--ink2);}
.pill.green{background:#EDFAF5;color:#059669;}
.pill.gold{background:#FFFAEB;color:#D97706;}

/* ── 탭 ── */
.tabs{display:flex;gap:4px;padding:10px 20px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 15px;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none;transition:background .2s,color .2s;}
.tab.active{background:var(--primary);color:#fff;}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:rgba(25,31,40,.92);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:200;white-space:nowrap;backdrop-filter:blur(12px);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 로더 ── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:14px;}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px;line-height:1.8;}

/* ── 반응 버튼 ── */
.react-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);}
.react-btn.on-r{background:var(--danger-tint);border-color:var(--danger);color:var(--danger);}
.react-btn.on-b{background:var(--primary-tint);border-color:var(--primary);color:var(--primary);}
.react-btn.on-g{background:#F1F3F5;border-color:#555;color:#222;}
.reacts{display:flex;gap:7px;flex-wrap:wrap;}

/* ── 기타 ── */
.check-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:15px;font-weight:500;}
.check-item input{width:auto;}
.note{font-size:13px;color:var(--muted);line-height:1.7;}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--primary);flex:none;}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:16px;margin-top:8px;}

/* ── 커뮤니티 그리드 ── */
.comm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.comm-card{background:var(--card);border-radius:var(--r);padding:22px 16px 18px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;text-align:center;}
.comm-card:active{transform:scale(.97);}
.comm-ic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:12px;}
.comm-ic svg{width:28px;height:28px;}
.comm-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.comm-desc{font-size:12px;color:var(--muted);line-height:1.4;}

/* ── 학교 그리드 ── */
.school-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:4px;}
.school-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:4px 0;}
.school-item:active{opacity:.7;}
.school-ic{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;}
.school-ic svg{width:26px;height:26px;}
.school-title{font-size:12px;font-weight:700;color:var(--ink);text-align:center;}
.school-desc{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;}

/* ── 애니메이션 ── */
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:slideUp .25s cubic-bezier(.22,1,.36,1) both;}

/* ── 스플래시 화면 ── */
.splash-screen{
  min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--bg);position:relative;
  padding:env(safe-area-inset-top) 32px env(safe-area-inset-bottom);
}
.splash-inner{
  display:flex;flex-direction:column;align-items:center;
  animation:splashIn .55s cubic-bezier(.22,1,.36,1) both;
}
@keyframes splashIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.splash-logo-wrap{
  width:92px;height:92px;border-radius:28px;overflow:hidden;
  box-shadow:0 18px 44px rgba(26,92,230,.22),0 4px 14px rgba(26,92,230,.12);
  margin-bottom:22px;
}
.splash-logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.splash-app-name{font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin-bottom:6px;}
.splash-school{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.01em;}
.splash-footer{
  position:absolute;bottom:calc(48px + env(safe-area-inset-bottom));
  left:0;right:0;display:flex;align-items:center;justify-content:center;gap:7px;
}
.splash-footer span{
  width:6px;height:6px;border-radius:50%;background:var(--line);
  animation:dotPulse 1.4s ease-in-out infinite;
}
.splash-footer span:nth-child(2){animation-delay:.2s;}
.splash-footer span:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{
  0%,70%,100%{background:var(--line);}
  35%{background:var(--primary);}
}
</style>
</head>

  return`<nav class="bnav">${tabs.map(t=>`<button class="bnav-item${TAB===t.k?' active':''}" data-tab="${t.k}">${t.ic}<span>${t.l}</span></button>`).join('')}</nav>`
}
function bindNav(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;STACK=[];routeTab()})}
function routeTab(){({home:rHome,money:rMoney,school:rSchool,comm:rComm,search:rSearch,my:rMy})[TAB]?.()}
function push(fn){STACK.push(fn);fn()}
function pop(){STACK.pop();if(STACK.length)STACK[STACK.length-1]();else routeTab()}

function rSchoolCal(){
  const ALL=[...SCHEDULE,
    {date:'2026-08-01',label:'여름방학 시작'},
    {date:'2026-09-01',label:'2학기 개학'},
    {date:'2026-10-12',label:'중간고사 시작'},
  ]
  const now=new Date()
  let vy=now.getFullYear(),vm=now.getMonth()
  const todayStr=now.toISOString().slice(0,10)
  const render=()=>{
    const first=new Date(vy,vm,1),last=new Date(vy,vm+1,0)
    const startDow=first.getDay(),days=last.getDate()
    const mStr=`${vy}-${String(vm+1).padStart(2,'0')}`
    const evMap={}
    ALL.filter(s=>s.date.startsWith(mStr)).forEach(s=>{
      const d=parseInt(s.date.split('-')[2])
      if(!evMap[d])evMap[d]=[]
      evMap[d].push(s.label)
    })
    const cells=[]
    for(let i=0;i<startDow;i++)cells.push(null)
    for(let d=1;d<=days;d++)cells.push(d)
    while(cells.length%7)cells.push(null)
    const monthEvs=ALL.filter(s=>s.date.startsWith(mStr)).sort((a,b)=>a.date>b.date?1:-1)
    app().innerHTML=`<div class="screen no-nav fade-in">
      <div class="sub-hdr"><button class="back-btn" id="bk">${I.back}</button><h2>학사일정</h2></div>
      <div style="padding:0 20px 24px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px">
          <button id="prev-m" style="background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)">${I.back}</button>
          <div style="font-size:17px;font-weight:700">${vy}년 ${vm+1}월</div>
          <button id="next-m" style="background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)">${I.chev}</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px">
          ${['일','월','화','수','목','금','토'].map((d,i)=>`<div style="text-align:center;font-size:11px;font-weight:600;padding:4px 0;color:${i===0?'var(--danger)':i===6?'var(--primary)':'var(--muted)'}">${d}</div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px">
          ${cells.map((d,i)=>{
            if(!d)return'<div></div>'
            const dow=i%7
            const ds=`${vy}-${String(vm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
            const isToday=ds===todayStr
            const hasEv=(evMap[d]||[]).length>0
            return`<div style="display:flex;flex-direction:column;align-items:center;padding:2px 0">
              <div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${isToday?'var(--primary)':'transparent'};font-size:13px;font-weight:${isToday||hasEv?700:400};color:${isToday?'#fff':dow===0?'var(--danger)':dow===6?'var(--primary)':'var(--ink)'}">${d}</div>

async function rSearch(){

    <div style="padding:14px 20px 8px">

        <button id="srch-clear" style="display:none;background:none;border:none;color:var(--muted);cursor:pointer;display:flex">${I.close}</button>
      </div>
    </div>
    <div id="srch-res" style="padding:4px 0"></div>
    <div id="dm-hist" style="padding:0 0 8px">
      <div style="padding:8px 20px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase">최근 대화</div>
      <div id="dm-hist-list"><div class="loader" style="min-height:80px"><div class="spin"></div></div></div>
    </div>
  </div>${bnav()}`
  bindNav()

  const inp=document.getElementById('srch-inp')
  const res=document.getElementById('srch-res')
  const hist=document.getElementById('dm-hist')

  const showResults=q=>{
    const trimmed=q.trim()
    hist.style.display=trimmed?'none':'block'
    if(!trimmed){res.innerHTML='';return}
    const found=USERS.filter(u=>u.id!==SESSION.id&&u.name.includes(trimmed))
    res.innerHTML=found.length
      ?found.map(u=>`<div class="row-item" data-uid="${u.id}" style="padding:12px 20px;cursor:pointer">
          <div style="width:42px;height:42px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--primary);flex:none">${u.photo?`<img src="${u.photo}" style="width:42px;height:42px;border-radius:50%;object-fit:cover">`:esc(u.name.charAt(0))}</div>
          <div class="row-body"><div class="row-title">${esc(u.name)}</div><div class="row-desc">${u.role==='admin'?'학생회':'학생'}</div></div>
          <div class="row-right">${I.chev}</div>
        </div>`).join('')
      :`<div style="padding:32px 20px;text-align:center;color:var(--muted);font-size:14px">검색 결과가 없어요</div>`
    res.querySelectorAll('[data-uid]').forEach(el=>{el.onclick=()=>push(()=>rUserProfile(el.dataset.uid))})
  }

  inp.oninput=()=>showResults(inp.value)

  // 최근 DM 로드
  let dms=[]
  try{
    const{data}=await wt(sb.from('okya_dm').select('*').or(`from_id.eq.${SESSION.id},to_id.eq.${SESSION.id}`).order('at',{ascending:false}),5000)
    const seen=new Set()
    dms=(data||[]).filter(dm=>{
      const other=dm.from_id===SESSION.id?dm.to_id:dm.from_id
      if(seen.has(other))return false
      seen.add(other)
      return true
    })
  }catch{}
  const histList=document.getElementById('dm-hist-list')
  if(!histList)return
  if(!dms.length){histList.innerHTML=`<div style="padding:20px;text-align:center;color:var(--muted);font-size:14px">아직 대화가 없어요</div>`;return}
  histList.innerHTML=dms.map(dm=>{
    const otherId=dm.from_id===SESSION.id?dm.to_id:dm.from_id
    const other=USERS.find(u=>u.id===otherId)
    const name=other?.name||'알 수 없음'
    const preview=dm.text?dm.text.slice(0,22)+(dm.text.length>22?'…':''):'사진'
    return`<div class="row-item" data-uid="${otherId}" style="padding:12px 20px;cursor:pointer">
      <div style="width:42px;height:42px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--primary);flex:none">${other?.photo?`<img src="${other.photo}" style="width:42px;height:42px;border-radius:50%;object-fit:cover">`:esc(name.charAt(0))}</div>
      <div class="row-body"><div class="row-title">${esc(name)}</div><div class="row-desc">${esc(preview)} · ${timeago(dm.at)}</div></div>
      <div class="row-right">${I.chev}</div>
    </div>`
  }).join('')
  histList.querySelectorAll('[data-uid]').forEach(el=>{el.onclick=()=>push(()=>rUserProfile(el.dataset.uid))})
}

      return`<div style="display:flex;align-items:flex-start;gap:8px;padding:${showHdr?8:2}px 14px;margin-bottom:${isLast?8:2}px"><div style="width:34px;flex:none">${showHdr?`<div style="width:34px;height:34px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--primary)">${esc(name.charAt(0))}</div>`:''}</div><div style="max-width:72%">${showHdr?`<div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px">${esc(name)}</div>`:''}<div style="background:#fff;color:var(--ink);border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:14px;line-height:1.55;word-break:break-word">${esc(m.text)}</div><div style="font-size:10px;color:var(--muted);margin-top:3px">${timeago(m.at)}</div></div></div>`
    }).join('')

  }
  await loadDms()

async function iChallenge(){
  const admin=SESSION.role==='admin'
  let evs=[],subs=[]
  try{const r=await wt(sb.from('okya_events').select('*').order('at',{ascending:false}));evs=r.data||[]}catch{}
  const expired=evs.filter(isExpired)
  if(expired.length){
    await Promise.allSettled(expired.flatMap(e=>[wt(sb.from('okya_events').delete().eq('id',e.id)).catch(()=>{}),wt(sb.from('okya_event_subs').delete().eq('event_id',e.id)).catch(()=>{})]))
    evs=evs.filter(e=>!isExpired(e))
  }
  try{const r=await wt(sb.from('okya_event_subs').select('id,event_id'));subs=r.data||[]}catch{}
  function ddTag(dl){if(!dl)return'';const d=Math.ceil((new Date(dl)-new Date())/86400000);const red=d<=1;return`<span style="font-size:11px;font-weight:700;color:${red?'var(--danger)':'var(--muted)'};background:${red?'#FEF0F1':'var(--line)'};padding:2px 7px;border-radius:6px">${red?'D-day':'D-'+d}</span>`}
  const cards=evs.length?evs.map(e=>{const cnt=subs.filter(s=>s.event_id===e.id).length;return`<div style="padding:16px 20px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><span class="pill blue">챌린지</span>${e.deadline?`<span style="font-size:11.5px;color:var(--muted)">~${fmtDate(e.deadline)}</span>`:''}${ddTag(e.deadline)}</div><div style="font-size:15px;font-weight:700;margin-bottom:3px">${esc(e.title)}</div>${e.descr?`<div style="font-size:13px;color:var(--ink2);line-height:1.5">${esc(e.descr)}</div>`:''}</div><div style="background:var(--primary);color:#fff;border-radius:11px;padding:7px 11px;font-size:14px;font-weight:800;text-align:center;flex:none">${fmt(e.reward)}<div style="font-size:10px;opacity:.8">옥</div></div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><button style="font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-tint);padding:7px 12px;border-radius:10px" data-gallery="${e.id}">📷 인증 사진 (${cnt})</button>${admin?`<button class="btn danger sm" data-cancel="${e.id}">취소</button>`:`<button class="btn out sm" data-verify="${e.id}">인증하기</button>`}</div></div>`}).join(''):'<div class="empty">진행 중인 챌린지가 없어요.</div>'
  const aform=admin?`<div style="padding:0 20px 16px"><div class="card"><div style="font-size:14px;font-weight:700;color:var(--muted);margin-bottom:12px">새 챌린지 만들기</div><div class="field"><label>제목</label><input id="et" placeholder="예: 등교 스트레칭 챌린지"></div><div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>보상(옥)</label><input id="er" type="number" placeholder="100"></div><div class="field" style="flex:1"><label>마감일</label><input id="edd" type="date"></div></div><div class="field"><label>설명</label><input id="edesc" placeholder="간단 설명"></div><button class="btn sm" id="eadd">등록</button></div></div>`:''
  document.getElementById('cb').innerHTML=`<div class="card-list" style="margin:0 20px 12px">${cards}</div>${aform}`
  const add=document.getElementById('eadd')
  if(add)add.onclick=async()=>{
    const title=document.getElementById('et').value.trim();if(!title){toast('제목을 입력해줘');return}
    try{await wt(sb.from('okya_events').insert({id:uid('e'),title,reward:parseInt(document.getElementById('er').value,10)||0,descr:document.getElementById('edesc').value.trim(),deadline:document.getElementById('edd').value?new Date(document.getElementById('edd').value+'T23:59:59').toISOString():null,at:nowISO()}))}catch{toast('등록 실패');return}
    iChallenge()
  }
  document.querySelectorAll('[data-verify]').forEach(b=>b.onclick=()=>push(()=>rVerify(b.dataset.verify)))
  document.querySelectorAll('[data-gallery]').forEach(b=>b.onclick=()=>push(()=>rGallery(b.dataset.gallery)))
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{
    await Promise.allSettled([wt(sb.from('okya_event_subs').delete().eq('event_id',b.dataset.cancel)).catch(()=>{}),wt(sb.from('okya_events').delete().eq('id',b.dataset.cancel)).catch(()=>{})])
    toast('챌린지 취소');iChallenge()
  })
}

async function rAward(subId){

  try{const[r1,r2]=await Promise.allSettled([wt(sb.from('okya_event_subs').select('*').eq('id',subId).single()),wt(sb.from('okya_events').select('*'))]);s=r1.status==='fulfilled'?r1.value.data:null;if(s&&r2.status==='fulfilled')ev=(r2.value.data||[]).find(e=>e.id===s.event_id)}catch{}

  ev=ev||{reward:0,title:''}

  app().innerHTML=`<div class="screen no-nav fade-in"><div class="sub-hdr"><button class="back-btn" id="bk">${I.back}</button><h2>옥야머니 지급</h2></div><div style="padding:20px"><div class="card" style="background:var(--primary-tint);margin-bottom:14px"><div style="font-weight:700;margin-bottom:3px">${esc(ev.title)}</div><div style="font-size:13px;color:var(--primary)">보상 ${fmt(ev.reward)}옥</div><div style="font-size:13px;margin-top:5px">제출자: <b>${esc(s.names||'-')}</b></div></div>${s.photo?`<img class="thumb" src="${s.photo}" style="margin-bottom:14px">`:''}  <label style="margin-bottom:8px">지급할 학생 선택</label><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${students.map(u=>`<label class="check-item"><input type="checkbox" value="${u.id}" ${u.id===s.by_id?'checked':''}>${esc(u.name)}</label>`).join('')}</div><button class="btn" id="pay">선택한 학생에게 ${fmt(ev.reward)}옥 지급</button></div></div>`
  document.getElementById('bk').onclick=pop

    toast(ids.length+'명 지급 완료');pop();pop()
  }
}

        <button id="gg" style="display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px 20px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);font-size:15px;font-weight:700;color:var(--ink);transition:background .15s">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google 계정으로 계속하기
        </button>

        <p style="font-size:12px;color:var(--muted);margin-top:16px;text-align:center;line-height:1.6">처음 로그인하면 자동으로 계정이 만들어져요.</p>
      </div>
    </div>
  </div>`
  const gg=document.getElementById('gg')
  gg.onmouseenter=()=>gg.style.background='var(--line)'
  gg.onmouseleave=()=>gg.style.background='var(--bg)'
  gg.onclick=async()=>{
    gg.disabled=true;gg.style.opacity='.6'
    const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin,queryParams:{prompt:'select_account'}}})
    if(error){toast('로그인 실패: '+error.message);gg.disabled=false;gg.style.opacity='1'}
  }
}

async function handleUserUpsert(authUser){
  const name=authUser.user_metadata?.full_name||authUser.user_metadata?.name||(authUser.email||'').split('@')[0]||'학생'
  let role='student'
  try{const r=await wt(sb.from('okya_users').select('role').eq('id',authUser.id).maybeSingle());if(r.data)role=r.data.role}catch{}
  try{const r=await wt(sb.from('okya_users').upsert({id:authUser.id,name,role}).select().single());SESSION=r.data||{id:authUser.id,name,role}}catch{SESSION={id:authUser.id,name,role}}
  try{const r=await wt(sb.from('okya_users').select('id,name,role'));USERS=r.data||[]}catch{}
  STACK=[];routeTab()
}

// ── 테마 ──
const THEMES=[
  {name:'파랑',primary:'#1A5CE6',d:'#1349C0',tint:'#EEF3FF'},
  {name:'보라',primary:'#7C3AED',d:'#6D28D9',tint:'#F3EEFF'},
  {name:'초록',primary:'#059669',d:'#047857',tint:'#EDFAF5'},
  {name:'주황',primary:'#D97706',d:'#B45309',tint:'#FFFAEB'},
  {name:'분홍',primary:'#DB2777',d:'#BE185D',tint:'#FCE7F3'},
  {name:'민트',primary:'#0D9488',d:'#0F766E',tint:'#CCFBF1'},
  {name:'레드',primary:'#DC2626',d:'#B91C1C',tint:'#FEE2E2'},
  {name:'하늘',primary:'#0891B2',d:'#0E7490',tint:'#E0F8FF'},
  {name:'라임',primary:'#65A30D',d:'#4D7C0F',tint:'#ECFCCB'},
  {name:'핫핑크',primary:'#EC4899',d:'#BE185D',tint:'#FDF2F8'},
]
function applyTheme(t){
  const r=document.documentElement.style
  r.setProperty('--primary',t.primary)
  r.setProperty('--primary-d',t.d)
  r.setProperty('--primary-tint',t.tint)
  r.setProperty('--sh-blue',`0 10px 28px ${t.primary}38,-3px 3px 12px ${t.primary}1a`)
  localStorage.setItem('okya-theme',JSON.stringify(t))
}

// ── 초기화 ──
;(async()=>{
  // 저장된 테마 먼저 적용
  try{const st=localStorage.getItem('okya-theme');if(st)applyTheme(JSON.parse(st))}catch{}
  const _t0=Date.now()
  // 스플래시 최소 1.5초 표시 보장
  const holdSplash=()=>new Promise(r=>setTimeout(r,Math.max(0,1500-(Date.now()-_t0))))
  const fallback=setTimeout(()=>{if(app().querySelector('.splash-screen'))rLogin()},10000)
  try{
    try{const r=await wt(sb.from('okya_users').select('id,name,role'),6000);USERS=r.data||[]}catch{}
    const{data}=await wt(sb.auth.getSession(),6000)
    clearTimeout(fallback)
    await holdSplash()
    if(data?.session?.user)await handleUserUpsert(data.session.user)
    else rLogin()
    sb.auth.onAuthStateChange(async(event,s)=>{
      if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&s)await handleUserUpsert(s.user)
      else if(event==='SIGNED_OUT'){SESSION=null;USERS=[];rLogin()}
    })
  }catch{
    clearTimeout(fallback)
    await holdSplash()
    rLogin()
  }
})()
</script>
