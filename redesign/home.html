<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>옥야 · 홈 리디자인 시안 (design only)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ============================================================
   홈 리디자인 — 순수 디자인 재현본 (더미 데이터 · 기능 없음)
   확정 후 이 마크업/스타일을 rHome() + css/ 로 이식 예정.
   ============================================================ */
:root{
  --green:#2FC178;         /* primary mint-green */
  --green-d:#25A867;
  --green-tint:#E9F8F0;    /* active pill / soft fill */
  --green-tint2:#F1FBF6;
  --ink:#1B2A24;
  --ink2:#5C6B63;
  --muted:#93A199;
  --line:#EAEFEB;
  --line2:#F1F5F2;
  --bg:#F4F7F5;
  --surface:#FFFFFF;
  --lav:#EFEBFF; --lav-i:#7C6CF0;
  --blue:#E5F0FF; --blue-i:#3A8DF0;
  --pink:#FDE9F1; --pink-i:#E8619B;
  --amber:#FFF3DC; --amber-i:#E0952A;
  --radius:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
}
.wrap{display:flex;min-height:100vh;max-width:1360px;margin:0 auto;background:var(--bg)}

/* ===== 사이드바 ===== */
.side{
  width:150px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 24px}
.brand .dot{width:24px;height:24px;border-radius:7px;background:var(--green);
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.brand .name{font-size:20px;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;
  color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--line2);color:var(--ink)}
.nav a.active{background:var(--green-tint);color:var(--green-d)}
.side .spacer{flex:1}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:13px;cursor:pointer;transition:background .16s var(--ease)}
.side-foot:hover{background:var(--line2)}
.side-foot .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#bff0d6,#7fe0ae);display:grid;place-items:center;font-size:15px;flex:none}
.side-foot .fn{font-size:13.5px;font-weight:700}
.side-foot .fr{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ===== 메인 ===== */
.main{flex:1;min-width:0;padding:26px 30px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top .eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.top-actions{display:flex;gap:8px}
.icobtn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:#5c6b63;cursor:pointer;transition:background .16s}
.icobtn:hover{background:var(--line2)}
.icobtn svg{width:19px;height:19px}
.icobtn.bell{position:relative}
.icobtn .badge{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#ff5b6b;border:2px solid #fff}

/* ===== Hero row ===== */
.hero-row{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

.hero{position:relative;overflow:hidden;padding:26px 28px;
  background:linear-gradient(135deg,#E4F7EC 0%,#F2FBF6 48%,#FFFFFF 100%);
  border:1px solid var(--line);border-radius:var(--radius);min-height:320px;
  display:flex;flex-direction:column}
.hero .leaf{position:absolute;color:#B7E7CC;opacity:.55;z-index:0}
.hero .leaf.l1{top:-10px;right:38%;width:120px;transform:rotate(15deg)}
.hero .leaf.l2{top:40px;right:6%;width:150px;transform:rotate(-8deg);opacity:.5}
.hero .leaf.l3{bottom:-24px;right:22%;width:110px;opacity:.4}
.hero>*{position:relative;z-index:1}
.hero .hb{font-size:12.5px;font-weight:700;color:var(--green-d);letter-spacing:.01em}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.seg{display:inline-flex;background:#ffffffcc;border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:16px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--ink2);padding:7px 16px;border-radius:999px;transition:.15s}
.seg button.on{background:var(--green);color:#fff}
.menu{list-style:none;margin:16px 0 0;display:flex;flex-direction:column;gap:7px}
.menu li{font-size:15.5px;font-weight:600;color:#2c3a33;padding-left:16px;position:relative}
.menu li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.hero-cta{margin-top:auto;margin-bottom:2px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  background:var(--green);color:#fff;border:0;font:inherit;font-size:13.5px;font-weight:700;
  padding:11px 18px;border-radius:12px;cursor:pointer;transition:.16s}
.hero-cta:hover{background:var(--green-d)}

/* 옥야 퀴즈 카드 */
.quiz{position:relative;overflow:hidden;padding:24px;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#F3F0FF 0%,#FBF6FF 55%,#FFF0F6 100%)}
.quiz .qb{font-size:12.5px;font-weight:700;color:#8a7fb8;text-align:right}
.quiz .qcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.quiz .qemoji{font-size:44px}
.quiz .qt{font-size:22px;font-weight:800;letter-spacing:-.02em}
.quiz .qs{font-size:13px;color:var(--ink2);margin-top:-6px}
.quiz .play{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;padding:10px 22px;border-radius:999px;cursor:pointer;
  box-shadow:0 6px 16px -8px rgba(124,108,240,.5);transition:.16s}
.quiz .play:hover{transform:translateY(-1px)}

/* ===== 바로가기 타일 ===== */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.tile{border:1px solid var(--line);border-radius:16px;padding:18px 18px;cursor:pointer;
  display:flex;align-items:center;gap:13px;background:var(--surface);transition:transform .16s var(--ease),border-color .16s}
.tile:hover{transform:translateY(-2px)}
.tile .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile .ti svg{width:21px;height:21px}
.tile .tl{font-size:14.5px;font-weight:700}
.tile.t-green .ti{background:var(--green-tint);color:var(--green-d)}
.tile.t-lav .ti{background:var(--lav);color:var(--lav-i)}
.tile.t-blue .ti{background:var(--blue);color:var(--blue-i)}
.tile.t-pink .ti{background:var(--pink);color:var(--pink-i)}

/* ===== 오늘의 학교생활 ===== */
.life{margin-top:26px}
.life h2{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
.life-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start}
.att{padding:4px 2px}
.upcoming{padding:4px 2px;border-left:1px solid var(--line);padding-left:38px;margin-left:-2px}
.att .attrow{display:flex;align-items:center;justify-content:space-between}
.att .attlbl{font-size:13px;font-weight:700;color:var(--ink2)}
.att .get{font-size:12px;font-weight:800;color:var(--green-d);background:var(--green-tint);padding:5px 12px;border-radius:999px;border:0;cursor:pointer;font-family:inherit}
.dots{display:flex;gap:10px;margin-top:14px}
.dots .d{display:flex;flex-direction:column;align-items:center;gap:6px}
.dots .dc{width:26px;height:26px;border-radius:50%;background:var(--line2);display:grid;place-items:center;
  color:var(--muted);font-size:12px;font-weight:700;border:1.5px solid var(--line)}
.dots .d.on .dc{background:var(--green);border-color:var(--green);color:#fff}
.dots .dk{font-size:11px;color:var(--muted);font-weight:600}
.bal{font-size:38px;font-weight:800;letter-spacing:-.03em;margin-top:20px;font-variant-numeric:tabular-nums}
.bal small{font-size:18px;font-weight:700;color:var(--ink2);margin-left:3px}
.gauge{height:8px;background:var(--line2);border-radius:999px;margin-top:12px;overflow:hidden}
.gauge>i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--green),#59D79B);border-radius:999px}
.gauge-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-weight:600}

.upcoming .uh{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.urow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line2)}
.urow:last-child{border-bottom:none}
.urow .ut{font-size:14.5px;font-weight:600}
.urow .ud{font-size:12px;color:var(--muted);margin-top:2px}
.urow .dd{font-size:12px;font-weight:800;color:var(--green-d);background:var(--green-tint);padding:5px 10px;border-radius:999px}
.urow .dd.soon{color:#e0603a;background:#FDEAE3}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 사이드바 ===== -->
  <aside class="side">
    <div class="brand"><div class="dot">O</div><div class="name">okya</div></div>
    <nav class="nav">
      <a class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>홈</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2" y="6" width="20" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="2.6"/></svg>머니</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11v5c0 1 5 3 5 3s5-2 5-3v-5"/></svg>학교</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M15 19a4.5 4.5 0 0 1 6 0"/></svg>커뮤</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2" y="7" width="20" height="11" rx="4"/><line x1="7" y1="12.5" x2="11" y2="12.5"/><line x1="9" y1="10.5" x2="9" y2="14.5"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="14" r="1"/></svg>아케이드</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16v11H8l-4 3z"/></svg>메시지</a>
    </nav>
    <div class="spacer"></div>
    <div class="side-foot"><div class="av">🐱</div><div><div class="fn">박민준</div><div class="fr">2학년 3반</div></div></div>
  </aside>

  <!-- ===== 메인 ===== -->
  <main class="main">
    <header class="top">
      <div class="eyebrow">오늘의 옥야 · 8월 14일 목요일</div>
      <div class="top-actions">
        <div class="icobtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
        <div class="icobtn bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.5 20a1.8 1.8 0 0 0 3 0"/></svg><span class="badge"></span></div>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero-row">
      <div class="hero">
        <svg class="leaf l1" viewBox="0 0 100 100" fill="currentColor"><path d="M50 5C30 25 20 55 50 95 80 55 70 25 50 5z"/></svg>
        <svg class="leaf l2" viewBox="0 0 100 100" fill="currentColor"><path d="M50 5C30 25 20 55 50 95 80 55 70 25 50 5z"/></svg>
        <svg class="leaf l3" viewBox="0 0 100 100" fill="currentColor"><path d="M50 5C30 25 20 55 50 95 80 55 70 25 50 5z"/></svg>
        <div class="hb">오늘의 급식</div>
        <h1>오늘의 급식</h1>
        <div class="seg"><button>조식</button><button class="on">중식</button><button>석식</button></div>
        <ul class="menu">
          <li>기장밥</li>
          <li>닭갈비</li>
          <li>미역국</li>
          <li>양배추샐러드 · 깍두기</li>
        </ul>
        <button class="hero-cta">급식 자세히 보기 <span>→</span></button>
      </div>

      <div class="card quiz">
        <div class="qb">오늘의 옥야</div>
        <div class="qcenter">
          <div class="qemoji">🧠</div>
          <div>
            <div class="qt" style="text-align:center">옥야 퀴즈</div>
            <div class="qs" style="text-align:center">오늘의 추천 게임</div>
          </div>
          <button class="play">플레이 <span>→</span></button>
        </div>
      </div>
    </section>

    <!-- 바로가기 -->
    <section class="tiles">
      <div class="tile t-green"><div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="18" rx="2.5"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/></svg></div><div class="tl">학사일정</div></div>
      <div class="tile t-lav"><div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2" y="6" width="14" height="12" rx="2.5"/><path d="M16 10l6-3v10l-6-3z"/></svg></div><div class="tl">회의록</div></div>
      <div class="tile t-blue"><div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5a2 2 0 0 1 2-2h6v16H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 1 2 2z"/></svg></div><div class="tl">책교환</div></div>
      <div class="tile t-pink"><div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="6" y="3" width="12" height="7" rx="1.5"/><rect x="4" y="10" width="16" height="8" rx="2"/><path d="M8 18v3h8v-3"/></svg></div><div class="tl">제본소</div></div>
    </section>

    <!-- 오늘의 학교생활 -->
    <section class="life">
      <h2>오늘의 학교생활</h2>
      <div class="life-grid">
        <div class="att">
          <div class="attrow"><div class="attlbl">매일 출석</div><button class="get">받기</button></div>
          <div class="dots">
            <div class="d on"><div class="dc">✓</div><div class="dk">월</div></div>
            <div class="d on"><div class="dc">✓</div><div class="dk">화</div></div>
            <div class="d on"><div class="dc">✓</div><div class="dk">수</div></div>
            <div class="d on"><div class="dc">✓</div><div class="dk">목</div></div>
            <div class="d"><div class="dc"></div><div class="dk">금</div></div>
          </div>
          <div class="bal">3,117<small>옥</small></div>
          <div class="gauge"><i></i></div>
          <div class="gauge-lbl"><span>2026년</span><span>62% 지남</span></div>
        </div>

        <div class="upcoming">
          <div class="uh">다가오는 일정</div>
          <div class="urow"><div><div class="ut">2학기 중간고사</div><div class="ud">10월 13일</div></div><div class="dd">D-12</div></div>
          <div class="urow"><div><div class="ut">체육대회</div><div class="ud">9월 26일</div></div><div class="dd soon">D-5</div></div>
          <div class="urow"><div><div class="ut">동아리 발표회</div><div class="ud">10월 2일</div></div><div class="dd">D-9</div></div>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
